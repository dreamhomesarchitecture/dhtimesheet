<style>
  :root{
    --canvas: #ffffff;
    --paper: #ffffff;
    --ink: #14130f;
    --soft: #8b887f;
    --line: #e7e4dc;
    --sage: #A4AC7F;
    --sage-tint: rgba(164,172,127,0.16);
    --tan: #BA9470;
    --tan-tint: rgba(186,148,112,0.16);
    --danger: #b3382c;
    --ink-solid: #14130f;
    --ink-tint: rgba(20,19,15,0.10);
    --topbar-bg: rgba(255,255,255,0.86);
    --shadow-sm: 0 1px 2px rgba(20,19,15,.05);
    --shadow-md: 0 10px 28px rgba(20,19,15,.07);
    --shadow-lift: 0 16px 40px rgba(20,19,15,.11);
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 22px;
  }
  :root[data-theme="dark"]{
    --canvas: #16150f;
    --paper: #201f19;
    --ink: #f1efe7;
    --soft: #9b9587;
    --line: #35332a;
    --sage-tint: rgba(164,172,127,0.22);
    --tan-tint: rgba(186,148,112,0.22);
    --danger: #d9695c;
    --ink-tint: rgba(255,255,255,0.10);
    --topbar-bg: rgba(22,21,15,0.86);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.25);
    --shadow-md: 0 10px 28px rgba(0,0,0,.35);
    --shadow-lift: 0 16px 40px rgba(0,0,0,.45);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--canvas);
    color: var(--ink);
    font-family:'DM Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding: 160px 18px 80px;
    -webkit-font-smoothing:antialiased;
  }
  #tab-content{ margin-top: 18px; }
  .app{ width:100%; max-width: 1320px; }

  .topbar{
    position:fixed; top:0; left:0; right:0;
    width:100%;
    background: var(--topbar-bg);
    backdrop-filter: blur(12px) saturate(1.15);
    -webkit-backdrop-filter: blur(12px) saturate(1.15);
    display:flex; align-items:center; justify-content:space-between;
    padding: 24px clamp(18px, 4vw, 56px) 20px;
    gap:14px;
    z-index: 50;
    border-bottom: 1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; cursor:pointer; transition:opacity .2s; }
  .brand:hover{ opacity:.7; }
  .brand img{ height:72px; width:auto; display:block; }
  .topbar-right{ display:flex; align-items:center; gap:22px; }
  .nav-links{ display:flex; gap:30px; }
  .nav-links button{
    background:none; border:none; cursor:pointer;
    font-family:'DM Sans', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; color: var(--soft);
    padding:6px 0; border-bottom:2px solid transparent;
    transition: color .18s, border-color .18s;
  }
  .nav-links button:hover{ color: var(--ink); }
  .nav-links button.active{ color: var(--ink); }
  .nav-links button[data-tab="app"].active{ border-color: var(--sage); }
  .nav-links button[data-tab="admin"].active{ border-color: var(--tan); }
  .theme-toggle-btn{
    background:none; border:none; cursor:pointer; color:var(--soft);
    font-size:17px; line-height:1; padding:4px; transition:color .18s, transform .18s; display:inline-flex; align-items:center;
  }
  .theme-toggle-btn:hover{ transform:scale(1.1); }
  .theme-toggle-btn:hover{ color:var(--ink); }
  .admin-subnav{ display:flex; gap:26px; margin-bottom:32px; border-bottom:1px solid var(--line); }
  .admin-subnav button{
    background:none; border:none; cursor:pointer;
    font-family:'DM Sans', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; color: var(--soft);
    padding:6px 0 14px; border-bottom:2px solid transparent; margin-bottom:-1px;
    transition: color .18s, border-color .18s;
  }
  .admin-subnav button:hover{ color: var(--ink); }
  .admin-subnav button.active{ color: var(--ink); border-color: var(--tan); }
  .project-search{ max-width:320px; margin-bottom:24px; }
  .project-list{ display:flex; flex-direction:column; gap:10px; }
  .project-item{ border:1px solid var(--line); border-radius: var(--radius-md); overflow:hidden; background:var(--paper); transition: box-shadow .2s, border-color .2s; }
  .project-item:hover{ box-shadow: var(--shadow-sm); }
  .project-item.open{ border-color: var(--soft); box-shadow: var(--shadow-md); }
  .project-head{ display:grid; grid-template-columns: 18px 90px 1fr 110px; gap:12px; padding:0 18px; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); margin-bottom:4px; }
  .project-row{ display:grid; grid-template-columns: 18px 90px 1fr 110px; align-items:center; gap:12px; padding:16px 18px; cursor:pointer; transition:background .15s; }
  .project-row:hover{ background: var(--sage-tint); }
  .project-row .chevron{ color:var(--soft); font-size:11px; transition:transform .2s; }
  .project-item.open .project-row .chevron{ transform:rotate(90deg); }
  .project-row .name{ font-size:14.5px; }
  .project-hours{ font-size:15px; font-weight:700; text-align:right; color:var(--tan); font-variant-numeric:tabular-nums; }
  .project-hours.zero{ color:var(--soft); font-weight:400; }
  .project-detail{ padding:8px 18px 22px 48px; border-top:1px solid var(--line); }
  .project-detail-total{ display:flex; justify-content:space-between; align-items:baseline; padding:12px 0; font-size:14px; color:var(--soft); }
  .project-detail-total b{ color:var(--ink); font-size:18px; }
  .phase-block{ border:1px solid var(--line); border-radius: var(--radius-sm); padding:14px 16px; margin-top:10px; background:var(--paper); }
  .phase-block-head{ display:flex; align-items:center; gap:10px; font-size:13.5px; }
  .phase-block-head b{ margin-left:auto; color:var(--tan); font-variant-numeric:tabular-nums; }
  .phase-employees{ margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .phase-employee-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--soft); }
  .phase-employee-row span:last-child{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .logout-link{
    background:none; border:none; cursor:pointer; color:var(--soft);
    font-family:'DM Sans', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; text-decoration:none;
    border-bottom:1px solid var(--line);
    transition: color .18s, border-color .18s;
  }
  .logout-link:hover{ color:var(--ink); border-color:var(--ink); }

  h1,h2,h3{ margin:0; }

  .sheet{
    background: transparent;
    padding: 14px 4px 28px;
    min-height: 340px;
    display:flex; flex-direction:column;
    position:relative;
  }
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color: var(--soft); margin-bottom:20px; }
  .eyebrow b{ color: var(--ink); }
  .q-title{ font-weight:800; font-size:34px; line-height:1.18; letter-spacing:-0.015em; margin-bottom:26px; }
  .q-hint{ color: var(--soft); font-size:14px; line-height:1.6; margin-bottom:28px; }
  .q-body{ flex:1; }

  textarea, input[type=text], input[type=date], input[type=month],
  input[type=number], input[type=password], select{
    width:100%;
    border: 1px solid var(--line);
    background:var(--paper);
    padding: 13px 15px;
    font-family:'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.3;
    color: var(--ink);
    border-radius: 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238b887f' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position: right 15px center;
    padding-right: 38px;
  }
  textarea:focus, input:focus, select:focus{ outline:none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--sage-tint); }

  .gate{ text-align:center; padding: 24px 10px; }
  .gate p{ color:var(--soft); font-size:14px; margin: 8px 0 20px; }
  .gate input{ max-width:220px; margin: 0 auto 16px; text-align:center; }

  .admin-block{ margin-bottom: 34px; }
  .admin-block-title{ font-weight:700; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .admin-block-title span:first-child{ color: var(--ink); }

  /* ---- Employee page (po přihlášení) ---- */
  .emp-hero{ margin-bottom:30px; }
  .emp-hero .eyebrow{ margin-bottom:14px; }
  .emp-greet{ margin:0; font-weight:900; letter-spacing:-0.035em; line-height:.98; display:flex; flex-direction:column; }
  .emp-greet-small{ font-size:clamp(20px,3vw,28px); font-weight:600; letter-spacing:-0.01em; color:var(--soft); margin-bottom:6px; }
  .emp-greet-name{ font-size:clamp(52px,11vw,120px); color:var(--sage); overflow-wrap:normal; word-break:keep-all; }
  .emp-greet-name.long{ font-size:clamp(36px,7.5vw,84px); }
  .emp-greet-name.proj{ font-size:clamp(34px,6.5vw,76px); line-height:1; letter-spacing:-0.03em; }
  .emp-page .gate-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:30px 26px; max-width:420px; text-align:left; }
  .emp-page .gate-card input{ margin:0 0 16px; max-width:none; text-align:left; }
  .emp-page .gate-card p{ margin:6px 0 18px; }
  .emp-page > .logout-link{ align-self:flex-start; }
  .emp-page > .admin-block.is-open > .project-detail{ padding:0; border-top:none; margin:0; }
  .emp-fullname{ margin-top:12px; font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--soft); }
  .emp-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:26px; }
  .emp-stat{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); padding:18px 20px 16px; position:relative; overflow:hidden; }
  .emp-stat::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--line); }
  .emp-stat.has::before{ background:var(--sage); }
  .emp-stat-label{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); margin-bottom:8px; }
  .emp-stat-value{ font-size:clamp(24px,3.4vw,34px); font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  :is(.emp-page,.adm-page) .admin-block{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:22px 26px; margin-bottom:16px; transition:box-shadow .2s, transform .2s, border-color .2s; }
  :is(.emp-page,.adm-page) .admin-block:not(.is-open){ padding-top:20px; padding-bottom:20px; }
  :is(.emp-page,.adm-page) .admin-block:not(.is-open):hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); border-color:var(--sage); }
  :is(.emp-page,.adm-page) .admin-block:not(.is-open) .admin-block-title{ margin-bottom:0; padding-bottom:0; border-bottom:none; }
  :is(.emp-page,.adm-page) .admin-block-title{ font-size:13px; letter-spacing:.16em; margin-bottom:20px; padding-bottom:16px; }
  :is(.emp-page,.adm-page) .admin-block-title > span:first-child{ flex:1; padding:2px 0; }
  :is(.emp-page,.adm-page) .admin-block-title > span:first-child > span:first-child{ width:22px !important; height:22px; border-radius:50%; background:var(--sage-tint); color:var(--ink); display:inline-flex !important; align-items:center; justify-content:center; font-size:11px; }
  .emp-page .emp-main{ border-color:var(--sage); box-shadow:var(--shadow-md); }
  :is(.emp-projects-grid,.adm-grid){ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-bottom:0; }
  :is(.emp-projects-grid,.adm-grid) .admin-block{ margin-bottom:0; min-width:0; }
  :is(.emp-projects-grid,.adm-grid) .admin-block.is-open{ grid-column:1 / -1; }
  .emp-page > .admin-block:last-child{ margin-top:16px; }
  @media (max-width:640px){
    .emp-stats{ grid-template-columns:1fr; gap:10px; }
    .emp-stat{ display:flex; align-items:baseline; justify-content:space-between; padding:14px 16px; }
    .emp-stat-label{ margin-bottom:0; }
    :is(.emp-projects-grid,.adm-grid){ grid-template-columns:minmax(0,1fr); }
    :is(.emp-page,.adm-page) .admin-block{ padding:18px 16px; border-radius:var(--radius-md); overflow-x:auto; }
  }
  .adm-page .admin-subnav{ align-self:flex-start; display:inline-flex; gap:4px; padding:4px; margin-bottom:26px; border:1px solid var(--line); border-radius:999px; background:var(--sage-tint); }
  .adm-page .admin-subnav button{ padding:9px 22px; margin:0; border:none; border-radius:999px; font-size:12px; }
  .adm-page .admin-subnav button.active{ background:var(--paper); color:var(--ink); box-shadow:var(--shadow-sm); }
  .adm-page .emp-stats{ margin-bottom:22px; }

  .resp-item{ border:1px solid var(--line); border-radius: var(--radius-md); padding:16px 20px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--paper); transition:box-shadow .2s; }
  .resp-item:hover{ box-shadow: var(--shadow-sm); }
  .resp-item .meta{ font-size:12.5px; color:var(--soft); }
  .admin-project-item{ border:1px solid var(--line); border-radius: var(--radius-md); padding:14px 18px; margin-bottom:10px; background:var(--paper); transition:box-shadow .2s; }
  .admin-project-item:hover{ box-shadow: var(--shadow-sm); }
  .admin-project-head{ display:flex; align-items:center; gap:10px; }
  .admin-project-item .admin-project-head{ flex-wrap:wrap; row-gap:8px; }

  .entry-row-labor{ display:grid; grid-template-columns: 22px 92px 1fr 90px 90px 110px 120px 28px; align-items:center; gap:10px; border:1px solid var(--line); border-radius: var(--radius-sm); padding:13px 15px; transition:border-color .15s, box-shadow .15s; background:var(--paper); }
  .entry-row-labor:hover{ border-color: var(--soft); box-shadow: var(--shadow-sm); }

  .entry-head-clientexp{ display:grid; grid-template-columns: 92px 130px 70px 64px 1fr 110px 100px 28px; gap:10px; padding:0 15px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); margin-bottom:4px; }
  .entry-row-clientexp{ display:grid; grid-template-columns: 92px 130px 70px 64px 1fr 110px 100px 28px; align-items:center; gap:10px; border:1px solid var(--line); border-radius: var(--radius-sm); padding:13px 15px; transition:border-color .15s, box-shadow .15s; background:var(--paper); }
  .entry-row-clientexp:hover{ border-color: var(--soft); box-shadow: var(--shadow-sm); }
  .client-export-note{ font-size:13px; padding:8px 10px; }

  .combo-wrap{ position:relative; }
  .combo-input{ width:100%; }
  .combo-list{ position:absolute; z-index:60; top:calc(100% + 6px); left:0; min-width:280px; max-height:240px; overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow-lift); }
  .combo-item{ padding:10px 14px; font-size:14px; cursor:pointer; transition:background .12s; }
  .combo-item:hover, .combo-item.active{ background:var(--sage-tint); }
  .combo-empty{ padding:10px 14px; font-size:13px; color:var(--soft); }

  .closed-head{ display:grid; grid-template-columns: 1fr 130px 130px 90px; gap:10px; padding:0 15px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); margin-bottom:8px; }
  .closed-row{ display:grid; grid-template-columns: 1fr 130px 130px 90px; align-items:center; gap:10px; border:1px solid var(--line); border-radius: var(--radius-sm); padding:13px 15px; background:var(--paper); }
  .closed-row .num{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }

  .action-toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px); display:flex; align-items:center; gap:14px; max-width:min(92vw,520px); background:var(--ink-solid); color:#fff; font-size:13.5px; font-weight:600; padding:12px 14px 12px 20px; border-radius:999px; box-shadow:var(--shadow-lift); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:90; }
  .action-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .action-toast.warn{ background:var(--danger); border-radius:var(--radius-md); }
  .action-toast-btn{ background:var(--sage); color:#14130f; border:none; border-radius:999px; padding:7px 14px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap; }
  .action-toast-btn:hover{ filter:brightness(1.08); }
  .lock-chips{ display:flex; flex-wrap:wrap; gap:10px; }
  .lock-chip{ display:inline-flex; align-items:center; gap:8px; background:var(--tan-tint); color:var(--ink); border-radius:999px; padding:6px 8px 6px 14px; font-size:13px; font-weight:600; }
  .lock-chip-open{ background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px 11px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; color:var(--ink); }
  .lock-chip-open:hover{ border-color:var(--ink); }
  .bw-count{ display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 7px; border-radius:999px; background:var(--tan); color:#fff; font-size:12px; font-weight:800; margin-left:8px; letter-spacing:0; }
  .bw-count.over{ background:var(--danger); }
  .bw-row{ border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:10px; background:var(--paper); }
  .bw-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .bw-name{ font-weight:700; }
  .bw-phase{ color:var(--soft); font-size:13px; }
  .bw-pct{ margin-left:auto; font-size:18px; font-variant-numeric:tabular-nums; color:var(--tan); }
  .bw-row.over .bw-pct{ color:var(--danger); }
  .bw-bar{ height:8px; background:var(--tan-tint); border-radius:999px; overflow:hidden; margin:10px 0 8px; }
  .bw-bar i{ display:block; height:100%; background:var(--tan); border-radius:999px; }
  .bw-row.over .bw-bar{ background:rgba(179,56,44,.15); }
  .bw-row.over .bw-bar i{ background:var(--danger); }
  .bw-sum{ font-size:12.5px; color:var(--soft); }
  .lock-badge{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--tan); background:var(--tan-tint); border-radius:999px; padding:5px 12px; }
  .entry-lock{ display:inline-flex; align-items:center; justify-content:center; width:29px; height:29px; color:var(--soft); opacity:.7; }
  .row-locked .entry-num, .row-locked .entry-note{ opacity:.85; }
  .stamp-toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    background: var(--ink-solid); color:#fff; font-weight:700; font-size:12.5px;
    letter-spacing:.1em; text-transform:uppercase; padding:12px 22px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; z-index:80;
    box-shadow: var(--shadow-lift);
  }
  .stamp-toast.show{ opacity:1; transform:translateX(-50%) translateY(-8px); }

  .app-foot{ color: var(--soft); font-size:12px; text-align:center; margin-top:36px; line-height:1.7; max-width:520px; margin-left:auto; margin-right:auto; }

  @media (max-width:520px){
    [data-payment-row]{ flex-wrap: wrap; }
    [data-payment-row] .payment-note-input{ flex: 1 1 100%; }
    .sheet{ padding:12px 2px 22px; }
    .topbar{ padding: 18px 18px 16px; }
    .brand img{ height:56px; }
    .topbar.topbar-two-rows{ flex-wrap:wrap; row-gap:10px; padding-bottom:14px; }
    .topbar-two-rows .topbar-right{ width:100%; justify-content:space-between; gap:12px; }
    .topbar-two-rows .nav-links{ gap:18px; }
    .nav-links{ gap:16px; }
    .nav-links button{ font-size:10.5px; }
    .entry-head{ display:none; }
    .entry-row{ grid-template-columns: 1fr; gap:6px; }
    .entry-head-mine{ display:none; }
    .entry-row-mine{ grid-template-columns: 1fr; gap:6px; }
    .entry-row-mine.entry-row-edit{ grid-template-columns: 1fr; }
    .entry-row-edit .my-entry-edit-note, .entry-row-edit .my-entry-edit-actions{ grid-column: auto; justify-self:stretch; }
    .project-form-grid{ grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); }
    .entry-head-compact{ display:none; }
    .entry-row-compact{ grid-template-columns: 1fr; gap:6px; }
    .entry-head-wide{ display:none; }
    .entry-row-wide{ grid-template-columns: 1fr; gap:6px; }
    .entry-head-cost{ display:none; }
    .entry-row-cost{ grid-template-columns: 1fr; gap:6px; }
    .entry-head-labor{ display:none; }
    .entry-row-labor{ grid-template-columns: 1fr; gap:6px; }
    .entry-head-clientexp{ display:none; }
    .entry-row-clientexp{ grid-template-columns: 1fr; gap:6px; }
    .closed-head{ display:none; }
    .closed-row{ grid-template-columns: 1fr; gap:6px; }
    .closed-row .num{ text-align:left; }
    .project-head{ display:none; }
    .project-row{ grid-template-columns: 16px auto 1fr; }
    .project-hours{ grid-column: 1 / -1; text-align:left; }
    .project-detail{ padding-left:16px; }
    .entry-form-row .field-row{ flex:1 1 100%; width:100%; }
    .entry-form-row .w-date, .entry-form-row .w-hours, .entry-form-row .w-select, .entry-form-row .w-cost, .entry-form-row .grow{ width:100%; }
    .entry-form-row .w-btn .btn{ width:100%; }
  }
</style>

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function enhanceSearchableSelect(selectEl){
  if(!selectEl || selectEl.dataset.comboBound) return;
  selectEl.dataset.comboBound = "1";
  selectEl.style.display = "none";

  const wrap = document.createElement("div");
  wrap.className = "combo-wrap";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "combo-input";
  input.autocomplete = "off";
  input.placeholder = "Hledat…";
  const list = document.createElement("div");
  list.className = "combo-list";
  list.hidden = true;

  selectEl.insertAdjacentElement("afterend", wrap);
  wrap.appendChild(input);
  wrap.appendChild(list);

  const options = Array.from(selectEl.options).map(o => ({ value: o.value, label: o.textContent }));

  function syncInputFromSelect(){
    const opt = options.find(o => o.value === selectEl.value);
    input.value = opt ? opt.label : "";
  }
  syncInputFromSelect();

  function renderList(filterText){
    const q = filterText.trim().toLowerCase();
    const matches = q ? options.filter(o => o.label.toLowerCase().includes(q)) : options;
    list.innerHTML = matches.length
      ? matches.slice(0, 300).map(o => `<div class="combo-item" data-value="${esc(o.value)}">${esc(o.label)}</div>`).join("")
      : `<div class="combo-empty">Nic nenalezeno</div>`;
    list.hidden = false;
  }

  input.addEventListener("focus", () => renderList(input.value === (options.find(o=>o.value===selectEl.value)||{}).label ? "" : input.value));
  input.addEventListener("input", () => renderList(input.value));
  input.addEventListener("blur", () => {
    setTimeout(() => { list.hidden = true; syncInputFromSelect(); }, 150);
  });
  list.addEventListener("mousedown", e => {
    const item = e.target.closest(".combo-item");
    if(!item) return;
    e.preventDefault();
    selectEl.value = item.getAttribute("data-value");

function shiftDateByMonths(dateStr, deltaMonths){
  if(!dateStr) return dateStr;
  const [y, m, d] = dateStr.split("-").map(Number);
  const targetM0 = (m - 1) + deltaMonths;
  const targetFirst = new Date(y, targetM0, 1);
  const targetY = targetFirst.getFullYear(), targetMonth0 = targetFirst.getMonth();
  const lastDayOfTarget = new Date(targetY, targetMonth0 + 1, 0).getDate();
  return `${targetY}-${pad2(targetMonth0+1)}-${pad2(Math.min(d, lastDayOfTarget))}`;
}

function sheetSafeName(name, taken){
  let base = String(name || "").replace(/[\/\\?*\[\]:]/g, " ").trim().slice(0, 31) || "Zaměstnanec";
  let candidate = base;
  let n = 2;
  while(taken.has(candidate)){
    const suffix = ` (${n})`;
    candidate = base.slice(0, 31 - suffix.length) + suffix;
    n++;
  }
  taken.add(candidate);
  return candidate;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function arrayBufferToBase64(buffer){
  let binary = "";
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for(let i = 0; i < bytes.length; i += chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}
let pdfFontCache = null;

      fetch("https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/lato/Lato-Bold.ttf").then(r => r.arrayBuffer())
    ]);
    pdfFontCache = { regular: arrayBufferToBase64(regBuf), bold: arrayBufferToBase64(boldBuf) };
  }
  doc.addFileToVFS("Lato-Regular.ttf", pdfFontCache.regular);
  doc.addFont("Lato-Regular.ttf", "Lato", "normal");
  doc.addFileToVFS("Lato-Bold.ttf", pdfFontCache.bold);
  doc.addFont("Lato-Bold.ttf", "Lato", "bold");
}

function czechAccountToIban(accountStr){
  const m = String(accountStr||"").trim().match(/^(?:(\d{1,6})-)?(\d{1,10})\/(\d{4})$/);
  if(!m) return "";
  const prefix = (m[1]||"").padStart(6,"0");
  const account = m[2].padStart(10,"0");
  const bankCode = m[3];
  const bban = bankCode + prefix + account;
  const checkBase = bban + "123500";
  let remainder = 0;
  for(let i = 0; i < checkBase.length; i++){
    remainder = (remainder * 10 + Number(checkBase[i])) % 97;
  }
  const checkDigits = String(98 - remainder).padStart(2, "0");
  return `CZ${checkDigits}${bban}`;
}
function resolveIban(accountStr){
  if(!accountStr) return "";
  const compact = String(accountStr).replace(/\s+/g, "").toUpperCase();
  if(/^[A-Z]{2}\d{2}[A-Z0-9]+$/.test(compact)) return compact;
  return czechAccountToIban(accountStr);
}
function stripDiacritics(str){
  return String(str||"").normalize("NFD").replace(/[̀-ͯ]/g, "");
}
function buildCzechQrPaymentString({ iban, amount, vs, msg }){
  if(!iban) return "";
  const parts = ["SPD*1.0", `ACC:${iban}`];
  if(amount !== undefined && amount !== null && amount !== ""){
    parts.push(`AM:${Number(amount).toFixed(2)}`);
  }
  parts.push("CC:CZK");
  const vsDigits = String(vs||"").replace(/\D/g, "").slice(0,10);
  if(vsDigits) parts.push(`X-VS:${vsDigits}`);
  if(msg){
    const cleanMsg = stripDiacritics(String(msg)).replace(/\*/g, " ").slice(0,60);
    if(cleanMsg) parts.push(`MSG:${cleanMsg}`);
  }
  return parts.join("*");
}
function drawQrCodeInPdf(doc, text, x, y, sizeMm){
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  const count = qr.getModuleCount();
  const cell = sizeMm / count;
  doc.setFillColor(0,0,0);
  for(let row = 0; row < count; row++){
    for(let col = 0; col < count; col++){
      if(qr.isDark(row, col)){
        doc.rect(x + col*cell, y + row*cell, cell, cell, "F");
      }
    }
  }
}

function b64ToUint8Array(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// Fills in the "Smlouva o dilo - DSP a inzenyring" .docx template with data from the
// project, the selected client billing profile and the export-time overrides, and
// returns a Blob ready for download. Fáze 1 = phase "DSP", fáze 2 = phase "I", their
// budget totals and the 50/50 payment split mirror the structure of the source contract.
// Computes the values that vary across the "Smlouva o dilo - DSP a inzenyring"
// contract (client, site, prices, hourly rate, signature block) from the project,
// the selected client billing profile and export-time overrides. Shared by both
// the .docx template filler and the PDF renderer so the two stay in sync.
function computeDspInzenyringContractFields(project, customer, opts){
  opts = opts || {};
  const vatRate = Number(opts.vatRate) || 21;
  const hourlyRate = Number(opts.hourlyRate) || 890;
  const sitePhrase = (opts.sitePhrase || project.location || "").trim();
  const signPlace = (opts.signPlace || "").trim();
  const signDate = fmtDateCzLong(opts.signDate || todayStr());
  const clientName = (customer.name || "").trim();
  const clientAddress = (customer.address || "").trim();

  const faze1 = phaseBudgetTotal(project, "DSP");
  const faze2 = phaseBudgetTotal(project, "I");
  const total = faze1 + faze2;
  const withVat = n => n * (1 + vatRate/100);
  const aAmt = 0.5*faze1 + 0.5*faze2;
  const bAmt = 0.5*faze1;
  const cAmt = 0.5*faze2;
  const hourlyRateFmt = hourlyRate.toLocaleString("cs-CZ");

  return { vatRate, hourlyRate, hourlyRateFmt, sitePhrase, signPlace, signDate, clientName, clientAddress, faze1, faze2, total, withVat, aAmt, bAmt, cAmt };
}

async function generateDspInzenyringContract(project, customer, opts){
  const f = computeDspInzenyringContractFields(project, customer, opts);
  const { vatRate, hourlyRate, hourlyRateFmt, sitePhrase, signPlace, signDate, clientName, clientAddress, faze1, faze2, total, withVat, aAmt, bAmt, cAmt } = f;

  const sampleName = ["Jan", "Svoboda,"].join(" ");
  const sampleAddress = "bytem č.p. 4, 675 05 Rohy";
  const sampleSitePhrase = "ve Velkém Meziříčí, na pozemku parc. č. 3700/70 v katastrálním území Velké Meziříčí ";
  const sampleSignBlank = "V __________________ dne __________________";
  const replacements = [
    [sampleName, `${clientName},`],
    [sampleAddress, `bytem ${clientAddress}`],
    [sampleSitePhrase, `${sitePhrase} `],
    ["Cena fáze 1 činí 187 500,- Kč bez DPH; při sazbě DPH 21 % činí 226 875,- Kč včetně DPH.",
      `Cena fáze 1 činí ${czContractPrice(faze1)} bez DPH; při sazbě DPH ${vatRate} % činí ${czContractPrice(withVat(faze1))} včetně DPH.`],
    ["Cena fáze 2 činí 31 000,- Kč bez DPH; při sazbě DPH 21 % činí 37 510,- Kč včetně DPH.",
      `Cena fáze 2 činí ${czContractPrice(faze2)} bez DPH; při sazbě DPH ${vatRate} % činí ${czContractPrice(withVat(faze2))} včetně DPH.`],
    ["Celková cena Díla činí 218 500,- Kč bez DPH; při sazbě DPH 21 % činí 264 385,- Kč včetně DPH.",
      `Celková cena Díla činí ${czContractPrice(total)} bez DPH; při sazbě DPH ${vatRate} % činí ${czContractPrice(withVat(total))} včetně DPH.`],
    ["a) při zahájení Díla 50 % ceny fáze 1 a 50 % ceny fáze 2, tj. 109 250,- Kč bez DPH; při sazbě DPH 21 % celkem 132 192,50 Kč včetně DPH,",
      `a) při zahájení Díla 50 % ceny fáze 1 a 50 % ceny fáze 2, tj. ${czContractPrice(aAmt)} bez DPH; při sazbě DPH ${vatRate} % celkem ${czContractPrice(withVat(aAmt))} včetně DPH,`],
    ["b) po předání fáze 1 zbývajících 50 % ceny fáze 1, tj. 93 750,- Kč bez DPH; při sazbě DPH 21 % celkem 113 437,50 Kč včetně DPH,",
      `b) po předání fáze 1 zbývajících 50 % ceny fáze 1, tj. ${czContractPrice(bAmt)} bez DPH; při sazbě DPH ${vatRate} % celkem ${czContractPrice(withVat(bAmt))} včetně DPH,`],
    ["c) zbývajících 50 % ceny fáze 2, tj. 15 500,- Kč bez DPH, po vydání rozhodnutí o povolení záměru.",
      `c) zbývajících 50 % ceny fáze 2, tj. ${czContractPrice(cAmt)} bez DPH, po vydání rozhodnutí o povolení záměru.`],
    ["Jan Svoboda</w:t>", `${clientName}</w:t>`],
    [sampleSignBlank, `V ${signPlace} dne ${signDate}`],
  ];

  const bytes = b64ToUint8Array(CONTRACT_TEMPLATE_DSP_INZENYRING_B64);
  const zip = await JSZip.loadAsync(bytes);
  let xml = await zip.file("word/document.xml").async("string");
  replacements.forEach(([from, to]) => {
    if(!xml.includes(from)) return;
    xml = xml.replace(from, to);
  });
  xml = xml.split("890,- Kč bez DPH").join(`${hourlyRateFmt},- Kč bez DPH`);
  // The yellow shading in the source template only marks which fields to fill in;
  // strip it from the generated contract so the final document looks finished.
  xml = xml.split('w:fill="fff2cc"').join('w:fill="auto"');
  zip.file("word/document.xml", xml);
  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", compression: "DEFLATE" });
}

      y = marginTop;

  clause("2.4. Po dobu prodlení Objednatele s poskytnutím potřebné součinnosti neběží Zhotoviteli doba plnění. Doba plnění se dále přiměřeně prodlužuje o dobu čekání na vyjádření, stanoviska, podklady nebo úkony třetích osob a orgánů veřejné moci, které Zhotovitel nemůže ovlivnit.");

  clause("2.6. Změny zadání požadované Objednatelem, které vyvolají změnu nebo přepracování již provedených prací, nejsou zahrnuty v ceně Díla a považují se za práce nad rámec Díla. Jejich provedení a cena se řídí příslušnými ustanoveními této Smlouvy o pracích nad rámec Díla.");
  clause("2.7. Vyžaduje-li provedení činností podle této Smlouvy udělení plné moci Zhotoviteli nebo jím určené osobě, poskytne ji Objednatel bez zbytečného odkladu na žádost Zhotovitele. Do jejího poskytnutí není Zhotovitel v prodlení s činnostmi, které bez takové plné moci nelze provést.");
  clause("2.8. Dokumentace fáze 1 se považuje za předanou okamžikem jejího odeslání Objednateli v elektronické podobě na jím sdělenou e-mailovou adresu nebo okamžikem jejího zpřístupnění Objednateli prostřednictvím elektronického úložiště, o němž byl Objednatel informován.");

  heading("Článek 3 – Cena Díla a platební podmínky");
  clause(`3.1. Cena fáze 1 činí ${czContractPrice(faze1)} bez DPH; při sazbě DPH ${vatRate} % činí ${czContractPrice(withVat(faze1))} včetně DPH.`);

  clause(`b) po předání fáze 1 zbývajících 50 % ceny fáze 1, tj. ${czContractPrice(bAmt)} bez DPH; při sazbě DPH ${vatRate} % celkem ${czContractPrice(withVat(bAmt))} včetně DPH,`);
  clause(`c) zbývajících 50 % ceny fáze 2, tj. ${czContractPrice(cAmt)} bez DPH, po vydání rozhodnutí o povolení záměru. Pokud k vydání rozhodnutí nedojde z důvodů, které Zhotovitel nezavinil, vzniká Zhotoviteli právo na úhradu této části ceny po provedení činností sjednaných v rámci fáze 2, které bylo za daných okolností možné a účelné provést.`);

  clause("3.8. V ceně Díla nejsou zahrnuty zejména geodetické zaměření pozemku, geometrické plány, hydrogeologické posouzení, inženýrsko-geologický průzkum, radonový průzkum, hlukové, dopravní, dendrologické, biologické a jiné odborné průzkumy, studie a posudky ani jiné obdobné podklady zpracovávané třetími osobami, není-li v této Smlouvě výslovně uvedeno jinak. Budou-li tyto nebo jiné obdobné podklady pro řádné zpracování dokumentace nebo povolení záměru potřebné, zajistí je Objednatel, případně je Zhotovitel po předchozím odsouhlasení Objednatelem obstará na jeho náklady.");

  heading("Článek 4 – Provádění Díla a práce nad rámec");

  clause(`4.5. Práce a výkony nad rámec sjednaného Díla budou provedeny po předchozím odsouhlasení Objednatelem. Není-li jejich cena sjednána pevnou částkou, budou účtovány podle skutečně vynaloženého času sazbou ${hourlyRateFmt},- Kč bez DPH za hodinu. Zhotovitel není povinen práce nad rámec Díla zahájit před jejich odsouhlasením Objednatelem.`);
  clause("4.6. Pro odsouhlasení změn zadání, víceprací, jejich rozsahu a ceny postačuje písemná komunikace mezi Stranami, včetně komunikace prostřednictvím e-mailu. Takové odsouhlasení se pro účely této Smlouvy nepovažuje za změnu Smlouvy vyžadující uzavření dodatku podle čl. 7.2.");
  clause("4.7. Zhotovitel je oprávněn vycházet z údajů, informací a podkladů předaných Objednatelem nebo třetími osobami. Zhotovitel neodpovídá za vady Díla, prodlení ani nutnost přepracování Díla způsobené nesprávností, neúplností nebo pozdějším doplněním či změnou těchto podkladů, pokud jejich nesprávnost nebo neúplnost nemohl Zhotovitel při vynaložení odborné péče rozumně zjistit. Případné práce vyvolané takovou skutečností se považují za práce nad rámec Díla.");
  clause("4.8. Zhotovitel neodpovídá za vady, škody ani jiné následky vzniklé v důsledku změny, doplnění nebo jiného zásahu do dokumentace provedeného Objednatelem nebo třetí osobou bez předchozího písemného souhlasu Zhotovitele ani za použití dokumentace v rozporu s účelem sjednaným touto Smlouvou.");

  heading("Článek 5 – Ukončení Smlouvy");

  clause("5.2. Objednatel může Smlouvu vypovědět i bez uvedení důvodu. Zhotovitel může Smlouvu vypovědět, neposkytuje-li Objednatel potřebnou součinnost ani po prokazatelné výzvě k nápravě.");
  clause(`5.3. Při předčasném ukončení Smlouvy je Objednatel povinen uhradit Zhotoviteli cenu prací a výkonů skutečně provedených do okamžiku ukončení Smlouvy a účelně vynaložené náklady. Nelze-li hodnotu rozpracovaného plnění určit podle dokončených částí Díla, bude určena podle skutečně vynaloženého času sazbou ${hourlyRateFmt},- Kč bez DPH za hodinu. Zhotovitel předá Objednateli rozpracované výstupy odpovídající uhrazenému plnění.`);
  clause("5.4. Výpověď, odstoupení nebo dohoda o ukončení Smlouvy musí mít písemnou formu.");

  heading("Článek 6 – Autorská práva a prezentace");
  clause("6.1. Tato Smlouva nabývá účinnosti dnem podpisu oběma Stranami.");
  clause("6.2. Zhotovitel je oprávněn použít vyobrazení a části dokumentace Díla pro svou profesní prezentaci, zejména v portfoliu, na webových stránkách, sociálních sítích a v odborných publikacích, bez uvedení osobních nebo jiných neveřejných údajů Objednatele.");
  clause("6.3. Majetková autorská práva k autorskému dílu nejsou převáděna. Po úplném uhrazení ceny příslušné části Díla získává Objednatel nevýhradní oprávnění užít dokumentaci pro účely povolení a realizace Stavby na místě uvedeném v této Smlouvě.");

  heading("Článek 7 – Závěrečná ustanovení");
  clause("7.1. Právní vztahy neupravené touto Smlouvou se řídí zejména občanským zákoníkem, stavebním zákonem a souvisejícími právními předpisy.");
  clause("7.2. Změny této Smlouvy lze činit pouze písemnými, vzestupně číslovanými dodatky podepsanými oběma Stranami, nestanoví-li tato Smlouva výslovně jinak.");
  clause("7.3. Strany prohlašují, že si Smlouvu přečetly, jejímu obsahu rozumějí, souhlasí s ním a uzavírají ji svobodně a vážně.");
  clause("7.4. Případné spory se Strany pokusí řešit přednostně smírně. Nedojde-li ke smírnému řešení do 30 dnů od písemné výzvy jedné Strany, bude spor řešen věcně a místně příslušným soudem.");
  clause("7.5. Smlouva může být podepsána ve dvou stejnopisech nebo elektronicky; každá Strana obdrží jedno vyhotovení.");
  clause("7.6. Je-li Objednatel spotřebitelem a byla-li tato Smlouva uzavřena způsobem, při němž právní předpisy přiznávají Objednateli právo na odstoupení od Smlouvy ve lhůtě stanovené zákonem, Objednatel výslovně žádá, aby Zhotovitel zahájil poskytování sjednaných služeb před uplynutím této lhůty. Objednatel bere na vědomí, že v případě odstoupení po zahájení plnění je povinen uhradit poměrnou část ceny za plnění poskytnuté do okamžiku odstoupení, stanoví-li tak právní předpisy.");

  block(`V ${signPlace} dne ${signDate}`, { fontSize: 9.5, lineH: 4.6, spaceBefore: 8, spaceAfter: 18 });

  ensureSpace(28);
  const colW = (contentWidth - 16) / 2;
  const sigX1 = marginX, sigX2 = marginX + colW + 16;

  doc.setFontSize(9.5);

  y += 4.6;
  doc.text("", sigX1, y);
  doc.text("Zhotovitel", sigX2, y);

  return doc;
}

async function buildProformaInvoicePdf(project, rows, supplier, customer, opts){
  opts = opts || {};
  const doc = new jspdf.jsPDF({ unit: "mm", format: "a4" });
  await ensurePdfFont(doc);
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const marginX = 9;

  try{
    const logoH = 15, logoW = logoH * (500/278);
    doc.addImage(BRAND_LOGO, "PNG", pageWidth/2 - logoW/2, 12, logoW, logoH);
  }catch(e){}

  doc.setFont("Lato", "bold");
  doc.setFontSize(19);
  doc.text("proforma faktura", pageWidth/2, 46, { align: "center" });

  doc.setFont("Lato", "bold");
  doc.setFontSize(13);
  doc.setTextColor(179,56,44);
  doc.text("TOTO NENÍ DAŇOVÝ DOKLAD", pageWidth/2, 55, { align: "center" });
  doc.setTextColor(0,0,0);

  const issueDate = todayStr();
  const dueDate = opts.dueDate || addDaysToDateStr(issueDate, 7);
  const invoiceNumber = opts.invoiceNumber || "";

  let y = 70;
  const infoRows = [
    ["číslo faktury / var. symbol", invoiceNumber],
    ["datum vystavení", fmtDateDotsPadded(issueDate)],
    ["datum splatnosti", fmtDateDotsPadded(dueDate)],
    ["stavba", `${project.id}${jobNumberSuffix(project.name)} - ${project.name || ""}`]
  ];
  doc.setFontSize(10);
  infoRows.forEach(([label, value]) => {
    doc.setFont("Lato", "bold");
    doc.text(label, marginX, y);
    doc.setFont("Lato", "normal");
    doc.text(String(value), pageWidth - marginX, y, { align: "right" });
    y += 5.5;
  });

  y += 6;
  const colWidth = (pageWidth - marginX * 2 - 10) / 2;
  const partyBlock = (title, party, x) => {
    let py = y;
    doc.setFont("Lato", "bold");
    doc.setFontSize(10.5);
    doc.text(title, x, py);
    py += 6;
    doc.setFontSize(9.5);
    const lines = [
      party.name || "",
      party.address || "",
      party.ico ? `IČ: ${party.ico}` : "",
      party.dic ? `DIČ: ${party.dic}` : "",
      party.bankAccount ? `Č. účtu: ${party.bankAccount}` : "",
      party.email || "",
      party.phone || ""
    ].filter(Boolean);
    lines.forEach(line => {
      doc.setFont("Lato", line === (party.name||"") ? "bold" : "normal");
      const wrapped = doc.splitTextToSize(line, colWidth);
      wrapped.forEach(w => { doc.text(w, x, py); py += 4.8; });
    });
    return py;
  };
  const dodavatelBottom = partyBlock("DODAVATEL", supplier || {}, marginX);
  const odberatelBottom = partyBlock("ODBĚRATEL", customer || {}, marginX + colWidth + 10);
  y = Math.max(dodavatelBottom, odberatelBottom) + 6;

  const bodyRows = [];
  rows.forEach(r => {
    (r.payments || []).forEach(pay => {
      bodyRows.push([r.phaseId, r.label, pay.number || "", fmtKc(Number(pay.amount)||0)]);
    });
  });
  const total = opts.totalAmount !== undefined ? opts.totalAmount : rows.reduce((s,r) => s + (r.payments||[]).reduce((s2,pay) => s2 + (Number(pay.amount)||0), 0), 0);

  doc.autoTable({
    startY: y,
    head: [["FÁZE", "POLOŽKA ROZPOČTU", "Č. PLATBY", "ČÁSTKA BEZ DPH"]],
    body: bodyRows,
    styles: { font: "Lato", fontSize: 9, cellPadding: 2.2, valign: "middle" },
    headStyles: { fillColor: [164,172,127], textColor: [255,255,255], fontStyle: "bold", fontSize: 8 },
    alternateRowStyles: { fillColor: [246,245,241] },
    columnStyles: {
      0: { cellWidth: 22 },
      1: { cellWidth: "auto" },
      2: { cellWidth: 28 },
      3: { cellWidth: 34, halign: "right" }
    },
    margin: { left: marginX, right: marginX, bottom: 24 }
  });

  const vatRate = Number(supplier && supplier.vatRate) || 0;
  const vatAmount = total * vatRate / 100;
  const totalWithVat = total + vatAmount;
  const amountDue = vatRate > 0 ? totalWithVat : total;

  let ty = doc.lastAutoTable.finalY + 10;
  if(ty + 32 > pageHeight - 32){
    doc.addPage();
    ty = 24;
  }
  const boxLeft = pageWidth - marginX - 80;
  if(vatRate > 0){
    doc.setFont("Lato", "normal");
    doc.setFontSize(9);
    doc.setTextColor(80,80,80);
    doc.text("Základ daně bez DPH", boxLeft, ty);
    doc.text(fmtKc(total), pageWidth - marginX - 2, ty, { align: "right" });
    ty += 5.2;
    doc.text(`DPH ${vatRate}%`, boxLeft, ty);
    doc.text(fmtKc(vatAmount), pageWidth - marginX - 2, ty, { align: "right" });
    ty += 6.5;
    doc.setTextColor(0,0,0);
  }
  const totalBoxTop = ty;
  doc.setFillColor(164,172,127);
  doc.rect(boxLeft - 3, ty, 80 + 3, 8, "F");
  ty += 5.8;
  doc.setTextColor(255,255,255);
  doc.setFont("Lato", "bold");
  doc.setFontSize(9.5);
  doc.text(vatRate > 0 ? "CELKEM K ÚHRADĚ" : "CELKEM K ÚHRADĚ BEZ DPH", boxLeft, ty);
  doc.text(fmtKc(amountDue), pageWidth - marginX - 2, ty, { align: "right" });
  doc.setTextColor(0,0,0);

  const iban = resolveIban(supplier && supplier.bankAccount);
  const vsSource = invoiceNumber && !invoiceNumber.includes(",") ? invoiceNumber : "";
  const qrText = iban ? buildCzechQrPaymentString({
    iban, amount: amountDue, vs: vsSource,
    msg: `${invoiceNumber} - ${(supplier && supplier.name) || ""}`
  }) : "";
  if(qrText){
    try{
      const qrSize = 28;
      const qrY = totalBoxTop - 2;
      doc.setFont("Lato", "bold");
      doc.setFontSize(8);
      doc.setTextColor(120,120,120);
      doc.text("QR PLATBA", marginX, qrY - 2);
      doc.setTextColor(0,0,0);
      drawQrCodeInPdf(doc, qrText, marginX, qrY, qrSize);
    }catch(e){}
  }

  const pageCount = doc.internal.getNumberOfPages();
  const footerParts = [supplier && supplier.name, supplier && supplier.ico ? `IČ: ${supplier.ico}` : "", supplier && supplier.address].filter(Boolean);
  const footerText = footerParts.join("  |  ");
  for(let i = 1; i <= pageCount; i++){
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(120,120,120);
    doc.text(footerText, pageWidth/2, pageHeight - 12, { align: "center" });
  }

  return doc;
}

async function renameProjectIdEverywhere(oldId, newId){
  await Promise.all(state.config.employees.map(async emp => {
    const entries = await loadEntries(emp.id);
    let changed = false;
    entries.forEach(e => { if(e.projectId === oldId){ e.projectId = newId; changed = true; } });
    if(changed) await saveEntries(emp.id, emp.name, entries);
  }));
  if(state.currentEmployee) state.entries.forEach(e => { if(e.projectId === oldId) e.projectId = newId; });
}

async function init(){
  state.config = await loadConfig();
  let needsSave = false;
  if(!state.config.employees) state.config.employees = [];
  DEFAULT_EMPLOYEES.forEach(de => {
    const exists = state.config.employees.some(e => e.name.trim().toLowerCase() === de.name.toLowerCase());
    if(!exists){
      state.config.employees.push({ id: uid("emp"), name: de.name, password: de.password });
      needsSave = true;
    }
  });
  if(!state.config.projects || state.config.projects.length === 0){
    state.config.projects = DEFAULT_PROJECTS.map(p => ({ ...p, phaseIds: PROJECT_PHASE_MAP[p.id] ? [...PROJECT_PHASE_MAP[p.id]] : [] }));
    needsSave = true;
  } else {
    state.config.projects.forEach(p => {
      if((!p.phaseIds || p.phaseIds.length === 0) && PROJECT_PHASE_MAP[p.id]){
        p.phaseIds = [...PROJECT_PHASE_MAP[p.id]];
        needsSave = true;
      }
    });
    if(!state.config.projects.some(p => p.id === "000")){
      state.config.projects.unshift({ id: "000", name: "DH", phaseless: true, phaseIds: [] });
      needsSave = true;
    }
    if(!state.config.projects.some(p => p.id === "250")){
      state.config.projects.push({ id: "250", name: "GLS - Budca - Hala", phaseIds: [...PROJECT_PHASE_MAP["250"]] });
      needsSave = true;
    }
    [
      { id: "249", name: "Hronková - Brtnička" },
      { id: "251", name: "Novotná - Stránecká Zhoř" },
      { id: "252", name: "Procházka - Brno" },
      { id: "253", name: "Sapeli - Brno" }
    ].forEach(np => {
      if(!state.config.projects.some(p => p.id === np.id)){
        state.config.projects.push({ ...np, phaseIds: PROJECT_PHASE_MAP[np.id] ? [...PROJECT_PHASE_MAP[np.id]] : [] });
        needsSave = true;
      }
    });
  }
  if(!state.config.phases || state.config.phases.length === 0){
    state.config.phases = DEFAULT_PHASES.map(p => ({ ...p }));
    needsSave = true;
  } else if(!state.config.phases.some(p => p.id === "VC")){
    state.config.phases.push({ id: "VC", name: "Vícepráce" });
    needsSave = true;
  }
  if(ensureBuiltInPhases(state.config)) needsSave = true;
  if(needsSave) await saveConfig();

  const remembered = readRememberedLogin();
  if(remembered){
    const emp = state.config.employees.find(e => e.id === remembered.employeeId);
    if(emp){
      employeeAuthToken = remembered.token;
      state.currentEmployee = emp;
      state.entries = await loadEntries(emp.id);
      restoreRowTimer();
      restoreFormTimer();
    } else {
      clearRememberedLogin();
    }
  }

  state.loading = false;
  render();
}

function buildProjectDetail(projectId){
  const project = state.config.projects.find(p => p.id === projectId);
  const phases = state.config.phases;
  const entries = (state.allEntriesFlat || []).filter(e => e.projectId === projectId);
  const totalHours = entries.reduce((s,e) => s + Number(e.hours||0), 0);

  const byPhase = {};
  entries.forEach(e => {
    const pid = e.phaseId || "—";
    byPhase[pid] = (byPhase[pid] || 0) + Number(e.hours||0);
  });

  // zobrazit fáze přiřazené projektu (i s 0 h) + jakoukoli fázi s reálně zapsanými hodinami
  const assignedIds = (project && project.phaseIds) ? project.phaseIds : [];
  const idsWithHours = Object.keys(byPhase);
  const phaseIds = Array.from(new Set([...assignedIds, ...idsWithHours]));
  const masterOrder = phases.map(p => p.id);
  phaseIds.sort((a,b) => {
    const ha = byPhase[a] || 0;
    const hb = byPhase[b] || 0;
    if(hb !== ha) return hb - ha;
    return masterOrder.indexOf(a) - masterOrder.indexOf(b);
  });

  const phaseBlocks = phaseIds.map(pid => {
    const phase = phases.find(p => p.id === pid);
    const label = phase ? `${esc(phase.name)}` : (pid === "—" ? "Bez fáze" : esc(pid));
    const total = byPhase[pid] || 0;
    return `
      <div class="phase-block">
        <div class="phase-block-head"><span class="entry-phase">${phase ? esc(phase.id) : "?"}</span> ${label} <b>${fmtH(total)}</b></div>
      </div>`;
  }).join("");

  return `
    <div class="project-detail">
      <div class="project-detail-total"><span>Projekt celkem</span><b>${fmtH(totalHours)}</b></div>
      ${phaseBlocks || `<div class="q-hint" style="margin:6px 0 0;">Tomuto projektu zatím nejsou přiřazené žádné fáze a nemá ani žádné zapsané hodiny.</div>`}
      ${projectBillingBlockHtml(project)}
    </div>`;
}

function buildMyProjectDetail(projectId){
  const project = state.config.projects.find(p => p.id === projectId);
  const phases = state.config.phases;
  const entries = state.entries.filter(e => e.projectId === projectId);
  const totalHours = entries.reduce((s,e) => s + Number(e.hours||0), 0);

  const byPhase = {};
  entries.forEach(e => {
    const pid = e.phaseId || "—";
    if(!byPhase[pid]) byPhase[pid] = { total: 0, entries: [] };
    byPhase[pid].total += Number(e.hours||0);
    byPhase[pid].entries.push(e);
  });
  const masterOrder = phases.map(p => p.id);
  const phaseIds = Object.keys(byPhase).sort((a,b) => {
    if(byPhase[b].total !== byPhase[a].total) return byPhase[b].total - byPhase[a].total;
    return masterOrder.indexOf(a) - masterOrder.indexOf(b);
  });
  const phaseBlocks = phaseIds.map(pid => {
    const phase = phases.find(p => p.id === pid);
    const label = phase ? esc(phase.name) : (pid === "—" ? "Bez fáze" : esc(pid));
    const key = `${projectId}::${pid}`;
    const isOpen = state.expandedMyPhaseKey === key;
    const phaseEntries = byPhase[pid].entries.slice().sort((a,b) => b.date.localeCompare(a.date));
    const entryRows = phaseEntries.map(e => `
        <div class="entry-row-compact">
          <span class="entry-date">${esc(e.date)}</span>
          <span class="entry-num">${fmtH(e.hours)}</span>
          <span class="entry-num">${fmtKc(e.cost)}</span>

    return `

        <div class="phase-block-head" data-action="toggle-my-phase-entries" data-key="${esc(key)}" style="cursor:pointer;">
          <span class="chevron" style="margin-right:2px;">${isOpen ? "▾" : "▸"}</span>
          <span class="entry-phase">${phase ? esc(phase.id) : "?"}</span> ${label} <b>${fmtH(byPhase[pid].total)}</b>
        </div>
        ${isOpen ? `
        <div class="phase-employees" style="margin-top:8px;padding-top:8px;">
          <div class="entry-head-compact"><span>Datum</span><span>Hodiny</span><span>Náklady</span><span>Poznámka</span><span></span><span></span></div>
          <div class="entries">${entryRows}</div>
        </div>` : ``}
      </div>`;
  }).join("");

  return `
    <div class="project-detail">
      <div class="project-detail-total"><span>Moje hodiny na projektu</span><b>${fmtH(totalHours)}</b></div>
      ${phaseBlocks || `<div class="q-hint" style="margin:6px 0 0;">Zatím žádné hodiny na tomto projektu.</div>`}
      ${projectBillingBlockHtml(project)}
    </div>`;
}

function timesheetTemplate(){
  if(state.openProjectView) return projectViewPageHtml();
  const emp = state.currentEmployee;
  const projects = sortedProjects();
  const phases = state.config.phases;
  const monthEntries = state.entries
    .filter(e => e.date && e.date.slice(0,7) === state.month)
    .sort((a,b) => b.date.localeCompare(a.date));
  const totalH = monthEntries.reduce((s,e)=>s+Number(e.hours||0),0);
  const totalC = monthEntries.reduce((s,e)=>s+Number(e.cost||0),0);

  const hoursByDay = {};
  monthEntries.forEach(e => { hoursByDay[e.date] = (hoursByDay[e.date] || 0) + Number(e.hours || 0); });
  const holidayDays = {};
  monthEntries.forEach(e => { if(e.projectId === "000" && e.phaseId === "SS") holidayDays[e.date] = true; });
  const calendarHtml = buildMiniCalendar(state.month, hoursByDay, holidayDays);

  const currentYear = state.month.slice(0,4);
  const currentMonthNum = state.month.slice(5,7);
  const yearEntries = state.entries.filter(e => e.date && e.date.slice(0,4) === currentYear);
  const chartField = state.monthChartMetric === "cost" ? "cost" : "hours";
  const yearTotalHours = yearEntries.reduce((s,e)=>s+Number(e[chartField]||0),0);
  const hoursByMonthNum = {};
  const hours000ByMonthNum = {};
  yearEntries.forEach(e => {
    const mm = e.date.slice(5,7);
    hoursByMonthNum[mm] = (hoursByMonthNum[mm]||0) + Number(e[chartField]||0);
    if(e.projectId === "000") hours000ByMonthNum[mm] = (hours000ByMonthNum[mm]||0) + Number(e[chartField]||0);
  });
  const yearOverviewHtml = buildYearOverview(currentYear, hoursByMonthNum, yearTotalHours, currentMonthNum, hours000ByMonthNum);

  const pinnedEntry = state.rowTimer ? state.entries.find(x => x.id === state.rowTimer.entryId) : null;
  const listEntries = pinnedEntry ? [pinnedEntry, ...monthEntries.filter(x => x.id !== pinnedEntry.id)] : monthEntries;
  const rows = listEntries.length ? `
    <div class="entry-head-mine"><span>Projekt</span><span>Fáze</span><span>Hodiny</span><span>Náklady</span><span>Poznámka</span><span></span><span></span><span></span></div>
    <div class="entries">
      ${(() => {
      let lastEntryDate = null;
      return listEntries.map(e => {
        const isPinned = !!pinnedEntry && e.id === pinnedEntry.id;
        const dayHeaderHtml = isPinned
          ? `<div class="entry-day-header"><span class="rec-dot"></span>Právě se měří · ${esc(fmtDayHeader(e.date))}</div>`
          : (e.date !== lastEntryDate ? `<div class="entry-day-header">${esc(fmtDayHeader(e.date))}</div>` : "");
        if(!isPinned) lastEntryDate = e.date;
        const proj = projects.find(p => p.id === e.projectId);
        const phase = phases.find(p => p.id === e.phaseId);
        if(state.editingEntryId === e.id){
          const editProject = state.config.projects.find(p => p.id === e.projectId) || projects[0];
          const editPhaseless = isPhaselessProject(editProject);
          const editPhases = getFormPhaseOptions(editProject, e.date);
          const editProjectOptions = projects.map(p => `<option value="${esc(p.id)}" ${e.projectId === p.id ? "selected" : ""}>#${esc(p.id)} ${esc(p.name)}</option>`).join("");
          const editPhaseOptions = editPhases.length
            ? editPhases.map(p => `<option value="${esc(p.id)}" ${e.phaseId === p.id ? "selected" : ""}>${esc(p.id)} — ${esc(p.name)}${isPhaseClosedOnDate(editProject, p.id, e.date) ? " (uzavřeno)" : ""}</option>`).join("")
            : `<option value="" disabled selected>— žádné fáze —</option>`;
          return dayHeaderHtml + `
          <div class="entry-row-mine entry-row-edit" data-my-entry-edit-row="${esc(e.id)}">
            <input type="date" class="my-entry-edit-date" value="${esc(e.date)}" style="padding:6px 8px;font-size:13px;">
            <select class="my-entry-edit-project" style="padding:6px 8px;font-size:13px;">${editProjectOptions}</select>
            <select class="my-entry-edit-phase" style="padding:6px 8px;font-size:13px;" ${editPhaseless ? "disabled" : ""}>${editPhaseOptions}</select>
            <input type="number" min="0.01" step="0.01" class="my-entry-edit-hours" value="${esc(e.hours)}" style="padding:6px 8px;font-size:13px;">
            <input type="number" min="0" step="1" class="my-entry-edit-cost" value="${e.cost ? esc(e.cost) : ""}" placeholder="0" style="padding:6px 8px;font-size:13px;">
            <input type="text" class="my-entry-edit-note" value="${esc(e.note||"")}" placeholder="Poznámka" style="padding:6px 8px;font-size:13px;">
            <span class="my-entry-edit-actions" style="display:flex;gap:4px;">
              <button type="button" class="icon-btn" data-action="save-my-entry-edit" title="Uložit">✓</button>
              <button type="button" class="icon-btn" data-action="cancel-my-entry-edit" title="Zrušit">×</button>
            </span>
            ${state.entryError ? `<div class="q-hint" style="color:var(--danger);grid-column:1/-1;margin:6px 0 0;">${esc(state.entryError)}</div>` : ``}
          </div>`;
        }
        const rowLocked = isDateLocked(e.date);
        return dayHeaderHtml + `
        <div class="entry-row-mine ${state.rowTimer && state.rowTimer.entryId === e.id ? "row-running" : ""} ${rowLocked ? "row-locked" : ""}">
          <span>${rowLocked ? `` : state.rowTimer && state.rowTimer.entryId === e.id
              ? `<button type="button" class="icon-btn row-timer-btn" data-action="row-timer-stop" title="Zastavit a připsat čas k tomuto záznamu">⏹</button><span class="rec-dot"></span><span class="rec-time" data-kind="row">${fmtTimerElapsed(rowTimerElapsedMs())}</span> `
              : `<button type="button" class="icon-btn row-timer-btn" data-action="row-timer-start" data-id="${esc(e.id)}" title="Spustit měření času u tohoto záznamu (zastaví případné běžící)">▶</button>`}${proj ? `<span class="entry-proj" data-project-id="${esc(proj.id)}">#${esc(proj.id)} ${esc(proj.name)}</span>` : `<span class="entry-proj gone">smazaný projekt</span>`}</span>
          <span>${phase ? `<span class="entry-phase">${esc(phase.id)}</span>` : e.phaseId ? `<span class="entry-phase gone">smazaná fáze</span>` : ``}</span>
          <span class="entry-num">${fmtH(e.hours)}</span>
          <span class="entry-num">${fmtKc(e.cost)}</span>
          <span class="entry-note">${esc(e.note||"")}</span>
          ${rowLocked ? `<span></span>${isDateLocked(todayStr()) ? `<span></span>` : `<button class="icon-btn" data-action="copy-entry" data-id="${esc(e.id)}" title="Zkopírovat s dnešním datem">⎘</button>`}<span class="entry-lock" title="Měsíc je uzavřen">${ICON_LOCK}</span>` : `
          <button class="icon-btn" data-action="edit-entry" data-id="${esc(e.id)}" title="Upravit">✎</button>
          <button class="icon-btn" data-action="copy-entry" data-id="${esc(e.id)}" title="Zkopírovat s dnešním datem">⎘</button>
          <button class="icon-btn icon-btn-del" data-action="delete-entry" data-id="${esc(e.id)}" title="Smazat">${ICON_TRASH}</button>`}
        </div>`;
      }).join("");
      })()}
    </div>` : `<div class="empty-state">Za tento měsíc zatím žádné záznamy.</div>`;

  const formProject = projects[0];
  const formDate = todayStr();
  const formPhaseless = isPhaselessProject(formProject);
  const formPhases = getFormPhaseOptions(formProject, formDate);

  const projectOptions = projects.map(p => `<option value="${esc(p.id)}">#${esc(p.id)} ${esc(p.name)}</option>`).join("");
  const phaseOptions = formPhases.length
    ? formPhases.map(p => `<option value="${esc(p.id)}">${esc(p.id)} — ${esc(p.name)}${isPhaseClosedOnDate(formProject, p.id, formDate) ? " (uzavřeno)" : ""}</option>`).join("")
    : `<option value="" disabled selected>— žádné fáze —</option>`;
  const canSubmitInitially = formPhaseless || formPhases.length > 0;
  const canLogHours = projects.length > 0;
  const formNoteRequired = formPhases.length > 0 && formPhases[0].id === "AD";

  const timesheetOpen = state.showTimesheet;
  const timesheetBody = `
      <div class="q-hint" style="margin-bottom:18px;">Zadejte odpracované hodiny, projekt a fázi.</div>

      ${yearOverviewHtml}

      <div class="year-nav month-nav" style="margin-bottom:18px;">
        <button class="icon-btn" data-action="month-prev" type="button">‹</button>
        <span class="year-label">${esc(fmtMonthLabel(state.month))}</span>
        <button class="icon-btn" data-action="month-next" type="button">›</button>
        ${isDateLocked(state.month + "-01") ? `<span class="lock-badge" title="Záznamy v tomto měsíci už nejde měnit">${ICON_LOCK} uzavřeno</span>` : ``}
      </div>

      ${calendarHtml}

      <div class="totals">
        <div class="totals-row"><span>Hodiny za ${esc(state.month)}</span><b>${fmtH(totalH)}</b></div>
        <div class="totals-row grand"><span>Náklady celkem</span><b>${fmtKc(totalC)}</b></div>
      </div>

      ${!canLogHours ? `
        <div class="empty-state">Nejsou nastavené žádné projekty. <div><button class="btn btn-outline btn-small" id="goto-admin-btn2">Přidat v administraci</button></div></div>
      ` : `
        <form id="add-entry-form" style="margin-bottom:28px;">
          <div class="entry-form-row">
            <div class="field-row w-date"><label class="field-label">Datum</label><input type="date" name="date" id="entry-date-input" value="${esc(formDate)}" required></div>
            <div class="field-row w-hours"><label class="field-label">Hodiny</label><input type="number" name="hours" id="entry-hours-input" min="0.01" step="0.01" placeholder="8" required></div>
            <div class="field-row w-select"><label class="field-label">Projekt</label><select name="projectId" id="entry-project-select" required>${projectOptions}</select></div>
            <div class="field-row w-select" id="phase-field-row" style="${formPhaseless ? "display:none;" : ""}">
              <label class="field-label">Fáze</label>
              <select name="phaseId" id="entry-phase-select" ${formPhaseless ? "" : "required"}>${phaseOptions}</select>
            </div>
            <div class="field-row w-cost"><label class="field-label">Náklady (Kč)</label><input type="number" name="cost" min="0" step="1" placeholder="0"></div>
            <div class="field-row grow"><label class="field-label" id="entry-note-label">Poznámka${formNoteRequired ? " *" : ""}</label><input type="text" name="note" id="entry-note-input" placeholder="${formNoteRequired ? "povinné u autorského dozoru" : "nepovinné"}" ${formNoteRequired ? "required" : ""}></div>
            <div class="field-row w-btn" style="display:flex;gap:8px;align-items:end;">
              <button type="button" class="icon-btn" id="entry-timer-start-btn" title="${state.entryTimerAccumulated ? "Pokračovat v měření" : "Spustit měření času"}" ${state.entryTimerStart ? "disabled" : ""} style="width:38px;height:38px;font-size:14px;">▶</button>
              <button type="button" class="icon-btn" id="entry-timer-pause-btn" title="Pozastavit měření" ${state.entryTimerStart ? "" : "disabled"} style="width:38px;height:38px;font-size:14px;">⏸</button>
              <button type="button" class="icon-btn" id="entry-timer-stop-btn" title="Zastavit a rovnou uložit záznam" ${(state.entryTimerStart || state.entryTimerAccumulated) ? "" : "disabled"} style="width:38px;height:38px;font-size:14px;">⏹</button>
              ${(state.entryTimerStart || state.entryTimerAccumulated) ? `<span id="entry-timer-display" class="meta ${state.entryTimerStart ? "rec-live" : ""}" style="font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;align-self:center;white-space:nowrap;">${fmtTimerElapsed(currentTimerElapsedMs())}</span>` : ``}
              <button class="btn btn-sage" type="submit" ${canSubmitInitially ? "" : "disabled"}>Přidat záznam</button>
            </div>
          </div>
          <div id="phase-warning" class="q-hint" style="color:var(--danger);margin-top:8px;${canSubmitInitially ? "display:none;" : ""}">Tento projekt nemá pro zvolené datum dostupnou žádnou fázi (buď žádná není přiřazená, nebo jsou k tomuto datu uzavřené).</div>
          ${state.entryError && !state.editingEntryId ? `<div class="q-hint" style="color:var(--danger);margin-top:8px;">${esc(state.entryError)}</div>` : ``}
        </form>
      `}

      ${rows}
  `;

  const today = todayStr();
  const todayH = state.entries.filter(e => e.date === today).reduce((a,e)=>a+Number(e.hours||0),0);
  const yearH = yearEntries.reduce((a,e)=>a+Number(e.hours||0),0);
  const firstName = String(emp.greeting || "").trim() || String(emp.name || "").trim().split(/\s+/)[0] || "";
  const statTile = (label, value, cls) => `
        <div class="emp-stat ${cls || ""}">
          <div class="emp-stat-label">${label}</div>
          <div class="emp-stat-value">${value}</div>
        </div>`;

  return `
    <div class="sheet emp-page">
      <div class="emp-hero">
        <div class="eyebrow">Výkaz práce</div>
        <h1 class="emp-greet"><span class="emp-greet-small">Ahoj,</span><span class="emp-greet-name${firstName.length > 9 ? " long" : ""}">${esc(firstName)}</span></h1>
        <div class="emp-fullname">${esc(emp.name)}</div>
        ${recChipHtml()}
      </div>

      <div class="emp-stats">
        ${statTile("Dnes", fmtH(todayH), todayH ? "has" : "")}
        ${statTile("Měsíc · " + esc(fmtMonthLabel(state.month)), fmtH(totalH), totalH ? "has" : "")}
        ${statTile("Rok " + esc(currentYear), fmtH(yearH), yearH ? "has" : "")}
        ${Number(emp.vacationDays) > 0 ? statTile("Dovolená " + esc(todayStr().slice(0,4)) + " · zbývá", fmtDays(Number(emp.vacationDays) - vacationHoursUsed(state.entries, todayStr().slice(0,4)) / VACATION_HOURS_PER_DAY) + " dní", "has") : ``}
      </div>

      <div class="admin-block emp-main${timesheetOpen ? " is-open" : ""}">
        <div class="admin-block-title">
          <span data-action="toggle-timesheet-section" style="cursor:pointer;display:inline-flex;align-items:center;gap:8px;">
            <span style="display:inline-block;width:10px;">${timesheetOpen ? "▾" : "▸"}</span>Výkaz
          </span>
        </div>
        ${timesheetOpen ? timesheetBody : ``}
      </div>

      <div class="emp-projects-grid">
        ${allProjectsSection()}
        ${myProjectsSection()}
      </div>

      ${accountSettingsSection()}
    </div>`;
}

function noteSearchFieldHtml(id, value){

          <input type="text" id="${id}" placeholder="Hledat…" autocomplete="off" value="${esc(value || "")}" style="padding-left:36px;">

function noteMatches(note, query){
  const q = stripDiacritics(query || "").trim().toLowerCase();
  return !q || stripDiacritics(note || "").toLowerCase().includes(q);
}
function bindNoteSearch(id, stateKey){
  const input = document.getElementById(id);
  if(!input) return;
  input.addEventListener("input", () => {
    const pos = input.selectionStart;
    setState({ [stateKey]: input.value });
    const el = document.getElementById(id);
    if(el){ el.focus(); el.setSelectionRange(pos, pos); }
  });
}

// ---- Shared bulk selection (checkboxes + "select all" + bulk rewrite + sum) ----
function bulkSelectedIds(listId){
  const m = (state.bulkSel || {})[listId] || {};
  return Object.keys(m).filter(id => m[id]);
}
function bulkRowCbHtml(listId, id){
  const on = ((state.bulkSel || {})[listId] || {})[id];
  return `<input type="checkbox" class="bulk-row-cb" data-list="${listId}" data-id="${esc(id)}" ${on ? "checked" : ""} title="Vybrat">`;
}
function bulkToolbarHtml(listId, kind, items, ctxProjectId){
  if(!items.length) return "";
  const selSet = new Set(bulkSelectedIds(listId));
  const picked = items.filter(it => selSet.has(it.id));
  const head = `<label class="bulk-all"><input type="checkbox" class="bulk-select-all" data-list="${listId}" ${picked.length === items.length ? "checked" : ""}> Vybrat vše (${items.length})</label>`;
  if(!picked.length) return `<div class="bulk-toolbar">${head}</div>`;

  let summary;
  if(kind === "cost"){
    summary = `součet <b>${fmtKc(picked.reduce((s, c) => s + Number(c.amount || 0), 0))}</b>`;
  } else {
    const hours = picked.reduce((s, e) => s + Number(e.hours || 0), 0);
    const labor = picked.reduce((s, e) => s + Number(e.hours || 0) * hourlyRateForEmployee(state.config.employees.find(x => x.id === e.employeeId), e.date), 0);
    const other = picked.reduce((s, e) => s + Number(e.cost || 0), 0);
    summary = `<b>${fmtH(hours)}</b> · mzdy <b>${fmtKc(labor)}</b>${other ? ` · ostatní náklady <b>${fmtKc(other)}</b>` : ``}`;
  }
  const target = (state.bulkTarget || {})[listId] || {};
  const projOptions = `<option value="">— ponechat projekt —</option>` + state.config.projects.map(pr => `<option value="${esc(pr.id)}" ${target.projectId === pr.id ? "selected" : ""}>#${esc(pr.id)} ${esc(pr.name)}</option>`).join("");
  const phaseProject = state.config.projects.find(pr => pr.id === (target.projectId || ctxProjectId));
  const phaseList = phaseProject ? phasesForProject(phaseProject) : state.config.phases.filter(ph => !BUILT_IN_ONLY_PHASES.includes(ph.id));
  const phaseOptions = `<option value="">— ponechat fázi —</option>`
    + (kind === "cost" ? `<option value="-" ${target.phaseId === "-" ? "selected" : ""}>— bez fáze —</option>` : ``)
    + phaseList.map(ph => `<option value="${esc(ph.id)}" ${target.phaseId === ph.id ? "selected" : ""}>${esc(ph.id)} — ${esc(ph.name)}</option>`).join("");
  const canApply = !!(target.projectId || target.phaseId);
  const err = (state.bulkError || {})[listId];
  return `
    <div class="bulk-toolbar">
      ${head}
      <div class="bulk-bar">
        <span class="bulk-sum">Vybráno: ${picked.length} · ${summary}</span>
        <select class="bulk-target-project" data-list="${listId}">${projOptions}</select>
        <select class="bulk-target-phase" data-list="${listId}">${phaseOptions}</select>
        <button type="button" class="btn btn-tan btn-small" data-bulk-apply data-list="${listId}" data-kind="${kind}" ${canApply ? "" : "disabled"}>Přepsat u vybraných</button>
        <button type="button" class="btn btn-outline btn-small" data-bulk-clear data-list="${listId}">Zrušit výběr</button>
        ${err ? `<div class="bulk-error">${esc(err)}</div>` : ``}
      </div>
    </div>`;
}
async function bulkApply(listId, kind){
  const target = (state.bulkTarget || {})[listId] || {};
  if(!(target.projectId || target.phaseId)) return;
  const visible = new Set(Array.from(document.querySelectorAll(`.bulk-row-cb[data-list="${listId}"]`)).map(c => c.getAttribute("data-id")));
  const ids = bulkSelectedIds(listId).filter(id => visible.has(id));
  if(!ids.length) return;
  const newProject = target.projectId ? state.config.projects.find(pr => pr.id === target.projectId) : null;
  const setErr = msg => setState({ bulkError: { ...(state.bulkError || {}), [listId]: msg } });
  if(kind === "entry" && target.phaseId === "-") return;
  if(kind === "entry" && newProject && !isPhaselessProject(newProject) && !target.phaseId) return setErr("Při změně projektu vyber i fázi nového projektu.");
  if(!confirm(`Opravdu přepsat ${ids.length} vybraných záznamů?`)) return;

  const patch = {};
  if(target.projectId) patch.projectId = target.projectId;
  if(target.phaseId) patch.phaseId = target.phaseId === "-" ? "" : target.phaseId;
  if(kind === "entry" && newProject && isPhaselessProject(newProject)) patch.phaseId = "";

  if(kind === "entry"){
    const byEmployee = {};
    (state.adminEntriesFlat || []).forEach(en => {
      if(ids.includes(en.id)){ (byEmployee[en.employeeId] = byEmployee[en.employeeId] || []).push(en.id); }
    });
    for(const employeeId of Object.keys(byEmployee)){
      const entries = await loadEntries(employeeId);
      byEmployee[employeeId].forEach(entryId => {
        const idx = entries.findIndex(e => e.id === entryId);
        if(idx !== -1) entries[idx] = { ...entries[idx], ...patch };
      });
      await saveEntries(employeeId, "", entries);
    }
    if(state.adminEntriesFlat) state.adminEntriesFlat = state.adminEntriesFlat.map(en => ids.includes(en.id) ? { ...en, ...patch } : en);
    state.projectTotals = null;
    state.allEntriesFlat = null;
  } else {
    state.costs = (state.costs || []).map(c => ids.includes(c.id) ? { ...c, ...patch } : c);
    await saveCosts();
  }
  state.bulkSel = { ...state.bulkSel, [listId]: {} };
  state.bulkTarget = { ...state.bulkTarget, [listId]: {} };
  state.bulkError = { ...state.bulkError, [listId]: "" };
  showStamp();
  render();
}
function bindBulkEvents(){
  document.addEventListener("change", e => {
    const t = e.target;
    if(!t || !t.classList) return;
    const listId = t.getAttribute("data-list");
    if(t.classList.contains("bulk-row-cb")){
      const m = { ...((state.bulkSel || {})[listId] || {}) };
      if(t.checked) m[t.getAttribute("data-id")] = true; else delete m[t.getAttribute("data-id")];
      setState({ bulkSel: { ...state.bulkSel, [listId]: m }, bulkError: { ...state.bulkError, [listId]: "" } });
    } else if(t.classList.contains("bulk-select-all")){
      const m = { ...((state.bulkSel || {})[listId] || {}) };
      document.querySelectorAll(`.bulk-row-cb[data-list="${listId}"]`).forEach(cb => {
        if(t.checked) m[cb.getAttribute("data-id")] = true; else delete m[cb.getAttribute("data-id")];
      });
      setState({ bulkSel: { ...state.bulkSel, [listId]: m } });
    } else if(t.classList.contains("bulk-target-project")){
      setState({ bulkTarget: { ...state.bulkTarget, [listId]: { projectId: t.value, phaseId: "" } }, bulkError: { ...state.bulkError, [listId]: "" } });
    } else if(t.classList.contains("bulk-target-phase")){
      const cur = (state.bulkTarget || {})[listId] || {};
      setState({ bulkTarget: { ...state.bulkTarget, [listId]: { ...cur, phaseId: t.value } }, bulkError: { ...state.bulkError, [listId]: "" } });
    }
  });
  document.addEventListener("click", e => {
    const clear = e.target.closest && e.target.closest("[data-bulk-clear]");
    if(clear){
      const listId = clear.getAttribute("data-list");
      setState({ bulkSel: { ...state.bulkSel, [listId]: {} }, bulkTarget: { ...state.bulkTarget, [listId]: {} }, bulkError: { ...state.bulkError, [listId]: "" } });
      return;
    }
    const apply = e.target.closest && e.target.closest("[data-bulk-apply]");
    if(apply) bulkApply(apply.getAttribute("data-list"), apply.getAttribute("data-kind"));
  });
}

const CHART_MONTHS_SHORT = ["led","úno","bře","dub","kvě","čvn","čvc","srp","zář","říj","lis","pro"];
const CHART_MONTHS_FULL = ["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];

function chartNiceTop(max){
  if(!(max > 0)) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(max)));
  const m = max / p;
  const nice = m <= 2 ? 2 : (m <= 4 ? 4 : (m <= 8 ? 8 : 10));
  return nice * p;
}

function chartShortValue(v, isCost){
  const r1 = n => (Math.round(n * 10) / 10).toLocaleString("cs-CZ");
  if(isCost){
    if(v >= 1000000) return r1(v / 1000000) + " M";
    if(v >= 1000) return r1(v / 1000) + " k";
    return String(Math.round(v));
  }
  return v >= 10 ? String(Math.round(v)) : r1(v);
}

// values: 12 numbers (Jan..Dec). Used by both the employee view and the admin hours overview.
function monthChartHtml(o){
  const isCost = o.metric === "cost";
  const fmt = isCost ? fmtKc : fmtH;
  const values = o.values;
  const values0 = o.values000 || new Array(12).fill(0);
  const max = Math.max(0, ...values);
  const top = chartNiceTop(max);
  const nonZero = values.filter(v => v > 0);
  const total = values.reduce((s,v) => s + v, 0);
  const avg = nonZero.length ? total / nonZero.length : 0;
  const maxIdx = max > 0 ? values.indexOf(max) : -1;
  const total0 = values0.reduce((s,v) => s + v, 0);
  const totalProj = total - total0;

  const ticks = [0,1,2,3,4].map(i => {
    const v = top * i / 4;
    return { pct: i * 25, label: (Math.round(v * 10) / 10).toLocaleString("cs-CZ") };
  });
  const grid = ticks.map(t => `<i style="bottom:${t.pct}%;"></i>`).join("");
  const yAxis = ticks.map(t => `<span style="bottom:${t.pct}%;">${t.label}</span>`).join("");
  const avgHtml = (o.showAvg && avg > 0) ? `<div class="mchart-avg"><i style="bottom:${avg / top * 100}%;"></i><span style="bottom:${avg / top * 100}%;">Ø ${esc(fmt(avg))}</span></div>` : "";

  const cols = values.map((v, i) => {
    const mm = String(i + 1).padStart(2, "0");
    const frac = v > 0 ? Math.max(0.02, v / top) : 0;
    const v0 = Math.min(values0[i] || 0, v);
    const vp = v - v0;
    const label = `${CHART_MONTHS_FULL[i]} ${o.year} · celkem ${fmt(v)} (projektové ${fmt(vp)} · 000 ${fmt(v0)})`;
    const selected = o.selected === mm;
    const jump = o.jump ? `data-action="jump-month" data-month="${o.year}-${mm}"` : "";
    return `
      <div class="mchart-col ${selected ? "selected" : ""} ${o.jump ? "" : "nojump"}" tabindex="0" role="${o.jump ? "button" : "img"}" aria-label="${esc(label)}" data-chart-label="${esc(label)}" ${jump}>
        <div class="mchart-val">${v > 0 ? esc(chartShortValue(v, isCost)) : ""}</div>
        <div class="mchart-bar" style="height:calc((100% - 22px) * ${frac});"><i class="seg-p" style="flex:${vp} 1 0;"></i><i class="seg-0" style="flex:${v0} 1 0;"></i></div>
        <div class="mchart-m">${CHART_MONTHS_SHORT[i]}</div>
      </div>`;
  }).join("");

  return `
    <div class="mchart-wrap">
      <div class="mchart-tools">
        <span class="mchart-seg">
          <button type="button" data-action="set-month-chart-metric" data-metric="hours" class="${isCost ? "" : "active"}">Hodiny</button>
          <button type="button" data-action="set-month-chart-metric" data-metric="cost" class="${isCost ? "active" : ""}">Náklady</button>
        </span>
      </div>
      <div class="mchart-legend"><span><i style="background:var(--sage);"></i>Projektové (bez 000)</span><span><i style="background:var(--tan);"></i>000 (DH)</span></div>
      <p class="mchart-summary">Celkem <b>${esc(fmt(total))}</b> (projektové <b>${esc(fmt(totalProj))}</b> · 000 <b>${esc(fmt(total0))}</b>) · průměr <b>${esc(fmt(avg))}</b>/měsíc${maxIdx >= 0 ? ` · nejvíc <b>${esc(fmt(max))}</b> (${CHART_MONTHS_SHORT[maxIdx]})` : ``}</p>
      <div class="mchart">
        <div class="mchart-grid">${grid}</div>
        <div class="mchart-y">${yAxis}</div>
        ${avgHtml}
        <div class="mchart-bars">${cols}</div>
      </div>
      <div class="mchart-readout">${o.jump ? "Najeď na sloupec pro detail, kliknutím otevřeš měsíc ve výkazu." : "Najeď na sloupec pro detail."}</div>
    </div>`;
}
