function buildMiniCalendar(month, hoursByDay, holidayDays){
  const [y, m] = month.split("-").map(Number);
  const firstDay = new Date(y, m - 1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = (firstDay.getDay() + 6) % 7; // 0 = pondělí

  const dow = ["PO","ÚT","ST","ČT","PÁ","SO","NE"];
  let cells = dow.map(d => `<div class="cal-dow">${d}</div>`).join("");
  for(let i = 0; i < startWeekday; i++) cells += `<div class="cal-day empty"></div>`;
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const h = hoursByDay[dateStr] || 0;
    cells += `
      <div class="cal-day">
        <div class="cal-daynum">${d}</div>
        <div class="cal-hours ${h ? "has" : "empty"} ${h && holidayDays && holidayDays[dateStr] ? "holiday" : ""}" ${h && holidayDays && holidayDays[dateStr] ? 'title="Státní svátek"' : ""}>${h ? fmtHShort(h) : ""}</div>
      </div>`;
  }
  return `<div class="mini-calendar">${cells}</div>`;
}

function buildAdminProjectOverviewDetail(projectId){
  const project = state.config.projects.find(p => p.id === projectId);
  const phases = state.config.phases;
  const entries = (state.adminEntriesFlat || []).filter(e => e.projectId === projectId);
  const totalHours = entries.reduce((s,e) => s + Number(e.hours||0), 0);
  const projectCosts = (state.costs || []).filter(c => c.projectId === projectId);
  const totalCostAmount = projectCosts.reduce((s,c) => s + Number(c.amount||0), 0);

  const byPhase = {};
  entries.forEach(e => {
    const pid = e.phaseId || "—";
    if(!byPhase[pid]) byPhase[pid] = { total: 0, byEmployee: {}, costs: [], costTotal: 0 };
    byPhase[pid].total += Number(e.hours||0);
    byPhase[pid].byEmployee[e.employeeName] = (byPhase[pid].byEmployee[e.employeeName] || 0) + Number(e.hours||0);
  });
  projectCosts.forEach(c => {
    const pid = c.phaseId || "—";
    if(!byPhase[pid]) byPhase[pid] = { total: 0, byEmployee: {}, costs: [], costTotal: 0 };
    byPhase[pid].costs.push(c);
    byPhase[pid].costTotal += Number(c.amount||0);
  });

  const assignedIds = (project && project.phaseIds) ? project.phaseIds : [];
  const idsWithHours = Object.keys(byPhase);
  const phaseIds = Array.from(new Set([...assignedIds, ...idsWithHours]));
  const masterOrder = phases.map(p => p.id);
  phaseIds.sort((a,b) => {
    const ha = byPhase[a] ? byPhase[a].total : 0;
    const hb = byPhase[b] ? byPhase[b].total : 0;
    if(hb !== ha) return hb - ha;
    return masterOrder.indexOf(a) - masterOrder.indexOf(b);
  });

  const phaseBlocks = phaseIds.map(pid => {
    const phase = phases.find(p => p.id === pid);
    const label = phase ? `${esc(phase.name)}` : (pid === "—" ? "Bez fáze" : esc(pid));
    const data = byPhase[pid] || { total: 0, byEmployee: {}, costs: [], costTotal: 0 };
    const empRows = Object.entries(data.byEmployee)
      .sort((a,b) => b[1]-a[1])
      .map(([name,h]) => `<div class="phase-employee-row"><span>${esc(name)}</span><span>${fmtH(h)}</span></div>`)
      .join("");
    const costRows = data.costs.slice().sort((a,b) => (b.date||"").localeCompare(a.date||""))
      .map(c => {
        const payLabel = c.paymentMethod === "hotove" ? "hotově" : c.paymentMethod === "ucet" ? "účtem" : "";
        const detail = [c.date, payLabel, c.note].filter(Boolean).join(" · ");
        return `<div class="phase-employee-row"><span>${esc(detail)}</span><span>${fmtKc(c.amount)}</span></div>`;
      })
      .join("");
    return `
      <div class="phase-block">
        <div class="phase-block-head"><span class="entry-phase">${phase ? esc(phase.id) : "?"}</span> ${label} <b>${fmtH(data.total)}</b></div>
        ${empRows ? `<div class="phase-employees">${empRows}</div>` : ``}
        ${data.costTotal ? `
        <div class="phase-employees" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);">
          <div class="phase-employee-row"><span><b style="color:var(--ink);">Náklady fáze</b></span><span><b style="color:var(--ink);">${fmtKc(data.costTotal)}</b></span></div>
          ${costRows}
        </div>` : ``}
      </div>`;
  }).join("");

  return `
    <div class="project-detail">
      <div class="project-detail-total"><span>Projekt celkem</span><b>${fmtH(totalHours)}</b></div>
      ${totalCostAmount ? `<div class="project-detail-total"><span>Náklady celkem</span><b>${fmtKc(totalCostAmount)}</b></div>` : ``}
      ${phaseBlocks || `<div class="q-hint" style="margin:6px 0 0;">Tomuto projektu zatím nejsou přiřazené žádné fáze a nemá ani žádné zapsané hodiny.</div>`}
    </div>`;
}

    </div>` : ``;
  const extraCostsHtml = projectCostsHtml + `
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--line);">
      <div style="font-weight:700;font-size:15px;margin-bottom:8px;">Ostatní náklady (tisk, doprava, apod.)</div>
      ${extraCosts.length ? extraCosts.map(item => `
        <div class="admin-project-head" style="margin-bottom:8px;">
          <span class="grow">${esc(item.description)}</span>${clientExportAmountInputHtml(item.id, item.amount)}

        </div>`).join("") : `<div class="q-hint" style="margin:0 0 10px;">Zatím žádné ostatní náklady.</div>`}
      <div class="form-grid" style="margin-top:10px;">
        <div class="field-row grow"><label class="field-label">Popis</label><input type="text" id="client-export-extra-desc" placeholder="např. Tisk dokumentace"></div>
        <div class="field-row"><label class="field-label">Částka (Kč)</label><input type="number" min="0" step="1" id="client-export-extra-amount"></div>

  const selectedProject = state.clientExportProjectId ? state.config.projects.find(p => p.id === state.clientExportProjectId) : null;
  const exportButtonsHtml = () => `

      ${selectedProject ? `
      <div class="form-grid" style="margin-bottom:10px;max-width:480px;">
        <div class="field-row"><label class="field-label">Podepsal(a)</label><input type="text" id="client-export-signed-by" value="${esc(state.clientExportSignedBy)}"></div>

          <option value="21" ${Number(state.clientExportVatRate) === 21 ? "selected" : ""}>21 %</option>
        </select></div>
      </div>

      </div>
      ${(state.config.billingProfiles || []).length ? `
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
        <select id="client-export-proforma-supplier" style="width:auto;min-width:180px;">
          ${state.config.billingProfiles.map(bp => `<option value="${esc(bp.id)}">${esc(bp.name || "Bez názvu")}</option>`).join("")}
        </select>
        ${projectBillingProfiles(selectedProject).length > 1 ? `
        <select id="client-export-proforma-customer" style="width:auto;min-width:180px;">
          ${projectBillingProfiles(selectedProject).map(bp => `<option value="${esc(bp.id)}">${esc(bp.name || "Bez názvu")}</option>`).join("")}
        </select>
        ` : ``}
        <label style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--soft);">

          <input type="date" id="client-export-proforma-due-date" style="width:auto;padding:6px 8px;font-size:13px;" value="${esc(addDaysToDateStr(todayStr(), 7))}">

        <input type="text" id="client-export-proforma-item-label" placeholder="Položka faktury" style="width:220px;padding:6px 8px;font-size:13px;" value="Autorský dozor na stavbě">
        <button type="button" class="btn btn-tan btn-small" id="client-export-proforma-btn" data-project-id="${esc(selectedProject.id)}">Exportovat PROFORMA fakturu</button>
      </div>
      ` : `<p class="q-hint" style="margin:10px 0 0;">Pro export proforma faktury nejprve přidejte fakturační profil v Nastavení.</p>`}
      ` : `<p class="q-hint" style="margin:0;">Pro export vyberte konkrétní projekt ve filtru.</p>`}
    </div>`;

  if(!sorted.length){
    return `${filterHtml}<div class="empty-state">${filtersActive ? "Žádné záznamy neodpovídají zvolenému filtru." : "Nastavte filtr, ať se zobrazí hodiny k exportu."}${excludedCount ? ` (${excludedCount} odebráno z exportu — <button type="button" class="btn btn-small" id="client-export-restore-excluded-btn">Vrátit</button>)` : ``}</div>${extraCostsHtml}${allExtraCosts.length ? exportButtonsHtml() : ``}`;
  }

  const employeeIdsPresent = [...new Set(sorted.map(e => e.employeeId))];
  const rateFormHtml = `
    <div class="form-grid" style="margin-bottom:14px;">
      ${employeeIdsPresent.map(eid => {

        const rate = state.clientExportRates[eid] !== undefined ? state.clientExportRates[eid] : (savedRate !== undefined ? savedRate : "");

    </div>`;

  const totalHours = sorted.reduce((s,e) => s + clientExportHoursFor(e), 0);

  const vatRate = Number(state.clientExportVatRate) || 0;

  const grandTotal = subtotal + vatAmount;

  const rows = sorted.map(e => {

    const costVal = clientExportCostFor(e);

    const note = state.clientExportOverrides[e.id] !== undefined ? state.clientExportOverrides[e.id] : (e.note || "");
    return `
    <div class="entry-row-clientexp">
      <span class="entry-date">${esc(e.date)}</span>

    </div>`;
  }).join("");

  return `
    ${filterHtml}
    ${filtersActive ? `<button class="btn btn-small" type="button" id="client-export-filter-reset-btn" style="margin-bottom:14px;">Zrušit filtr</button>` : ``}
    <p class="q-hint" style="margin:0 0 8px;">Fakturovatelná hodinovka je nezávislá na interní nákladové sazbě — platí jen pro tento export a nikam se neukládá. Hodiny i náklady jde přepsat jen pro tento export, v ostrém výkazu se nic nezmění.</p>
    ${rateFormHtml}

    <div class="entry-head-clientexp"><span>Datum</span><span>Zaměstnanec</span><span>Fáze</span><span>Hodiny</span><span>Popis</span><span>Fakturováno</span><span>Ostatní náklady</span><span></span></div>
    <div class="entries">${rows}</div>
    ${extraCostsHtml}
    <p class="q-hint" style="margin:16px 0 0;">
      Základ: <b style="color:var(--ink);">${fmtKc(subtotal)}</b><br>
      DPH (${vatRate} %): <b style="color:var(--ink);">${fmtKc(vatAmount)}</b><br>
      Celkem k fakturaci: <b style="color:var(--ink);font-size:16px;">${fmtKc(grandTotal)}</b>
    </p>
    ${exportButtonsHtml()}`;
}

function projectClosedDate(p){
  const phaseIds = p.phaseIds || [];
  if(!phaseIds.length || !p.closedPhases) return null;
  const dates = phaseIds.map(pid => p.closedPhases[pid]);
  if(dates.some(d => !d)) return null;
  return dates.reduce((max,d) => (d > max ? d : max), dates[0]);
}

function lastPhaseActivityDate(projectId, phaseId){
  const entryDates = (state.adminEntriesFlat || []).filter(en => en.projectId === projectId && en.phaseId === phaseId).map(en => en.date);
  const costDates = (state.costs || []).filter(c => c.projectId === projectId && c.phaseId === phaseId).map(c => c.date);
  const all = entryDates.concat(costDates).filter(Boolean);
  if(!all.length) return null;
  return all.reduce((max,d) => (d > max ? d : max), all[0]);
}

function adminClosedProjectsTemplate(){
  if(state.adminEntriesFlat === null || state.costs === null){
    return `<div class="empty-state">Načítání…</div>`;
  }
  const mode = state.closedProjectsMode === "phase" ? "phase" : "project";
  const toggleHtml = `
    <div class="phase-picker" style="margin-bottom:16px;">
      <button type="button" class="phase-chip ${mode === "project" ? "selected" : ""}" data-action="closed-projects-mode" data-mode="project">Celý projekt</button>
      <button type="button" class="phase-chip ${mode === "phase" ? "selected" : ""}" data-action="closed-projects-mode" data-mode="phase">Fáze</button>
    </div>`;

  let items;
  if(mode === "project"){
    items = state.config.projects
      .map(p => ({ p, pid: null, closedDate: projectClosedDate(p) }))
      .filter(x => x.closedDate)
      .map(x => ({ ...x, fin: projectFinancials(x.p) }));
  } else {
    items = [];
    state.config.projects.forEach(p => {
      (p.phaseIds || []).forEach(pid => {
        const closedDate = p.closedPhases && p.closedPhases[pid];
        if(closedDate) items.push({ p, pid, closedDate, fin: phaseFinancials(p, pid) });
      });
    });
  }

  if(!items.length){
    return `${toggleHtml}<div class="empty-state">${mode === "project" ? "Zatím žádné ukončené projekty. Projekt se považuje za ukončený, jakmile jsou uzavřené všechny jeho fáze (nastavuje se v detailu projektu)." : "Zatím žádné uzavřené fáze."}</div>`;
  }

  const selectedPhaseId = mode === "phase" ? (state.closedProjectsPhaseId || "") : "";
  const phaseFilterHtml = mode === "phase" ? (() => {
    const phaseIdsPresent = [...new Set(items.map(x => x.pid))];
    const phaseOptions = `<option value="">Všechny fáze</option>` + phaseIdsPresent.map(pid => {
      const ph = state.config.phases.find(x => x.id === pid);
      return `<option value="${esc(pid)}" ${selectedPhaseId === pid ? "selected" : ""}>${esc(pid)}${ph ? ` — ${esc(ph.name)}` : ""}</option>`;
    }).join("");
    return `<div class="field-row" style="max-width:220px;"><label class="field-label">Fáze</label><select id="closed-projects-phase">${phaseOptions}</select></div>`;
  })() : "";
  if(selectedPhaseId) items = items.filter(x => x.pid === selectedPhaseId);

  if(!items.length){
    return `${toggleHtml}${phaseFilterHtml}<div class="empty-state">Žádné uzavřené fáze pro zvolenou fázi.</div>`;
  }

  const years = [...new Set(items.map(x => x.closedDate.slice(0,4)))].sort((a,b) => b.localeCompare(a));
  const selectedYear = state.closedProjectsYear || "";
  const yearOptions = `<option value="">Všechny roky</option>` + years.map(y => `<option value="${esc(y)}" ${selectedYear === y ? "selected" : ""}>${esc(y)}</option>`).join("");

  const totalAll = items.reduce((s,x) => s + x.fin.status, 0);
  const filtered = items.filter(x => !selectedYear || x.closedDate.slice(0,4) === selectedYear);
  const totalYear = filtered.reduce((s,x) => s + x.fin.status, 0);
  const sortBy = ["amount","budget","pct"].includes(state.closedProjectsSort) ? state.closedProjectsSort : "date";
  const statusPctVal = fin => fin.totalBudget ? (fin.status/fin.totalBudget*100) : -Infinity;
  const sorted = filtered.slice().sort((a,b) => {
    if(sortBy === "amount") return b.fin.status - a.fin.status;
    if(sortBy === "budget") return b.fin.totalBudget - a.fin.totalBudget;
    if(sortBy === "pct") return statusPctVal(b.fin) - statusPctVal(a.fin);
    return (b.closedDate||"").localeCompare(a.closedDate||"");
  });

  const rows = sorted.map(({p, pid, closedDate, fin}) => {
    const statusColor = fin.status < 0 ? "var(--danger)" : "var(--sage)";
    const ph = pid ? state.config.phases.find(x => x.id === pid) : null;
    const phaseLabelHtml = pid ? ` <span class="entry-phase">${esc(pid)}</span> ${ph ? esc(ph.name) : ""}` : "";
    return `
    <div class="closed-row">
      <span><span class="entry-proj" data-project-id="${esc(p.id)}">#${esc(p.id)}</span> ${esc(p.name)}${phaseLabelHtml} <span class="meta">· uzavřeno ${esc(closedDate)}</span></span>
      <span class="num">${fmtKc(fin.totalBudget)}</span>
      <span class="num" style="color:${statusColor};">${fmtKc(fin.status)}</span>
      <span class="num" style="color:${statusColor};">${fmtStatusPct(fin.status, fin.totalBudget)}</span>
    </div>`;
  }).join("");

  return `
    ${toggleHtml}
    <div class="form-grid" style="max-width:600px;">
      <div class="field-row"><label class="field-label">Rok ukončení</label><select id="closed-projects-year">${yearOptions}</select></div>
      ${phaseFilterHtml}
      <div class="field-row"><label class="field-label">Seřadit podle</label><select id="closed-projects-sort">
        <option value="date" ${sortBy === "date" ? "selected" : ""}>Data uzavření (nejnovější)</option>
        <option value="budget" ${sortBy === "budget" ? "selected" : ""}>Nejvyšší rozpočet</option>
        <option value="amount" ${sortBy === "amount" ? "selected" : ""}>Nejvyšší zisk</option>
        <option value="pct" ${sortBy === "pct" ? "selected" : ""}>Nejvyšší zisk v %</option>
      </select></div>
    </div>
    <p class="q-hint" style="margin:14px 0 18px;">
      Součet zisku ${mode === "project" ? "všech ukončených projektů" : `všech uzavřených fází${selectedPhaseId ? ` (${esc(selectedPhaseId)})` : ""}`}: <b style="color:var(--ink);">${fmtKc(totalAll)}</b><br>
      Součet zisku ${selectedYear ? `za rok ${esc(selectedYear)}` : "za všechny roky"}: <b style="color:var(--ink);">${fmtKc(totalYear)}</b>
    </p>
    <div class="closed-head"><span>Projekt</span><span>Rozpočet</span><span>Zisk</span><span>Zisk %</span></div>
    <div class="project-list">${rows}</div>`;
}

const HOURS_OVERVIEW_MONTH_NAMES = ["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];

function hoursOverviewGroupRows(entries, keyFn, labelFn, sortFn){
  const groups = {};
  entries.forEach(e => {
    const key = keyFn(e);
    if(key === null || key === undefined || key === "") return;
    if(!groups[key]) groups[key] = { key, total: 0, p000: 0, p002: 0 };
    const h = Number(e.hours || 0);
    groups[key].total += h;
    if(e.projectId === "000") groups[key].p000 += h;
    if(e.projectId === "002") groups[key].p002 += h;
  });
  const rows = Object.values(groups).map(g => ({ label: labelFn(g.key), total: g.total, net: g.total - g.p000 - g.p002, p000: g.p000 }));
  rows.sort(sortFn);
  return rows;
}

function hoursOverviewTable(title, rows){

/* ---------------- hlídání rozpočtů ---------------- */
function budgetWatchRows(){
  if(state.adminEntriesFlat === null || state.costs === null) return null;
  const rows = [];
  state.config.projects.forEach(p => {
    if(projectClosedDate(p)) return;
    (p.phaseIds || []).forEach(pid => {
      const budget = phaseBudgetTotal(p, pid);
      if(!(budget > 0)) return;
      if(p.closedPhases && p.closedPhases[pid]) return;
      let labor = 0, extra = 0;
      state.adminEntriesFlat.forEach(e => {
        if(e.projectId !== p.id || e.phaseId !== pid) return;
        labor += Number(e.hours || 0) * hourlyRateForEmployee(state.config.employees.find(x => x.id === e.employeeId), e.date);
        extra += Number(e.cost || 0);
      });
      const costs = state.costs.filter(c => c.projectId === p.id && c.phaseId === pid).reduce((a, c) => a + Number(c.amount || 0), 0);
      const spent = labor + extra + costs;
      rows.push({ project: p, phaseId: pid, budget, spent, pct: spent / budget * 100 });
    });
  });
  return rows.filter(r => r.pct >= 80).sort((a, b) => b.pct - a.pct);
}
function adminBudgetWatchTemplate(){
  const rows = budgetWatchRows();
  if(rows === null) return `<div class="empty-state">Načítání…</div>`;
  const body = rows.length ? rows.map(r => {
    const phase = state.config.phases.find(x => x.id === r.phaseId);
    const level = r.pct >= 100 ? "over" : "warn";
    return `
    <div class="bw-row ${level}">
      <div class="bw-head">
        <span class="entry-proj" data-project-id="${esc(r.project.id)}">#${esc(r.project.id)}</span>
        <span class="bw-name">${esc(r.project.name)}</span>
        <span class="entry-phase">${esc(r.phaseId)}</span>
        <span class="bw-phase">${phase ? esc(phase.name) : ""}</span>
        <b class="bw-pct">${Math.round(r.pct)} %</b>
      </div>
      <div class="bw-bar"><i style="width:${Math.min(100, r.pct)}%;"></i></div>
      <div class="bw-sum">Náklady ${fmtKc(r.spent)} z rozpočtu ${fmtKc(r.budget)}${r.pct >= 100 ? ` · překročeno o ${fmtKc(r.spent - r.budget)}` : ` · zbývá ${fmtKc(r.budget - r.spent)}`}</div>
    </div>`;
  }).join("") : `<div class="empty-state">Žádná fáze není na 80 % rozpočtu ani výš.</div>`;
  return `
    <p class="q-hint" style="margin:0 0 14px;">Fáze projektů, jejichž náklady dosáhly 80 % rozpočtu nebo ho překročily. Náklady = mzdy (hodiny × hodinová sazba) + náklady zapsané u hodin + nákladové položky projektu. Uzavřené projekty a fáze se nehlídají.</p>
    ${body}`;
}

/* ---------------- export výkazů (CSV pro Excel) ---------------- */
function csvCell(v){
  const t = String(v === null || v === undefined ? "" : v);
  return /[;"\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
}
function csvNum(n){ return String(Math.round((Number(n) || 0) * 100) / 100).replace(".", ","); }
function downloadCsv(rows, filename){
  const text = "﻿" + rows.map(r => r.map(csvCell).join(";")).join("\r\n");
  downloadBlob(new Blob([text], { type: "text/csv;charset=utf-8" }), filename);
}
function exportScopeOptions(entries){
  const months = [...new Set(entries.map(e => (e.date || "").slice(0, 7)).filter(Boolean))].sort().reverse();
  const years = [...new Set(months.map(m => m.slice(0, 4)))];
  const out = [];
  months.forEach(m => out.push({ value: m, label: fmtMonthLabel(m) }));
  years.forEach(y => out.push({ value: y, label: `Celý rok ${y}` }));
  return out;
}
function exportCurrentScope(entries){
  const opts = exportScopeOptions(entries);
  const wanted = state.exportScope;
  return (opts.find(o => o.value === wanted) || opts[0] || { value: "", label: "" });
}
function adminTimesheetExportTemplate(){
  if(state.adminEntriesFlat === null) return `<div class="empty-state">Načítání…</div>`;
  const entries = state.adminEntriesFlat;
  if(!entries.length) return `<div class="empty-state">Zatím nejsou zadané žádné hodiny.</div>`;
  const opts = exportScopeOptions(entries);
  const scope = exportCurrentScope(entries);
  const empId = state.exportEmployeeId || "";
  return `
    <p class="q-hint" style="margin:0 0 12px;">Stáhne výkazy jako soubor CSV, který se přímo otevře v Excelu. Hodí se pro mzdy a účetní.</p>
    <div class="form-grid">
      <div class="field-row"><label class="field-label">Období</label>
        <select id="export-scope-select">${opts.map(o => `<option value="${esc(o.value)}" ${o.value === scope.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select></div>
      <div class="field-row"><label class="field-label">Zaměstnanec</label>
        <select id="export-employee-select"><option value="">Všichni</option>${state.config.employees.map(e => `<option value="${esc(e.id)}" ${e.id === empId ? "selected" : ""}>${esc(e.name)}</option>`).join("")}</select></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;">
      <button type="button" class="btn btn-tan btn-small" data-action="export-timesheet-detail">Stáhnout výkaz po záznamech (CSV)</button>
      <button type="button" class="btn btn-outline btn-small" data-action="export-timesheet-summary">Stáhnout souhrn po zaměstnancích (CSV)</button>
    </div>`;
}
function exportTimesheetCsv(kind){
  const entries = state.adminEntriesFlat || [];
  const scope = exportCurrentScope(entries);
  const empId = state.exportEmployeeId || "";
  const picked = entries.filter(e => (e.date || "").startsWith(scope.value) && (!empId || e.employeeId === empId))
    .sort((a, b) => (a.date || "").localeCompare(b.date || "") || String(a.employeeName).localeCompare(String(b.employeeName), "cs"));
  const base = `vykazy_${scope.value}${empId ? "_" + stripDiacritics((state.config.employees.find(x => x.id === empId) || {}).name || "").replace(/\s+/g, "_") : ""}`;
  if(kind === "summary"){
    const byEmp = {};
    picked.forEach(e => {
      const r = byEmp[e.employeeId] = byEmp[e.employeeId] || { name: e.employeeName, total: 0, net: 0, vac: 0, cost: 0 };
      const h = Number(e.hours || 0);
      r.total += h;
      if(e.projectId !== "000" && e.projectId !== "002") r.net += h;
      if(e.projectId === "000" && e.phaseId === "DOV") r.vac += h;
      r.cost += Number(e.cost || 0);
    });
    const rows = [["Zaměstnanec", "Hodiny celkem", "Hodiny na projektech (bez 000 a 002)", "Dovolená (h)", "Náklady zapsané u hodin (Kč)"]];
    let t = 0, n = 0, v = 0, c = 0;
    Object.values(byEmp).sort((a, b) => String(a.name).localeCompare(String(b.name), "cs")).forEach(r => {
      rows.push([r.name, csvNum(r.total), csvNum(r.net), csvNum(r.vac), csvNum(r.cost)]);
      t += r.total; n += r.net; v += r.vac; c += r.cost;
    });
    rows.push(["Celkem", csvNum(t), csvNum(n), csvNum(v), csvNum(c)]);
    downloadCsv(rows, `${base}_souhrn.csv`);
    return;
  }
  const rows = [["Datum", "Zaměstnanec", "Projekt", "Název projektu", "Fáze", "Hodiny", "Náklady (Kč)", "Poznámka"]];
  let th = 0, tc = 0;
  picked.forEach(e => {
    const proj = state.config.projects.find(p => p.id === e.projectId);
    rows.push([e.date, e.employeeName, e.projectId, proj ? proj.name : "", e.phaseId || "", csvNum(e.hours), csvNum(e.cost), e.note || ""]);
    th += Number(e.hours || 0); tc += Number(e.cost || 0);
  });
  rows.push(["Celkem", "", "", "", "", csvNum(th), csvNum(tc), ""]);
  downloadCsv(rows, `${base}.csv`);
}

  return entries.filter(e => e.projectId === "000" && e.phaseId === "DOV" && (e.date || "").slice(0, 4) === String(year))
    .reduce((a, e) => a + Number(e.hours || 0), 0);

function bindApp(){
  const gotoAdmin = document.getElementById("goto-admin-btn") || document.getElementById("goto-admin-btn2");
  if(gotoAdmin) gotoAdmin.onclick = () => setState({ tab: "admin" });

  const toggleAllProjects = document.querySelector('[data-action="toggle-all-projects-section"]');
  if(toggleAllProjects) toggleAllProjects.onclick = () => {
    const opening = !state.showAllProjects;
    setState({ showAllProjects: opening });

    phaseSelect.disabled = false;
    const dateStr = dateInput.value;

    const projectChanged = (phaseSelect.dataset.forProject !== undefined ? phaseSelect.dataset.forProject : entry.projectId) !== project.id;

    const availablePhases = phasesForProject(project).filter(ph => ph.id === keepClosedAnyway || !isPhaseClosedOnDate(project, ph.id, dateStr));
    phaseSelect.innerHTML = availablePhases.length

    const date = row.querySelector(".my-entry-edit-date").value;

    const note = row.querySelector(".my-entry-edit-note").value.trim();

    if(!isPhaseless && !getFormPhaseOptions(project, date).some(p => p.id === phaseId)){

  const entryTimerStartBtn = document.getElementById("entry-timer-start-btn");

    state.entryTimerAccumulated = currentTimerElapsedMs();
    state.entryTimerStart = null;
    persistFormTimer();
    updateEntryTimerButtonsUI();
    startEntryTimerTick();
  };
  const entryTimerStopBtn = document.getElementById("entry-timer-stop-btn");
  if(entryTimerStopBtn) entryTimerStopBtn.onclick = () => {
    if(!state.entryTimerStart && !state.entryTimerAccumulated) return;
    const hours = Math.max(0.01, Math.round((currentTimerElapsedMs() / 3600000) * 100) / 100);
    const hoursInput = document.getElementById("entry-hours-input");
    if(hoursInput) hoursInput.value = hours;

    if(form && !form.reportValidity()) return;
    const formDateInput = document.getElementById("entry-date-input");
    if(formDateInput && isDateLocked(formDateInput.value)){ warnLocked(formDateInput.value); return; }
    state.entryTimerStart = null;
    state.entryTimerAccumulated = 0;
    persistFormTimer();
    if(form) form.requestSubmit();
  };
  if(state.pendingFormFields && document.getElementById("add-entry-form")){
    applyFormSnapshot(state.pendingFormFields);
    state.pendingFormFields = null;
  }
  startEntryTimerTick();
}

  function resolvePaymentsArray(project, phaseId, itemId){
    if(itemId && itemId !== "legacy"){
      const items = project.phaseBudgetItems && project.phaseBudgetItems[phaseId];
      const item = items && items.find(it => it.id === itemId);
      if(!item) return null;
      if(!Array.isArray(item.payments)) item.payments = [];
      return item.payments;

        const dateVal = row[dateCol], projVal = row[projCol], hoursVal = row[hoursCol];
        if(dateVal === undefined || projVal === undefined || hoursVal === undefined || hoursVal === "") continue;

          minDate: dates[0],

          skipped

      });

function showStamp(){
  const t = document.getElementById("toast");
  t.classList.remove("show"); void t.offsetWidth;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1000);
}

document.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const el = e.target;
  if(!el || (el.tagName !== "INPUT" && el.tagName !== "SELECT")) return;
  if(el.closest("[data-cost-edit-row]") || el.closest("[data-labor-edit-row]")) return;
  const form = el.closest("form");
  if(!form) return;
  e.preventDefault();
  if(form.requestSubmit) form.requestSubmit();
  else form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
});

function bindFormTimerPersistence(){
  const save = () => { if(state.entryTimerStart || state.entryTimerAccumulated) persistFormTimer(); };
  document.addEventListener("input", e => { if(e.target && e.target.form && e.target.form.id === "add-entry-form") save(); });
  document.addEventListener("change", e => { if(e.target && e.target.form && e.target.form.id === "add-entry-form") save(); });
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") save(); });
}
// Clicking (or tabbing) into a text/number field selects its whole content, so typing replaces
// it. Programmatic focus (e.g. keeping the cursor while a live search re-renders) is ignored.
function bindSelectOnFocus(){
  const SELECTABLE = ["text", "number", "search", "tel", "email", "url", "password"];
  let lastUserFocus = 0;
  const mark = () => { lastUserFocus = Date.now(); };
  document.addEventListener("pointerdown", mark, true);
  document.addEventListener("touchstart", mark, true);
  document.addEventListener("keydown", e => { if(e.key === "Tab") mark(); }, true);
  document.addEventListener("focusin", e => {
    const el = e.target;
    if(!el || el.tagName !== "INPUT" || !SELECTABLE.includes(el.type) || el.readOnly || el.disabled) return;
    if(Date.now() - lastUserFocus > 500) return;
    el.dataset.justFocused = "1";
    try{ el.select(); }catch(err){}
  });
  document.addEventListener("mouseup", e => {
    const el = e.target;
    if(el && el.dataset && el.dataset.justFocused){
      delete el.dataset.justFocused;
      e.preventDefault();
    }
  }, true);
  document.addEventListener("focusout", e => { if(e.target && e.target.dataset) delete e.target.dataset.justFocused; });
}

// Date inputs fire "change" for every intermediate value while typing (year "2" is already 0002),
// and several filters re-render on change, which resets the field mid-typing. Hold the event back
// until the year is plausible and the user has paused briefly, then pass it on to the real handlers.
function bindDateInputGuard(){
  const timers = new WeakMap();
  document.addEventListener("change", e => {
    const el = e.target;
    if(!el || el.tagName !== "INPUT" || el.type !== "date" || e.__fromDateGuard) return;
    e.stopImmediatePropagation();
    clearTimeout(timers.get(el));
    const year = Number((el.value || "").slice(0, 4));
    if(el.value && (year < 1000 || year > 9999)) return;
    timers.set(el, setTimeout(() => {
      if(!el.isConnected) return;
      const ev = new Event("change", { bubbles: true });
      ev.__fromDateGuard = true;
      el.dispatchEvent(ev);
    }, 700));
  }, true);
}
