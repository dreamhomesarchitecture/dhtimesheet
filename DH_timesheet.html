<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Časové výkazy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --canvas: #ffffff;
    --paper: #ffffff;
    --ink: #14130f;
    --soft: #8b887f;
    --line: #e7e4dc;
    --sage: #A4AC7F;
    --sage-tint: rgba(164,172,127,0.16);
    --tan: #BA9470;
    --tan-tint: rgba(186,148,112,0.16);
    --danger: #b3382c;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--canvas);
    color: var(--ink);
    font-family:'DM Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding: 148px 18px 60px;
  }
  #tab-content{ margin-top: 14px; }
  .app{ width:100%; max-width: 760px; }

  .topbar{
    position:fixed; top:0; left:0; right:0;
    width:100%;
    background: var(--paper);
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px clamp(18px, 4vw, 56px) 18px;
    gap:14px;
    z-index: 50;
  }
  .brand{ display:flex; align-items:center; cursor:pointer; }
  .brand:hover{ opacity:.75; }
  .brand img{ height:75px; width:auto; display:block; }
  .topbar-right{ display:flex; align-items:center; gap:18px; }
  .nav-links{ display:flex; gap:26px; }
  .nav-links button{
    background:none; border:none; cursor:pointer;
    font-family:'DM Sans', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color: var(--soft);
    padding:6px 0; border-bottom:2px solid transparent;
  }
  .nav-links button.active{ color: var(--ink); }
  .nav-links button[data-tab="app"].active{ border-color: var(--sage); }
  .nav-links button[data-tab="projects"].active{ border-color: var(--ink); }
  .nav-links button[data-tab="admin"].active{ border-color: var(--tan); }
  .project-search{ max-width:320px; margin-bottom:20px; }
  .project-list{ display:flex; flex-direction:column; gap:8px; }
  .project-item{ border:1.5px solid var(--line); border-radius:12px; overflow:hidden; }
  .project-item.open{ border-color: var(--soft); }
  .project-head{ display:grid; grid-template-columns: 18px 90px 1fr 110px; gap:12px; padding:0 16px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin-bottom:2px; }
  .project-row{ display:grid; grid-template-columns: 18px 90px 1fr 110px; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; }
  .project-row:hover{ background: var(--sage-tint); }
  .project-row .chevron{ color:var(--soft); font-size:11px; transition:transform .15s; }
  .project-item.open .project-row .chevron{ transform:rotate(90deg); }
  .project-row .name{ font-size:14.5px; }
  .project-hours{ font-size:15px; font-weight:700; text-align:right; color:var(--tan); font-variant-numeric:tabular-nums; }
  .project-hours.zero{ color:var(--soft); font-weight:400; }
  .project-detail{ padding:6px 16px 18px 46px; border-top:1.5px solid var(--line); }
  .project-detail-total{ display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; font-size:14px; color:var(--soft); }
  .project-detail-total b{ color:var(--ink); font-size:17px; }
  .phase-block{ border:1.5px solid var(--line); border-radius:10px; padding:10px 14px; margin-top:8px; }
  .phase-block-head{ display:flex; align-items:center; gap:10px; font-size:13.5px; }
  .phase-block-head b{ margin-left:auto; color:var(--tan); font-variant-numeric:tabular-nums; }
  .phase-employees{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:5px; }
  .phase-employee-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--soft); }
  .phase-employee-row span:last-child{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .logout-link{
    background:none; border:none; cursor:pointer; color:var(--soft);
    font-family:'DM Sans', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; text-decoration:underline;
  }
  .logout-link:hover{ color:var(--ink); }

  h1,h2,h3{ margin:0; }

  .sheet{
    background: transparent;
    padding: 10px 4px 24px;
    min-height: 340px;
    display:flex; flex-direction:column;
    position:relative;
  }
  .eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color: var(--soft); margin-bottom:18px; }
  .eyebrow b{ color: var(--ink); }
  .q-title{ font-weight:800; font-size:30px; line-height:1.2; letter-spacing:-0.01em; margin-bottom:8px; }
  .q-hint{ color: var(--soft); font-size:14px; line-height:1.55; margin-bottom:26px; }
  .q-body{ flex:1; }

  textarea, input[type=text], input[type=date], input[type=month],
  input[type=number], input[type=password], select{
    width:100%;
    border: 1.5px solid var(--line);
    background:#fff;
    padding: 13px 15px;
    font-family:'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    border-radius: 10px;
  }
  textarea:focus, input:focus, select:focus{ outline:none; border-color: var(--ink); }

  .choices{ display:flex; flex-direction:column; gap:9px; }
  .choice-btn{
    text-align:left; display:flex; align-items:center; gap:11px;
    border: 1.5px solid var(--line); background:#fff;
    padding: 13px 16px; font-size:15px; color: var(--ink);
    cursor:pointer; border-radius:12px; width:100%;
    transition: border-color .12s, background .12s;
    font-family:'DM Sans', sans-serif;
  }
  .choice-btn .dot{ width:14px; height:14px; border-radius:50%; border:1.5px solid var(--soft); flex:none; position:relative; }
  .choice-btn.selected{ border-color: var(--sage); background: var(--sage-tint); }
  .choice-btn.selected .dot{ border-color: var(--sage); }
  .choice-btn.selected .dot::after{ content:""; position:absolute; inset:3px; border-radius:50%; background: var(--sage); }
  .choice-btn:hover{ border-color: var(--ink); }

  .gate{ text-align:center; padding: 20px 10px; }
  .gate p{ color:var(--soft); font-size:14px; margin: 8px 0 20px; }
  .gate input{ max-width:220px; margin: 0 auto 16px; text-align:center; }

  .admin-block{ margin-bottom: 30px; }
  .admin-block-title{ font-weight:700; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); margin-bottom:14px; padding-bottom:10px; border-bottom:1.5px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .admin-block-title span:first-child{ color: var(--ink); }

  .resp-item{ border:1.5px solid var(--line); border-radius:14px; padding:14px 18px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .resp-item .meta{ font-size:12.5px; color:var(--soft); }
  .admin-project-item{ border:1.5px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:10px; }
  .admin-project-head{ display:flex; align-items:center; gap:10px; }
  .admin-project-head .grow{ flex:1; font-size:14px; }
  .phase-picker-wrap{ margin-top:10px; padding-top:10px; border-top:1.5px solid var(--line); }
  .phase-picker{ display:flex; flex-wrap:wrap; gap:6px; }
  .phase-chip{ border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; color:var(--soft); font-family:'DM Sans', sans-serif; }
  .phase-chip.selected{ background:var(--tan); border-color:var(--tan); color:#fff; }
  .mini-calendar{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:16px; }
  .cal-dow{ font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--soft); text-align:center; padding-bottom:4px; }
  .cal-day{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .cal-day.empty{ visibility:hidden; }
  .cal-daynum{ font-size:11px; color:var(--soft); }
  .cal-hours{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }
  .cal-hours.has{ background:var(--sage); color:#fff; }
  .cal-hours.empty{ background:transparent; }
  .year-overview{ margin-bottom:18px; }
  .year-nav{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .year-label{ font-weight:800; font-size:16px; letter-spacing:-0.01em; }
  .year-total{ font-weight:600; font-size:13px; color:var(--soft); }
  .year-months{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .year-month{ display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:6px 2px; border-radius:10px; }
  .year-month:hover{ background:var(--sage-tint); }
  .year-month.current{ background:var(--sage-tint); }
  .year-month-num{ font-size:10px; color:var(--soft); font-weight:700; }
  .year-month-hours{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }
  .year-month-hours.has{ background:var(--sage); color:#fff; }
  .year-month-hours.empty{ background:transparent; color:var(--soft); }

  .field-row{ margin-bottom:11px; }
  .field-label{ font-size:11px; font-weight:700; color:var(--soft); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px; }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:10px; align-items:end; }
  .entry-form-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:end; }
  .entry-form-row .field-row{ margin-bottom:0; flex:0 0 auto; }
  .entry-form-row input, .entry-form-row select{ padding:10px 11px; font-size:13.5px; }
  .entry-form-row .w-date{ width:150px; }
  .entry-form-row .w-hours{ width:78px; }
  .entry-form-row .w-select{ width:150px; }
  .entry-form-row .w-cost{ width:100px; }
  .entry-form-row .grow{ flex:1 1 220px; }
  .entry-form-row .w-btn{ flex:0 0 auto; }
  .entry-form-row .w-btn .btn{ padding:10px 22px; white-space:nowrap; }
  .icon-btn{ background:none; border:1.5px solid var(--line); border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:13px; color:var(--soft); line-height:1; flex:none; }
  .icon-btn:hover{ border-color:var(--ink); color:var(--ink); }

  .btn{ font-family:'DM Sans', sans-serif; font-weight:700; font-size:14px; border-radius:999px; padding:13px 26px; cursor:pointer; border:1.5px solid var(--ink); }
  .btn-primary{ background: var(--ink); color:#fff; }
  .btn:disabled{ opacity:.32; cursor:not-allowed; }
  .btn-outline{ background:none; color:var(--ink); }
  .btn-sage{ background: var(--sage); border-color: var(--sage); color:#fff; }
  .btn-tan{ background: var(--tan); border-color: var(--tan); color:#fff; }
  .btn-small{ padding:8px 15px; font-size:12.5px; border-radius:999px; }
  .btn-danger{ border-color: var(--danger); color: var(--danger); background:none; }
  .btn-danger:hover{ background: var(--danger); color:#fff; }

  .empty-state{ text-align:center; color:var(--soft); padding:30px 10px; font-size:14px; border:1.5px dashed var(--line); border-radius:14px; }
  .empty-state .btn{ margin-top:14px; }
  .save-msg{ font-size:12.5px; color: var(--sage); font-weight:700; }

  .totals{ margin-top:4px; margin-bottom:24px; padding:16px 20px; border:1.5px solid var(--line); border-radius:14px; }
  .totals-row{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:14px; color: var(--soft); padding:3px 0; }
  .totals-row.grand{ font-weight:700; margin-top:6px; padding-top:12px; border-top:1.5px solid var(--line); }
  .totals-row.grand span{ color: var(--ink); }
  .totals-row.grand b{ color: var(--tan); font-size:22px; }
  .totals-row b{ color:var(--ink); font-size:15.5px; }

  .entries{ display:flex; flex-direction:column; gap:8px; }
  .entry-head{ display:grid; grid-template-columns: 92px 1fr 90px 64px 84px 1fr 28px 28px; gap:10px; padding:0 14px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin-bottom:2px; }
  .entry-row{ display:grid; grid-template-columns: 92px 1fr 90px 64px 84px 1fr 28px 28px; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; transition:border-color .12s; }
  .entry-row:hover{ border-color: var(--soft); }
  .entry-date{ font-size:13px; color:var(--soft); }
  .entry-proj{ font-size:12.5px; background: var(--sage-tint); color:var(--ink); border-radius:6px; padding:3px 8px; display:inline-block; }
  .entry-proj.gone{ background: var(--tan-tint); color:var(--tan); }
  .entry-phase{ font-size:12px; background: var(--tan-tint); color: var(--tan); border-radius:6px; padding:3px 8px; display:inline-block; }
  .entry-phase.gone{ background: var(--sage-tint); color:var(--soft); }
  .entry-num{ font-size:14px; text-align:right; }
  .entry-note{ font-size:13px; color:var(--soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .month-field{ max-width:200px; margin-bottom:22px; }

  .stamp-toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background: var(--ink); color:#fff; font-weight:700; font-size:12.5px;
    letter-spacing:.08em; text-transform:uppercase; padding:11px 20px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:80;
  }
  .stamp-toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .app-foot{ color: var(--soft); font-size:12px; text-align:center; margin-top:30px; line-height:1.6; max-width:520px; margin-left:auto; margin-right:auto; }

  @media (max-width:520px){
    .sheet{ padding:10px 2px 20px; }
    .topbar{ padding: 16px 18px 14px; }
    .brand img{ height:59px; }
    .nav-links{ gap:14px; }
    .nav-links button{ font-size:10.5px; }
    .entry-head{ display:none; }
    .entry-row{ grid-template-columns: 1fr; gap:6px; }
    .project-head{ display:none; }
    .project-row{ grid-template-columns: 16px auto 1fr; }
    .project-hours{ grid-column: 1 / -1; text-align:left; }
    .project-detail{ padding-left:16px; }
    .entry-form-row .field-row{ flex:1 1 100%; width:100%; }
    .entry-form-row .w-date, .entry-form-row .w-hours, .entry-form-row .w-select, .entry-form-row .w-cost, .entry-form-row .grow{ width:100%; }
    .entry-form-row .w-btn .btn{ width:100%; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" class="stamp-toast">✓ Zapsáno</div>

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function phasesForProject(project){
  if(!project || !project.phaseIds || project.phaseIds.length === 0) return [];
  return state.config.phases.filter(ph => project.phaseIds.includes(ph.id));
}
function sortedProjects(){
  return [...state.config.projects].sort((a,b) => {
    const na = Number(a.id), nb = Number(b.id);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a.id).localeCompare(String(b.id));
  });
}
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7); }
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function fmtH(n){ return (Number(n)||0).toLocaleString("cs-CZ",{maximumFractionDigits:2}) + " h"; }
function fmtHShort(n){ return (Number(n)||0).toLocaleString("cs-CZ",{maximumFractionDigits:1}); }
function fmtKc(n){ return (Number(n)||0).toLocaleString("cs-CZ") + " Kč"; }
function todayStr(){ return new Date().toISOString().slice(0,10); }

async function storageGet(key){
  const r = await fetch(`/api/timesheet?key=${encodeURIComponent(key)}`);
  if(r.status === 404) return null;
  if(!r.ok) throw new Error(`storageGet ${key} failed: ${r.status}`);
  return r.json();
}
async function storageSet(key, value){
  const r = await fetch(`/api/timesheet?key=${encodeURIComponent(key)}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value })
  });
  if(!r.ok) throw new Error(`storageSet ${key} failed: ${r.status}`);
}
async function storageDelete(key){
  await fetch(`/api/timesheet?key=${encodeURIComponent(key)}`, { method: "DELETE" });
}

async function loadConfig(){
  try{

    if(!res) return { ...DEFAULT_CONFIG };
    return JSON.parse(res.value);

}

function sheetSafeName(name, taken){
  let base = String(name || "").replace(/[\/\\?*\[\]:]/g, " ").trim().slice(0, 31) || "Zaměstnanec";
  let candidate = base;
  let n = 2;
  while(taken.has(candidate)){
    const suffix = ` (${n})`;
    candidate = base.slice(0, 31 - suffix.length) + suffix;
    n++;
  }
  taken.add(candidate);
  return candidate;
}

function buildTimesheetWorkbook(entriesByEmployee){
  const projectsById = {}; state.config.projects.forEach(p => projectsById[p.id] = p.name);
  const phasesById = {}; state.config.phases.forEach(p => phasesById[p.id] = p.name);
  const header = ["Datum", "Číslo projektu", "Projekt", "Fáze", "Název fáze", "Hodiny", "Náklady (Kč)", "Poznámka"];
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();
  state.config.employees.forEach(emp => {
    const entries = (entriesByEmployee[emp.id] || []).slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    const totalHours = entries.reduce((s, e) => s + Number(e.hours || 0), 0);
    const rows = entries.map(e => [
      e.date || "",
      e.projectId || "",
      projectsById[e.projectId] || "",
      e.phaseId || "",
      phasesById[e.phaseId] || "",
      Number(e.hours || 0),
      Number(e.cost || 0),
      e.note || ""
    ]);
    rows.push([]);
    rows.push(["", "", "", "", "Celkem hodin", totalHours, "", ""]);
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    ws["!cols"] = [{ wch: 11 }, { wch: 13 }, { wch: 28 }, { wch: 8 }, { wch: 18 }, { wch: 9 }, { wch: 13 }, { wch: 40 }];
    XLSX.utils.book_append_sheet(wb, ws, sheetSafeName(emp.name, usedNames));
  });
  return wb;
}

function buildProjectDetail(projectId){
  const project = state.config.projects.find(p => p.id === projectId);
  const phases = state.config.phases;
  const entries = (state.allEntriesFlat || []).filter(e => e.projectId === projectId);
  const totalHours = entries.reduce((s,e) => s + Number(e.hours||0), 0);

  const byPhase = {};
  entries.forEach(e => {
    const pid = e.phaseId || "—";
    if(!byPhase[pid]) byPhase[pid] = { total: 0, byEmployee: {} };
    byPhase[pid].total += Number(e.hours||0);
    byPhase[pid].byEmployee[e.employeeName] = (byPhase[pid].byEmployee[e.employeeName] || 0) + Number(e.hours||0);
  });

  // zobrazit fáze přiřazené projektu (i s 0 h) + jakoukoli fázi s reálně zapsanými hodinami
  const assignedIds = (project && project.phaseIds) ? project.phaseIds : [];
  const idsWithHours = Object.keys(byPhase);
  const phaseIds = Array.from(new Set([...assignedIds, ...idsWithHours]));
  const masterOrder = phases.map(p => p.id);
  phaseIds.sort((a,b) => {
    const ha = byPhase[a] ? byPhase[a].total : 0;
    const hb = byPhase[b] ? byPhase[b].total : 0;
    if(hb !== ha) return hb - ha;
    return masterOrder.indexOf(a) - masterOrder.indexOf(b);
  });

  const phaseBlocks = phaseIds.map(pid => {
    const phase = phases.find(p => p.id === pid);
    const label = phase ? `${esc(phase.name)}` : (pid === "—" ? "Bez fáze" : esc(pid));
    const data = byPhase[pid] || { total: 0, byEmployee: {} };
    const empRows = Object.entries(data.byEmployee)
      .sort((a,b) => b[1]-a[1])
      .map(([name,h]) => `<div class="phase-employee-row"><span>${esc(name)}</span><span>${fmtH(h)}</span></div>`)
      .join("");
    return `
      <div class="phase-block">
        <div class="phase-block-head"><span class="entry-phase">${phase ? esc(phase.id) : "?"}</span> ${label} <b>${fmtH(data.total)}</b></div>
        ${empRows ? `<div class="phase-employees">${empRows}</div>` : ``}
      </div>`;
  }).join("");

  return `
    <div class="project-detail">
      <div class="project-detail-total"><span>Projekt celkem</span><b>${fmtH(totalHours)}</b></div>

function bindProjects(){

    document.querySelectorAll("#project-list .project-item").forEach(item => {
      item.style.display = item.getAttribute("data-search").includes(q) ? "" : "none";

  document.querySelectorAll('[data-action="toggle-project"]').forEach(row => row.onclick = () => {
    const id = row.getAttribute("data-id");

function buildYearOverview(year, hoursByMonthNum, yearTotal, currentMonthNum){
  let cells = "";
  for(let i = 1; i <= 12; i++){
    const mm = String(i).padStart(2,"0");
    const h = hoursByMonthNum[mm] || 0;
    const isCurrent = mm === currentMonthNum;
    cells += `
      <div class="year-month ${isCurrent ? "current" : ""}" data-action="jump-month" data-month="${year}-${mm}">
        <span class="year-month-num">${i}</span>
        <span class="year-month-hours ${h ? "has" : "empty"}">${h ? fmtHShort(h) : ""}</span>
      </div>`;
  }
  return `
    <div class="year-overview">
      <div class="year-nav">
        <button class="icon-btn" data-action="year-prev" type="button">‹</button>
        <span class="year-label">${year} <span class="year-total">· ${fmtH(yearTotal)} celkem</span></span>
        <button class="icon-btn" data-action="year-next" type="button">›</button>
      </div>
      <div class="year-months">${cells}</div>
    </div>`;
}

function buildMiniCalendar(month, hoursByDay){
  const [y, m] = month.split("-").map(Number);
  const firstDay = new Date(y, m - 1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = (firstDay.getDay() + 6) % 7; // 0 = pondělí

  const dow = ["PO","ÚT","ST","ČT","PÁ","SO","NE"];
  let cells = dow.map(d => `<div class="cal-dow">${d}</div>`).join("");
  for(let i = 0; i < startWeekday; i++) cells += `<div class="cal-day empty"></div>`;
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const h = hoursByDay[dateStr] || 0;
    cells += `
      <div class="cal-day">
        <div class="cal-daynum">${d}</div>
        <div class="cal-hours ${h ? "has" : "empty"}">${h ? fmtHShort(h) : ""}</div>
      </div>`;
  }
  return `<div class="mini-calendar">${cells}</div>`;
}

            <p style="margin:0 0 6px;"><b>${state.importPreview.entries.length}</b> záznamů připraveno k importu pro <b>${esc((state.config.employees.find(e=>e.id===state.importPreview.employeeId)||{}).name || "")}</b> (${fmtH(state.importPreview.totalHours)} celkem), rozsah ${esc(state.importPreview.minDate)} – ${esc(state.importPreview.maxDate)}.</p>
            ${state.importPreview.unknownProjects.length ? `<p class="q-hint" style="color:var(--danger);">Přeskočeno ${state.importPreview.skipped} řádků s neznámým projektem: ${state.importPreview.unknownProjects.map(esc).join(", ")}. Přidejte je nejdřív v Projektech.</p>` : ``}

              <button class="btn btn-sage btn-small" type="button" id="import-confirm-btn">Potvrdit a uložit</button>

/* ---------------- bindings ---------------- */

function bindApp(){
  const gotoAdmin = document.getElementById("goto-admin-btn") || document.getElementById("goto-admin-btn2");
  if(gotoAdmin) gotoAdmin.onclick = () => setState({ tab: "admin" });

  const projectSelect = document.getElementById("entry-project-select");
  const phaseSelect = document.getElementById("entry-phase-select");
  const phaseFieldRow = document.getElementById("phase-field-row");
  const phaseWarning = document.getElementById("phase-warning");
  const noteInput = document.getElementById("entry-note-input");
  const noteLabel = document.getElementById("entry-note-label");
  const submitBtn = document.getElementById("add-entry-form") ? document.getElementById("add-entry-form").querySelector('button[type="submit"]') : null;

  function updateNoteRequirement(){
    if(!noteInput || !phaseSelect) return;
    const isAD = phaseSelect.value === "AD";
    if(isAD){
      noteInput.setAttribute("required", "required");
      noteInput.placeholder = "povinné u autorského dozoru";
      if(noteLabel) noteLabel.textContent = "Poznámka *";
    } else {
      noteInput.removeAttribute("required");
      noteInput.placeholder = "nepovinné";
      if(noteLabel) noteLabel.textContent = "Poznámka";
    }
  }

  if(projectSelect && phaseSelect){
    projectSelect.addEventListener("change", () => {
      const project = state.config.projects.find(p => p.id === projectSelect.value);
      if(project && project.phaseless){
        if(phaseFieldRow) phaseFieldRow.style.display = "none";
        phaseSelect.removeAttribute("required");
        phaseSelect.innerHTML = `<option value="">—</option>`;
        if(phaseWarning) phaseWarning.style.display = "none";
        if(submitBtn) submitBtn.disabled = false;
        updateNoteRequirement();
        return;
      }
      if(phaseFieldRow) phaseFieldRow.style.display = "";
      phaseSelect.setAttribute("required", "required");
      const phases = phasesForProject(project);
      phaseSelect.innerHTML = phases.length
        ? phases.map(p => `<option value="${esc(p.id)}">${esc(p.id)} — ${esc(p.name)}</option>`).join("")
        : `<option value="" disabled selected>— žádné fáze —</option>`;
      if(phaseWarning) phaseWarning.style.display = phases.length ? "none" : "";
      if(submitBtn) submitBtn.disabled = phases.length === 0;
      updateNoteRequirement();
    });
    phaseSelect.addEventListener("change", updateNoteRequirement);
    updateNoteRequirement();
  }

  document.querySelectorAll('[data-action="select-emp"]').forEach(b => b.onclick = () => {
    setState({ selectedEmployeeId: b.getAttribute("data-id"), loginError: false });
    const input = document.getElementById("login-pass-input");
    if(input) input.focus();
  });

  const loginInput = document.getElementById("login-pass-input");
  const loginBtn = document.getElementById("login-submit-btn");
  if(loginBtn){
    const tryLogin = async () => {
      const emp = state.config.employees.find(x => x.id === state.selectedEmployeeId);
      if(emp && loginInput.value === emp.password){
        state.currentEmployee = emp;
        state.entries = await loadEntries(emp.id);
        state.selectedEmployeeId = null;
        state.loginError = false;
        state.month = new Date().toISOString().slice(0,7);
        render();
      } else {
        setState({ loginError: true });
      }
    };
    loginBtn.onclick = tryLogin;
    loginInput.addEventListener("keydown", e => { if(e.key === "Enter") tryLogin(); });
  }

  const monthInput = document.getElementById("month-input");
  if(monthInput) monthInput.addEventListener("change", () => setState({ month: monthInput.value }));

  const yearPrevBtn = document.querySelector('[data-action="year-prev"]');
  const yearNextBtn = document.querySelector('[data-action="year-next"]');
  if(yearPrevBtn) yearPrevBtn.onclick = () => {
    const [y, m] = state.month.split("-");
    setState({ month: `${Number(y)-1}-${m}` });
  };
  if(yearNextBtn) yearNextBtn.onclick = () => {
    const [y, m] = state.month.split("-");
    setState({ month: `${Number(y)+1}-${m}` });
  };
  document.querySelectorAll('[data-action="jump-month"]').forEach(el => el.onclick = () => {
    setState({ month: el.getAttribute("data-month") });
  });

  document.querySelectorAll('[data-action="delete-entry"]').forEach(b => b.onclick = async () => {
    if(!confirm("Smazat tento záznam?")) return;
    state.entries = state.entries.filter(en => en.id !== b.getAttribute("data-id"));
    if(state.editingEntryId === b.getAttribute("data-id")) state.editingEntryId = null;
    await saveEntries(state.currentEmployee.id, state.currentEmployee.name, state.entries);
    render();
  });

  document.querySelectorAll('[data-action="edit-entry"]').forEach(b => b.onclick = () => {
    setState({ editingEntryId: b.getAttribute("data-id") });
    const formEl = document.getElementById("add-entry-form");
    if(formEl) formEl.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  const cancelEditBtn = document.getElementById("cancel-edit-btn");
  if(cancelEditBtn) cancelEditBtn.onclick = () => setState({ editingEntryId: null });

  const addEntryForm = document.getElementById("add-entry-form");
  if(addEntryForm) addEntryForm.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(addEntryForm).entries());
    const project = state.config.projects.find(p => p.id === data.projectId);
    const isPhaseless = !!(project && project.phaseless);
    const fields = { date: data.date, hours: Number(data.hours), projectId: data.projectId, phaseId: data.phaseId, cost: Number(data.cost)||0, note: (data.note||"").trim() };
    if(!fields.date || !fields.hours || !fields.projectId || (!isPhaseless && !fields.phaseId)) return;
    if(fields.phaseId === "AD" && !fields.note) return;

    if(state.editingEntryId){
      const idx = state.entries.findIndex(en => en.id === state.editingEntryId);
      if(idx !== -1) state.entries[idx] = { ...state.entries[idx], ...fields };
      state.editingEntryId = null;
    } else {
      state.entries.push({ id: uid("e"), ...fields });
    }
    await saveEntries(state.currentEmployee.id, state.currentEmployee.name, state.entries);
    showStamp();
    render();
  });
}

function bindAdmin(){
  if(!state.adminUnlocked){
    const input = document.getElementById("admin-pass-input");
    const submit = document.getElementById("admin-pass-submit");
    const tryUnlock = () => {
      if(input.value === state.config.adminPassword) setState({ adminUnlocked: true, adminPassError: false });
      else setState({ adminPassError: true });
    };
    submit.onclick = tryUnlock;
    input.addEventListener("keydown", e => { if(e.key === "Enter") tryUnlock(); });
    input.focus();
    return;
  }

  document.querySelectorAll('[data-action="toggle-admin-section"]').forEach(el => el.onclick = () => {
    const section = el.getAttribute("data-section");
    const newSection = state.adminOpenSection === section ? null : section;
    setState({ adminOpenSection: newSection });
    if(newSection === "hours" && state.adminEntriesFlat === null && !state.adminHoursLoading){
      loadAdminHours();
    }
  });
  const monthInput = document.getElementById("admin-month-input");
  if(monthInput) monthInput.addEventListener("change", () => setState({ adminMonth: monthInput.value }));

  document.querySelectorAll('[data-action="wipe-employee-data"]').forEach(b => b.onclick = async () => {
    const id = b.getAttribute("data-id");
    const emp = state.config.employees.find(x => x.id === id);
    if(!emp) return;
    if(!confirm(`Opravdu nenávratně smazat všechny odpracované hodiny zaměstnance ${emp.name}? Jméno a heslo zůstanou zachované, přihlásit se půjde dál, ale historie výkazů bude prázdná.`)) return;
    await deleteEntries(id);
    if(state.currentEmployee && state.currentEmployee.id === id) state.entries = [];
    state.allEntriesFlat = null;
    state.projectTotals = null;
    await loadAdminHours();
  });
  document.querySelectorAll('[data-action="delete-employee"]').forEach(b => b.onclick = async () => {
    if(!confirm("Smazat tohoto zaměstnance i jeho výkazy?")) return;
    const id = b.getAttribute("data-id");
    state.config.employees = state.config.employees.filter(x => x.id !== id);
    await saveConfig();
    await deleteEntries(id);
    render();
  });
  document.querySelectorAll('[data-action="delete-project"]').forEach(b => b.onclick = async () => {
    if(!confirm("Smazat tento projekt?")) return;
    state.config.projects = state.config.projects.filter(x => x.id !== b.getAttribute("data-id"));
    await saveConfig();
    render();
  });
  document.querySelectorAll('[data-action="toggle-admin-project"]').forEach(b => b.onclick = () => {
    const id = b.getAttribute("data-id");
    setState({ expandedAdminProjectId: state.expandedAdminProjectId === id ? null : id });
  });
  document.querySelectorAll('[data-action="toggle-edit-project"]').forEach(b => b.onclick = () => {
    const id = b.getAttribute("data-id");
    setState({ editingProjectId: state.editingProjectId === id ? null : id, editProjError: "" });
  });
  document.querySelectorAll('[data-action="cancel-edit-project"]').forEach(b => b.onclick = () => {
    setState({ editingProjectId: null, editProjError: "" });
  });
  document.querySelectorAll('[data-action="edit-project-form"]').forEach(form => form.addEventListener("submit", async e => {
    e.preventDefault();
    const oldId = form.getAttribute("data-id");
    const project = state.config.projects.find(x => x.id === oldId);
    if(!project) return;
    const data = Object.fromEntries(new FormData(form).entries());
    const newId = data.id.trim(), newName = data.name.trim();
    if(!newId || !newName) return;
    if(newId !== oldId && state.config.projects.some(x => x.id === newId)){
      setState({ editProjError: "Toto číslo projektu už existuje." }); return;
    }
    if(newId !== oldId){
      await renameProjectIdEverywhere(oldId, newId);
      project.id = newId;
      if(state.expandedAdminProjectId === oldId) state.expandedAdminProjectId = newId;
    }
    project.name = newName;
    state.editProjError = "";
    state.editingProjectId = null;
    state.allEntriesFlat = null;
    state.projectTotals = null;
    await saveConfig();
    await loadAdminHours();
  }));
  document.querySelectorAll('[data-action="toggle-admin-employee"]').forEach(row => row.onclick = () => {
    const id = row.getAttribute("data-id");
    setState({ expandedAdminEmployeeId: state.expandedAdminEmployeeId === id ? null : id });
  });
  document.querySelectorAll('[data-action="toggle-project-phase"]').forEach(b => b.onclick = async () => {
    const projectId = b.getAttribute("data-project-id");
    const phaseId = b.getAttribute("data-phase-id");
    const project = state.config.projects.find(x => x.id === projectId);
    if(!project || project.phaseless) return;
    if(!project.phaseIds) project.phaseIds = [];
    const idx = project.phaseIds.indexOf(phaseId);
    if(idx === -1) project.phaseIds.push(phaseId); else project.phaseIds.splice(idx, 1);
    await saveConfig();
    render();
  });
  document.querySelectorAll('[data-action="delete-phase"]').forEach(b => b.onclick = async () => {
    if(!confirm("Smazat tuto fázi?")) return;
    state.config.phases = state.config.phases.filter(x => x.id !== b.getAttribute("data-id"));
    await saveConfig();
    render();
  });

  const empForm = document.getElementById("add-employee-form");
  if(empForm) empForm.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(empForm).entries());
    const name = data.name.trim(), password = data.password.trim();
    if(!name || !password) return;
    if(state.config.employees.some(x => x.name.toLowerCase() === name.toLowerCase())){
      setState({ empError: "Toto jméno už existuje." }); return;
    }
    state.config.employees.push({ id: uid("emp"), name, password });
    state.empError = "";
    await saveConfig();
    render();
  });

  const newProjPicker = document.getElementById("new-project-phase-picker");
  if(newProjPicker) newProjPicker.querySelectorAll(".phase-chip").forEach(chip => chip.onclick = () => chip.classList.toggle("selected"));

  const projForm = document.getElementById("add-project-form");
  if(projForm) projForm.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(projForm).entries());
    const id = data.id.trim(), name = data.name.trim();
    if(!id || !name) return;
    if(state.config.projects.some(x => x.id === id)){
      setState({ projError: "Toto číslo projektu už existuje." }); return;
    }
    const selectedPhases = Array.from(projForm.querySelectorAll(".phase-chip.selected")).map(b => b.getAttribute("data-phase-id"));
    state.config.projects.push({ id, name, phaseIds: selectedPhases });
    state.projError = "";
    await saveConfig();
    render();
  });

  const phaseForm = document.getElementById("add-phase-form");
  if(phaseForm) phaseForm.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(phaseForm).entries());
    const id = data.id.trim(), name = data.name.trim();
    if(!id || !name) return;
    if(state.config.phases.some(x => x.id.toLowerCase() === id.toLowerCase())){
      setState({ phaseError: "Tato zkratka už existuje." }); return;
    }
    state.config.phases.push({ id, name });
    state.phaseError = "";
    await saveConfig();
    render();
  });

  const pwForm = document.getElementById("change-pw-form");
  if(pwForm) pwForm.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(pwForm).entries());
    const pw = data.password.trim();
    if(!pw) return;
    state.config.adminPassword = pw;
    await saveConfig();
    render();
  });

  const importParseBtn = document.getElementById("import-parse-btn");
  if(importParseBtn) importParseBtn.onclick = async () => {
    const fileInput = document.getElementById("import-file-input");
    const empSelect = document.getElementById("import-employee-select");
    if(!fileInput || !fileInput.files.length){ setState({ importError: "Vyberte soubor.", importPreview: null }); return; }
    if(!empSelect || !empSelect.value){ setState({ importError: "Vyberte zaměstnance.", importPreview: null }); return; }
    try{
      const file = fileInput.files[0];
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });

      let headerRowIdx = -1, headerRow = null;
      for(let i = 0; i < Math.min(5, rows.length); i++){
        const joined = (rows[i] || []).map(c => String(c || "").toLowerCase()).join("|");
        if((joined.includes("date") || joined.includes("datum")) && (joined.includes("project") || joined.includes("projekt"))){
          headerRowIdx = i; headerRow = rows[i]; break;
        }
      }
      if(headerRowIdx === -1){ setState({ importError: "Nepodařilo se najít hlavičkový řádek (Datum, Projekt…).", importPreview: null }); return; }

      const findCol = (keywords) => {
        for(let i = 0; i < headerRow.length; i++){
          const h = String(headerRow[i] || "").toLowerCase();
          if(keywords.some(k => h.includes(k))) return i;
        }
        return -1;
      };
      const dateCol = findCol(["date", "datum"]);
      const projCol = findCol(["project", "projekt"]);
      const phaseCol = findCol(["phase", "fáze", "faze"]);
      const noteCol = findCol(["note", "poznámka", "poznamka"]);
      const hoursCol = findCol(["hours", "hodiny"]);
      const costCol = findCol(["cost", "náklad", "naklad"]);
      if(dateCol === -1 || projCol === -1 || hoursCol === -1){
        setState({ importError: "Chybí povinné sloupce (Datum, Projekt, Hodiny).", importPreview: null }); return;
      }

      const knownProjectIds = new Set(state.config.projects.map(p => p.id));
      const knownPhaseIds = new Set(state.config.phases.map(p => p.id));
      const unknownProjects = new Set();
      const unknownPhases = new Set();
      const parsed = [];
      let skipped = 0;

      for(let i = headerRowIdx + 1; i < rows.length; i++){
        const row = rows[i];
        if(!row || row.every(c => c === undefined || c === "")) continue;
        const dateVal = row[dateCol], projVal = row[projCol], hoursVal = row[hoursCol];
        if(dateVal === undefined || projVal === undefined || hoursVal === undefined || hoursVal === "") continue;

        let dateStr = null;
        if(dateVal instanceof Date) dateStr = dateVal.toISOString().slice(0,10);
        else { const d = new Date(dateVal); if(!isNaN(d)) dateStr = d.toISOString().slice(0,10); }
        if(!dateStr) continue;

        const hours = Number(hoursVal);
        if(!(hours > 0)) continue;

        const projStr = String(projVal).trim();
        const projectId = projStr.split(" - ")[0].trim();
        if(!knownProjectIds.has(projectId)){ unknownProjects.add(projStr); skipped++; continue; }

        let phaseId = "";
        if(phaseCol !== -1 && row[phaseCol]){
          const m = String(row[phaseCol]).trim().match(/\[([A-Za-z]+)\]\s*$/);
          if(m) phaseId = m[1].toUpperCase();
          if(phaseId && !knownPhaseIds.has(phaseId)) unknownPhases.add(String(row[phaseCol]));
        }

        const cost = costCol !== -1 ? Number(row[costCol]) || 0 : 0;
        const note = noteCol !== -1 ? String(row[noteCol] || "").trim() : "";
        parsed.push({ id: uid("e"), date: dateStr, projectId, phaseId, hours, cost, note });
      }

      if(parsed.length === 0){ setState({ importError: "V souboru se nenašel žádný platný řádek k importu.", importPreview: null }); return; }

      const totalHours = parsed.reduce((s,e) => s + e.hours, 0);
      const dates = parsed.map(e => e.date).sort();
      setState({
        importError: "",
        importPreview: {
          employeeId: empSelect.value,
          entries: parsed,
          totalHours,
          minDate: dates[0],
          maxDate: dates[dates.length - 1],
          unknownProjects: [...unknownProjects],
          unknownPhases: [...unknownPhases],
          skipped
        }
      });
    } catch(err){
      console.error(err);
      setState({ importError: "Soubor se nepodařilo zpracovat. Zkontrolujte formát.", importPreview: null });
    }
  };

  const importConfirmBtn = document.getElementById("import-confirm-btn");
  if(importConfirmBtn) importConfirmBtn.onclick = async () => {
    const preview = state.importPreview;
    if(!preview) return;
    const emp = state.config.employees.find(e => e.id === preview.employeeId);
    if(!emp) return;
    const existing = await loadEntries(emp.id);
    const merged = existing.concat(preview.entries);
    await saveEntries(emp.id, emp.name, merged);
    state.importPreview = null;
    state.adminEntriesFlat = null;
    showStamp();
    render();
  };

  const importCancelBtn = document.getElementById("import-cancel-btn");
  if(importCancelBtn) importCancelBtn.onclick = () => setState({ importPreview: null, importError: "" });

  const exportBtn = document.getElementById("export-data-btn");
  if(exportBtn) exportBtn.onclick = async () => {
    exportBtn.disabled = true;
    const origText = exportBtn.textContent;
    exportBtn.textContent = "Připravuji…";
    try{
      const entriesByEmployee = await loadEntriesByEmployee();
      const payload = {
        exportedAt: new Date().toISOString(),
        config: state.config,
        entriesByEmployee
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `timesheet-export-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } finally {
      exportBtn.disabled = false;
      exportBtn.textContent = origText;
    }
  };

  const exportExcelBtn = document.getElementById("export-excel-btn");
  if(exportExcelBtn) exportExcelBtn.onclick = async () => {
    exportExcelBtn.disabled = true;
    const origText = exportExcelBtn.textContent;
    exportExcelBtn.textContent = "Připravuji…";
    try{
      const entriesByEmployee = await loadEntriesByEmployee();
      const wb = buildTimesheetWorkbook(entriesByEmployee);
      XLSX.writeFile(wb, `vykazy-export-${new Date().toISOString().slice(0,10)}.xlsx`);
    } finally {
      exportExcelBtn.disabled = false;
      exportExcelBtn.textContent = origText;
    }
  };

  const resetBtn = document.getElementById("reset-app-btn");
  if(resetBtn) resetBtn.onclick = async () => {
    if(!confirm("Opravdu smazat úplně všechna data? Tuto akci nelze vrátit zpět.")) return;
    for(const emp of state.config.employees){ await deleteEntries(emp.id); }
    state.config = { ...DEFAULT_CONFIG };
    await saveConfig();
    state.currentEmployee = null; state.entries = []; state.tab = "app"; state.adminUnlocked = false;
    state.adminEntriesFlat = null; state.adminHoursLoading = false;
    render();
  };
}

function showStamp(){
  const t = document.getElementById("toast");
  t.classList.remove("show"); void t.offsetWidth;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1000);
}

init();
</script>
</body>
</html>
