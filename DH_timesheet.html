<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Časové výkazy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --canvas: #ffffff;
    --paper: #ffffff;
    --ink: #14130f;
    --soft: #8b887f;
    --line: #e7e4dc;
    --sage: #A4AC7F;
    --sage-tint: rgba(164,172,127,0.16);
    --tan: #BA9470;
    --tan-tint: rgba(186,148,112,0.16);
    --danger: #b3382c;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--canvas);
    color: var(--ink);
    font-family:'DM Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding: 148px 18px 60px;
  }
  #tab-content{ margin-top: 14px; }
  .app{ width:100%; max-width: 1320px; }

  .topbar{
    position:fixed; top:0; left:0; right:0;
    width:100%;
    background: var(--paper);
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px clamp(18px, 4vw, 56px) 18px;
    gap:14px;
    z-index: 50;
  }
  .brand{ display:flex; align-items:center; cursor:pointer; }
  .brand:hover{ opacity:.75; }
  .brand img{ height:75px; width:auto; display:block; }
  .topbar-right{ display:flex; align-items:center; gap:18px; }
  .nav-links{ display:flex; gap:26px; }
  .nav-links button{
    background:none; border:none; cursor:pointer;
    font-family:'DM Sans', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color: var(--soft);
    padding:6px 0; border-bottom:2px solid transparent;
  }
  .nav-links button.active{ color: var(--ink); }
  .nav-links button[data-tab="app"].active{ border-color: var(--sage); }
  .nav-links button[data-tab="admin"].active{ border-color: var(--tan); }
  .admin-subnav{ display:flex; gap:22px; margin-bottom:26px; border-bottom:1.5px solid var(--line); }
  .admin-subnav button{
    background:none; border:none; cursor:pointer;
    font-family:'DM Sans', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color: var(--soft);
    padding:6px 0 12px; border-bottom:2px solid transparent; margin-bottom:-1.5px;
  }
  .admin-subnav button.active{ color: var(--ink); border-color: var(--tan); }
  .project-search{ max-width:320px; margin-bottom:20px; }
  .project-list{ display:flex; flex-direction:column; gap:8px; }
  .project-item{ border:1.5px solid var(--line); border-radius:12px; overflow:hidden; }
  .project-item.open{ border-color: var(--soft); }
  .project-head{ display:grid; grid-template-columns: 18px 90px 1fr 110px; gap:12px; padding:0 16px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin-bottom:2px; }
  .project-row{ display:grid; grid-template-columns: 18px 90px 1fr 110px; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; }
  .project-row:hover{ background: var(--sage-tint); }
  .project-row .chevron{ color:var(--soft); font-size:11px; transition:transform .15s; }
  .project-item.open .project-row .chevron{ transform:rotate(90deg); }
  .project-row .name{ font-size:14.5px; }
  .project-hours{ font-size:15px; font-weight:700; text-align:right; color:var(--tan); font-variant-numeric:tabular-nums; }
  .project-hours.zero{ color:var(--soft); font-weight:400; }
  .project-detail{ padding:6px 16px 18px 46px; border-top:1.5px solid var(--line); }
  .project-detail-total{ display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; font-size:14px; color:var(--soft); }
  .project-detail-total b{ color:var(--ink); font-size:17px; }
  .phase-block{ border:1.5px solid var(--line); border-radius:10px; padding:10px 14px; margin-top:8px; }
  .phase-block-head{ display:flex; align-items:center; gap:10px; font-size:13.5px; }
  .phase-block-head b{ margin-left:auto; color:var(--tan); font-variant-numeric:tabular-nums; }
  .phase-employees{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:5px; }
  .phase-employee-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--soft); }
  .phase-employee-row span:last-child{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .logout-link{
    background:none; border:none; cursor:pointer; color:var(--soft);
    font-family:'DM Sans', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; text-decoration:underline;
  }
  .logout-link:hover{ color:var(--ink); }

  h1,h2,h3{ margin:0; }

  .sheet{
    background: transparent;
    padding: 10px 4px 24px;
    min-height: 340px;
    display:flex; flex-direction:column;
    position:relative;
  }
  .eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color: var(--soft); margin-bottom:18px; }
  .eyebrow b{ color: var(--ink); }
  .q-title{ font-weight:800; font-size:30px; line-height:1.2; letter-spacing:-0.01em; margin-bottom:8px; }
  .q-hint{ color: var(--soft); font-size:14px; line-height:1.55; margin-bottom:26px; }
  .q-body{ flex:1; }

  textarea, input[type=text], input[type=date], input[type=month],
  input[type=number], input[type=password], select{
    width:100%;
    border: 1.5px solid var(--line);
    background:#fff;
    padding: 13px 15px;
    font-family:'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.3;
    color: var(--ink);
    border-radius: 10px;
  }
  select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238b887f' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position: right 15px center;
    padding-right: 38px;
  }
  textarea:focus, input:focus, select:focus{ outline:none; border-color: var(--ink); }

  .gate{ text-align:center; padding: 20px 10px; }
  .gate p{ color:var(--soft); font-size:14px; margin: 8px 0 20px; }
  .gate input{ max-width:220px; margin: 0 auto 16px; text-align:center; }

  .admin-block{ margin-bottom: 30px; }
  .admin-block-title{ font-weight:700; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); margin-bottom:14px; padding-bottom:10px; border-bottom:1.5px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .admin-block-title span:first-child{ color: var(--ink); }

  .resp-item{ border:1.5px solid var(--line); border-radius:14px; padding:14px 18px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .resp-item .meta{ font-size:12.5px; color:var(--soft); }
  .admin-project-item{ border:1.5px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:10px; }
  .admin-project-head{ display:flex; align-items:center; gap:10px; }
  .admin-project-head .grow{ flex:1; font-size:14px; }
  .phase-picker-wrap{ margin-top:10px; padding-top:10px; border-top:1.5px solid var(--line); }
  .phase-picker{ display:flex; flex-wrap:wrap; gap:6px; }
  .phase-chip{ border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; color:var(--soft); font-family:'DM Sans', sans-serif; }
  .phase-chip.selected{ background:var(--tan); border-color:var(--tan); color:#fff; }
  .mini-calendar{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:16px; }
  .cal-dow{ font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--soft); text-align:center; padding-bottom:4px; }
  .cal-day{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .cal-day.empty{ visibility:hidden; }
  .cal-daynum{ font-size:11px; color:var(--soft); }
  .cal-hours{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }
  .cal-hours.has{ background:var(--sage); color:#fff; }
  .cal-hours.empty{ background:transparent; }
  .year-overview{ margin-bottom:18px; }
  .year-nav{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .year-label{ font-weight:800; font-size:16px; letter-spacing:-0.01em; }
  .year-total{ font-weight:600; font-size:13px; color:var(--soft); }
  .year-months{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .year-month{ display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:6px 2px; border-radius:10px; }
  .year-month:hover{ background:var(--sage-tint); }
  .year-month.current{ background:var(--sage-tint); }
  .year-month-num{ font-size:10px; color:var(--soft); font-weight:700; }
  .year-month-hours{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }
  .year-month-hours.has{ background:var(--sage); color:#fff; }
  .year-month-hours.empty{ background:transparent; color:var(--soft); }

  .field-row{ margin-bottom:11px; }
  .field-label{ font-size:11px; font-weight:700; color:var(--soft); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px; }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:10px; align-items:end; }
  .entry-form-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:end; }
  .entry-form-row .field-row{ margin-bottom:0; flex:0 0 auto; }
  .entry-form-row input, .entry-form-row select{ padding:10px 11px; font-size:13.5px; }
  .entry-form-row select{ padding-right:32px; background-position: right 11px center; }
  .entry-form-row .w-date{ width:150px; }
  .entry-form-row .w-hours{ width:78px; }
  .entry-form-row .w-select{ width:150px; }
  .entry-form-row .w-cost{ width:100px; }
  .entry-form-row .grow{ flex:1 1 220px; }
  .entry-form-row .w-btn{ flex:0 0 auto; }
  .entry-form-row .w-btn .btn{ padding:10px 22px; white-space:nowrap; }
  .icon-btn{ background:none; border:1.5px solid var(--line); border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:13px; color:var(--soft); line-height:1; flex:none; }
  .icon-btn:hover{ border-color:var(--ink); color:var(--ink); }

  .btn{ font-family:'DM Sans', sans-serif; font-weight:700; font-size:14px; border-radius:999px; padding:13px 26px; cursor:pointer; border:1.5px solid var(--ink); }
  .btn-primary{ background: var(--ink); color:#fff; }
  .btn:disabled{ opacity:.32; cursor:not-allowed; }
  .btn-outline{ background:none; color:var(--ink); }
  .btn-sage{ background: var(--sage); border-color: var(--sage); color:#fff; }
  .btn-tan{ background: var(--tan); border-color: var(--tan); color:#fff; }
  .btn-small{ padding:8px 15px; font-size:12.5px; border-radius:999px; }
  .btn-danger{ border-color: var(--danger); color: var(--danger); background:none; }
  .btn-danger:hover{ background: var(--danger); color:#fff; }

  .empty-state{ text-align:center; color:var(--soft); padding:30px 10px; font-size:14px; border:1.5px dashed var(--line); border-radius:14px; }
  .empty-state .btn{ margin-top:14px; }
  .save-msg{ font-size:12.5px; color: var(--sage); font-weight:700; }

  .totals{ margin-top:4px; margin-bottom:24px; padding:16px 20px; border:1.5px solid var(--line); border-radius:14px; }
  .totals-row{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:14px; color: var(--soft); padding:3px 0; }
  .totals-row.grand{ font-weight:700; margin-top:6px; padding-top:12px; border-top:1.5px solid var(--line); }
  .totals-row.grand span{ color: var(--ink); }
  .totals-row.grand b{ color: var(--tan); font-size:22px; }
  .totals-row b{ color:var(--ink); font-size:15.5px; }

  .entries{ display:flex; flex-direction:column; gap:8px; }
  .entry-head{ display:grid; grid-template-columns: 92px 1fr 90px 64px 84px 1fr 28px 28px; gap:10px; padding:0 14px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin-bottom:2px; }
  .entry-row{ display:grid; grid-template-columns: 92px 1fr 90px 64px 84px 1fr 28px 28px; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; transition:border-color .12s; }
  .entry-row:hover{ border-color: var(--soft); }
  .entry-date{ font-size:13px; color:var(--soft); }
  .entry-proj{ font-size:12.5px; background: var(--sage-tint); color:var(--ink); border-radius:6px; padding:3px 8px; display:inline-block; }
  .entry-proj.gone{ background: var(--tan-tint); color:var(--tan); }
  .entry-phase{ font-size:12px; background: var(--tan-tint); color: var(--tan); border-radius:6px; padding:3px 8px; display:inline-block; }
  .entry-phase.gone{ background: var(--sage-tint); color:var(--soft); }
  .entry-num{ font-size:14px; text-align:right; }
  .entry-note{ font-size:13px; color:var(--soft); white-space:normal; overflow-wrap:break-word; }
  .month-field{ max-width:200px; margin-bottom:22px; }

  .entry-head-compact{ display:grid; grid-template-columns: 92px 64px 84px 1fr 28px 28px; gap:10px; padding:0 14px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin-bottom:2px; }
  .entry-row-compact{ display:grid; grid-template-columns: 92px 64px 84px 1fr 28px 28px; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; transition:border-color .12s; }
  .entry-row-compact:hover{ border-color: var(--soft); }

  .entry-head-wide{ display:grid; grid-template-columns: 92px 130px 1fr 70px 64px 84px 1fr; gap:10px; padding:0 14px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin-bottom:2px; }
  .entry-row-wide{ display:grid; grid-template-columns: 92px 130px 1fr 70px 64px 84px 1fr; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; transition:border-color .12s; }
  .entry-row-wide:hover{ border-color: var(--soft); }

  .entry-head-cost{ display:grid; grid-template-columns: 92px 1fr 90px 90px 1fr; gap:10px; padding:0 14px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin-bottom:2px; }
  .entry-row-cost{ display:grid; grid-template-columns: 92px 1fr 90px 90px 1fr; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; transition:border-color .12s; }
  .entry-row-cost:hover{ border-color: var(--soft); }

  .entry-head-labor{ display:grid; grid-template-columns: 92px 130px 70px 64px 90px 100px; gap:10px; padding:0 14px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin-bottom:2px; }
  .entry-row-labor{ display:grid; grid-template-columns: 92px 130px 70px 64px 90px 100px; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; transition:border-color .12s; }
  .entry-row-labor:hover{ border-color: var(--soft); }

  .stamp-toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background: var(--ink); color:#fff; font-weight:700; font-size:12.5px;
    letter-spacing:.08em; text-transform:uppercase; padding:11px 20px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:80;
  }
  .stamp-toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .app-foot{ color: var(--soft); font-size:12px; text-align:center; margin-top:30px; line-height:1.6; max-width:520px; margin-left:auto; margin-right:auto; }

  @media (max-width:520px){
    .sheet{ padding:10px 2px 20px; }
    .topbar{ padding: 16px 18px 14px; }
    .brand img{ height:59px; }
    .nav-links{ gap:14px; }
    .nav-links button{ font-size:10.5px; }
    .entry-head{ display:none; }
    .entry-row{ grid-template-columns: 1fr; gap:6px; }
    .entry-head-compact{ display:none; }
    .entry-row-compact{ grid-template-columns: 1fr; gap:6px; }
    .entry-head-wide{ display:none; }
    .entry-row-wide{ grid-template-columns: 1fr; gap:6px; }
    .entry-head-cost{ display:none; }
    .entry-row-cost{ grid-template-columns: 1fr; gap:6px; }
    .entry-head-labor{ display:none; }
    .entry-row-labor{ grid-template-columns: 1fr; gap:6px; }
    .project-head{ display:none; }
    .project-row{ grid-template-columns: 16px auto 1fr; }
    .project-hours{ grid-column: 1 / -1; text-align:left; }
    .project-detail{ padding-left:16px; }
    .entry-form-row .field-row{ flex:1 1 100%; width:100%; }
    .entry-form-row .w-date, .entry-form-row .w-hours, .entry-form-row .w-select, .entry-form-row .w-cost, .entry-form-row .grow{ width:100%; }
    .entry-form-row .w-btn .btn{ width:100%; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" class="stamp-toast">✓ Zapsáno</div>

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad2(n){ return String(n).padStart(2, "0"); }
function excelDateToISO(dateVal){
  if(dateVal instanceof Date){
    if(isNaN(dateVal)) return null;
    return `${dateVal.getFullYear()}-${pad2(dateVal.getMonth()+1)}-${pad2(dateVal.getDate())}`;
  }
  if(typeof dateVal === "number" && isFinite(dateVal)){
    const ms = Math.round((dateVal - 25569) * 86400 * 1000);
    const d = new Date(ms);
    if(isNaN(d)) return null;
    return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;
  }
  const str = String(dateVal ?? "").trim();
  if(!str) return null;
  let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = str.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);
  if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  const d = new Date(str);
  if(!isNaN(d)) return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  return null;
}
function phasesForProject(project){
  if(!project || !project.phaseIds || project.phaseIds.length === 0) return [];
  return state.config.phases.filter(ph => project.phaseIds.includes(ph.id));
}
function hourlyRateForEmployee(employee, dateStr){
  if(!employee || !employee.rates || !employee.rates.length || !dateStr) return 0;
  const match = employee.rates.find(r => r.from && r.from <= dateStr && (!r.to || dateStr <= r.to));
  return match ? Number(match.amount) || 0 : 0;
}
function isPhaseClosedOnDate(project, phaseId, dateStr){
  if(!project || !project.closedPhases) return false;
  const closedFrom = project.closedPhases[phaseId];
  if(!closedFrom || !dateStr) return false;
  return dateStr >= closedFrom;
}
function getFormPhaseOptions(project, dateStr){
  const editingEntry = state.editingEntryId ? state.entries.find(e => e.id === state.editingEntryId) : null;
  const keepClosedAnyway = editingEntry && project && editingEntry.projectId === project.id && editingEntry.date === dateStr ? editingEntry.phaseId : null;
  return phasesForProject(project).filter(ph => ph.id === keepClosedAnyway || !isPhaseClosedOnDate(project, ph.id, dateStr));
}
function projectFinancials(p){
  const phaseIds = p.phaseIds || [];
  let totalBudget = 0, totalCosts = 0, totalLabor = 0;
  phaseIds.forEach(pid => {
    const budget = (p.phaseBudgets && p.phaseBudgets[pid] !== undefined) ? p.phaseBudgets[pid] : "";
    totalBudget += budget === "" ? 0 : Number(budget) || 0;
    totalCosts += (state.costs || []).filter(c => c.projectId === p.id && c.phaseId === pid).reduce((s,c) => s + Number(c.amount||0), 0);
    totalLabor += (state.adminEntriesFlat || []).filter(en => en.projectId === p.id && en.phaseId === pid).reduce((s,en) => {
      const emp = state.config.employees.find(x => x.id === en.employeeId);
      return s + Number(en.hours||0) * hourlyRateForEmployee(emp, en.date);
    }, 0);
  });
  return { totalBudget, totalCosts, totalLabor, status: totalBudget - totalCosts - totalLabor };
}
function sortedProjects(){
  return [...state.config.projects].sort((a,b) => {
    const na = Number(a.id), nb = Number(b.id);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a.id).localeCompare(String(b.id));
  });
}
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7); }
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function fmtH(n){ return (Number(n)||0).toLocaleString("cs-CZ",{maximumFractionDigits:2}) + " h"; }
function fmtHShort(n){ return (Number(n)||0).toLocaleString("cs-CZ",{maximumFractionDigits:1}); }
function fmtKc(n){ return (Number(n)||0).toLocaleString("cs-CZ") + " Kč"; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
const MONTH_NAMES_CS = ["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
function fmtMonthLabel(monthStr){
  const [y, m] = monthStr.split("-").map(Number);
  const name = MONTH_NAMES_CS[m-1] || monthStr;
  return `${name.charAt(0).toUpperCase()}${name.slice(1)} ${y}`;
}
function shiftMonth(monthStr, delta){
  const [y, m] = monthStr.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}

async function storageGet(key){
  const r = await fetch(`/api/timesheet?key=${encodeURIComponent(key)}`);
  if(r.status === 404) return null;
  if(!r.ok) throw new Error(`storageGet ${key} failed: ${r.status}`);
  return r.json();
}
async function storageSet(key, value){
  const r = await fetch(`/api/timesheet?key=${encodeURIComponent(key)}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value })
  });
  if(!r.ok) throw new Error(`storageSet ${key} failed: ${r.status}`);
}

}

function sheetSafeName(name, taken){
  let base = String(name || "").replace(/[\/\\?*\[\]:]/g, " ").trim().slice(0, 31) || "Zaměstnanec";
  let candidate = base;
  let n = 2;
  while(taken.has(candidate)){
    const suffix = ` (${n})`;
    candidate = base.slice(0, 31 - suffix.length) + suffix;
    n++;
  }
  taken.add(candidate);
  return candidate;
}

        p.phaseIds = [...PROJECT_PHASE_MAP[p.id]];
        needsSave = true;
      }

      state.config.projects.unshift({ id: "000", name: "DH", phaseless: true, phaseIds: [] });
      needsSave = true;
    }

      state.config.projects.push({ id: "250", name: "GLS - Budca - Hala", phaseIds: [...PROJECT_PHASE_MAP["250"]] });

      { id: "251", name: "Novotná - Stránecká Zhoř" },
      { id: "252", name: "Procházka - Brno" },
      { id: "253", name: "Sapeli - Brno" }
    ].forEach(np => {
      if(!state.config.projects.some(p => p.id === np.id)){
        state.config.projects.push({ ...np, phaseIds: PROJECT_PHASE_MAP[np.id] ? [...PROJECT_PHASE_MAP[np.id]] : [] });
        needsSave = true;
      }
    });
  }
  if(!state.config.phases || state.config.phases.length === 0){
    state.config.phases = DEFAULT_PHASES.map(p => ({ ...p }));
    needsSave = true;
  } else if(!state.config.phases.some(p => p.id === "VC")){
    state.config.phases.push({ id: "VC", name: "Vícepráce" });
    needsSave = true;
  }
  if(needsSave) await saveConfig();

  state.loading = false;
  render();
}

function buildProjectDetail(projectId){
  const project = state.config.projects.find(p => p.id === projectId);
  const phases = state.config.phases;
  const entries = (state.allEntriesFlat || []).filter(e => e.projectId === projectId);
  const totalHours = entries.reduce((s,e) => s + Number(e.hours||0), 0);

  const byPhase = {};
  entries.forEach(e => {
    const pid = e.phaseId || "—";
    byPhase[pid] = (byPhase[pid] || 0) + Number(e.hours||0);
  });

  // zobrazit fáze přiřazené projektu (i s 0 h) + jakoukoli fázi s reálně zapsanými hodinami
  const assignedIds = (project && project.phaseIds) ? project.phaseIds : [];
  const idsWithHours = Object.keys(byPhase);
  const phaseIds = Array.from(new Set([...assignedIds, ...idsWithHours]));
  const masterOrder = phases.map(p => p.id);
  phaseIds.sort((a,b) => {
    const ha = byPhase[a] || 0;
    const hb = byPhase[b] || 0;
    if(hb !== ha) return hb - ha;
    return masterOrder.indexOf(a) - masterOrder.indexOf(b);
  });

  const phaseBlocks = phaseIds.map(pid => {
    const phase = phases.find(p => p.id === pid);
    const label = phase ? `${esc(phase.name)}` : (pid === "—" ? "Bez fáze" : esc(pid));
    const total = byPhase[pid] || 0;
    return `
      <div class="phase-block">
        <div class="phase-block-head"><span class="entry-phase">${phase ? esc(phase.id) : "?"}</span> ${label} <b>${fmtH(total)}</b></div>
      </div>`;
  }).join("");

  return `
    <div class="project-detail">
      <div class="project-detail-total"><span>Projekt celkem</span><b>${fmtH(totalHours)}</b></div>
      ${phaseBlocks || `<div class="q-hint" style="margin:6px 0 0;">Tomuto projektu zatím nejsou přiřazené žádné fáze a nemá ani žádné zapsané hodiny.</div>`}
    </div>`;
}

function myProjectTotals(){

function buildMyProjectDetail(projectId){
  const phases = state.config.phases;
  const entries = state.entries.filter(e => e.projectId === projectId);
  const totalHours = entries.reduce((s,e) => s + Number(e.hours||0), 0);

  const byPhase = {};
  entries.forEach(e => {
    const pid = e.phaseId || "—";
    if(!byPhase[pid]) byPhase[pid] = { total: 0, entries: [] };
    byPhase[pid].total += Number(e.hours||0);
    byPhase[pid].entries.push(e);
  });
  const masterOrder = phases.map(p => p.id);
  const phaseIds = Object.keys(byPhase).sort((a,b) => {
    if(byPhase[b].total !== byPhase[a].total) return byPhase[b].total - byPhase[a].total;
    return masterOrder.indexOf(a) - masterOrder.indexOf(b);
  });
  const phaseBlocks = phaseIds.map(pid => {
    const phase = phases.find(p => p.id === pid);
    const label = phase ? esc(phase.name) : (pid === "—" ? "Bez fáze" : esc(pid));
    const key = `${projectId}::${pid}`;
    const isOpen = state.expandedMyPhaseKey === key;
    const phaseEntries = byPhase[pid].entries.slice().sort((a,b) => b.date.localeCompare(a.date));
    const entryRows = phaseEntries.map(e => `
        <div class="entry-row-compact">
          <span class="entry-date">${esc(e.date)}</span>
          <span class="entry-num">${fmtH(e.hours)}</span>
          <span class="entry-num">${fmtKc(e.cost)}</span>
          <span class="entry-note">${esc(e.note||"")}</span>
          <button class="icon-btn" data-action="edit-entry" data-id="${esc(e.id)}" title="Upravit">✎</button>
          <button class="icon-btn" data-action="delete-entry" data-id="${esc(e.id)}" title="Smazat">×</button>
        </div>`).join("");
    return `
      <div class="phase-block">
        <div class="phase-block-head" data-action="toggle-my-phase-entries" data-key="${esc(key)}" style="cursor:pointer;">
          <span class="chevron" style="margin-right:2px;">${isOpen ? "▾" : "▸"}</span>
          <span class="entry-phase">${phase ? esc(phase.id) : "?"}</span> ${label} <b>${fmtH(byPhase[pid].total)}</b>
        </div>
        ${isOpen ? `
        <div class="phase-employees" style="margin-top:8px;padding-top:8px;">
          <div class="entry-head-compact"><span>Datum</span><span>Hodiny</span><span>Náklady</span><span>Poznámka</span><span></span><span></span></div>
          <div class="entries">${entryRows}</div>
        </div>` : ``}
      </div>`;
  }).join("");

  return `
    <div class="project-detail">
      <div class="project-detail-total"><span>Moje hodiny na projektu</span><b>${fmtH(totalHours)}</b></div>
      ${phaseBlocks || `<div class="q-hint" style="margin:6px 0 0;">Zatím žádné hodiny na tomto projektu.</div>`}
    </div>`;
}

function buildYearOverview(year, hoursByMonthNum, yearTotal, currentMonthNum){
  let cells = "";
  for(let i = 1; i <= 12; i++){
    const mm = String(i).padStart(2,"0");
    const h = hoursByMonthNum[mm] || 0;
    const isCurrent = mm === currentMonthNum;
    cells += `
      <div class="year-month ${isCurrent ? "current" : ""}" data-action="jump-month" data-month="${year}-${mm}">
        <span class="year-month-num">${i}</span>
        <span class="year-month-hours ${h ? "has" : "empty"}">${h ? fmtHShort(h) : ""}</span>
      </div>`;
  }
  return `
    <div class="year-overview">
      <div class="year-nav">
        <button class="icon-btn" data-action="year-prev" type="button">‹</button>
        <span class="year-label">${year} <span class="year-total">· ${fmtH(yearTotal)} celkem</span></span>
        <button class="icon-btn" data-action="year-next" type="button">›</button>
      </div>
      <div class="year-months">${cells}</div>
    </div>`;
}

function buildMiniCalendar(month, hoursByDay){
  const [y, m] = month.split("-").map(Number);
  const firstDay = new Date(y, m - 1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = (firstDay.getDay() + 6) % 7; // 0 = pondělí

  const dow = ["PO","ÚT","ST","ČT","PÁ","SO","NE"];
  let cells = dow.map(d => `<div class="cal-dow">${d}</div>`).join("");
  for(let i = 0; i < startWeekday; i++) cells += `<div class="cal-day empty"></div>`;
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const h = hoursByDay[dateStr] || 0;
    cells += `
      <div class="cal-day">
        <div class="cal-daynum">${d}</div>
        <div class="cal-hours ${h ? "has" : "empty"}">${h ? fmtHShort(h) : ""}</div>
      </div>`;
  }
  return `<div class="mini-calendar">${cells}</div>`;
}

function buildAdminProjectOverviewDetail(projectId){
  const project = state.config.projects.find(p => p.id === projectId);
  const phases = state.config.phases;
  const entries = (state.adminEntriesFlat || []).filter(e => e.projectId === projectId);
  const totalHours = entries.reduce((s,e) => s + Number(e.hours||0), 0);
  const projectCosts = (state.costs || []).filter(c => c.projectId === projectId);
  const totalCostAmount = projectCosts.reduce((s,c) => s + Number(c.amount||0), 0);

  const byPhase = {};
  entries.forEach(e => {
    const pid = e.phaseId || "—";
    if(!byPhase[pid]) byPhase[pid] = { total: 0, byEmployee: {}, costs: [], costTotal: 0 };
    byPhase[pid].total += Number(e.hours||0);
    byPhase[pid].byEmployee[e.employeeName] = (byPhase[pid].byEmployee[e.employeeName] || 0) + Number(e.hours||0);
  });
  projectCosts.forEach(c => {
    const pid = c.phaseId || "—";
    if(!byPhase[pid]) byPhase[pid] = { total: 0, byEmployee: {}, costs: [], costTotal: 0 };
    byPhase[pid].costs.push(c);
    byPhase[pid].costTotal += Number(c.amount||0);
  });

  const assignedIds = (project && project.phaseIds) ? project.phaseIds : [];
  const idsWithHours = Object.keys(byPhase);
  const phaseIds = Array.from(new Set([...assignedIds, ...idsWithHours]));
  const masterOrder = phases.map(p => p.id);
  phaseIds.sort((a,b) => {
    const ha = byPhase[a] ? byPhase[a].total : 0;
    const hb = byPhase[b] ? byPhase[b].total : 0;
    if(hb !== ha) return hb - ha;
    return masterOrder.indexOf(a) - masterOrder.indexOf(b);
  });

  const phaseBlocks = phaseIds.map(pid => {
    const phase = phases.find(p => p.id === pid);
    const label = phase ? `${esc(phase.name)}` : (pid === "—" ? "Bez fáze" : esc(pid));
    const data = byPhase[pid] || { total: 0, byEmployee: {}, costs: [], costTotal: 0 };
    const empRows = Object.entries(data.byEmployee)
      .sort((a,b) => b[1]-a[1])
      .map(([name,h]) => `<div class="phase-employee-row"><span>${esc(name)}</span><span>${fmtH(h)}</span></div>`)
      .join("");
    const costRows = data.costs.slice().sort((a,b) => (b.date||"").localeCompare(a.date||""))
      .map(c => {
        const payLabel = c.paymentMethod === "hotove" ? "hotově" : c.paymentMethod === "ucet" ? "účtem" : "";
        const detail = [c.date, payLabel, c.note].filter(Boolean).join(" · ");
        return `<div class="phase-employee-row"><span>${esc(detail)}</span><span>${fmtKc(c.amount)}</span></div>`;

function projectClosedDate(p){
  const phaseIds = p.phaseIds || [];
  if(!phaseIds.length || !p.closedPhases) return null;
  const dates = phaseIds.map(pid => p.closedPhases[pid]);
  if(dates.some(d => !d)) return null;
  return dates.reduce((max,d) => (d > max ? d : max), dates[0]);
}

function adminClosedProjectsTemplate(){
  if(state.adminEntriesFlat === null || state.costs === null){
    return `<div class="empty-state">Načítání…</div>`;
  }
  const closedProjects = state.config.projects
    .map(p => ({ p, closedDate: projectClosedDate(p) }))
    .filter(x => x.closedDate);
  if(!closedProjects.length){
    return `<div class="empty-state">Zatím žádné ukončené projekty. Projekt se považuje za ukončený, jakmile jsou uzavřené všechny jeho fáze (nastavuje se v detailu projektu).</div>`;
  }

  const years = [...new Set(closedProjects.map(x => x.closedDate.slice(0,4)))].sort((a,b) => b.localeCompare(a));
  const selectedYear = state.closedProjectsYear || "";
  const yearOptions = `<option value="">Všechny roky</option>` + years.map(y => `<option value="${esc(y)}" ${selectedYear === y ? "selected" : ""}>${esc(y)}</option>`).join("");

  const withFinancials = closedProjects.map(x => ({ p: x.p, closedDate: x.closedDate, fin: projectFinancials(x.p) }));
  const totalAll = withFinancials.reduce((s,x) => s + x.fin.status, 0);
  const filtered = withFinancials.filter(x => !selectedYear || x.closedDate.slice(0,4) === selectedYear);
  const totalYear = filtered.reduce((s,x) => s + x.fin.status, 0);
  const sorted = filtered.slice().sort((a,b) => (b.closedDate||"").localeCompare(a.closedDate||""));

  const rows = sorted.map(({p, closedDate, fin}) => {
    const statusColor = fin.status < 0 ? "var(--danger)" : "var(--sage)";
    return `
    <div class="admin-project-head">
      <span class="grow"><span class="entry-proj" data-project-id="${esc(p.id)}">#${esc(p.id)}</span> ${esc(p.name)} <span class="meta">· uzavřeno ${esc(closedDate)}</span></span>
      <span style="font-weight:700;color:${statusColor};">${fmtKc(fin.status)}</span>
    </div>`;
  }).join("");

  return `
    <div class="field-row" style="max-width:220px;"><label class="field-label">Rok ukončení</label><select id="closed-projects-year">${yearOptions}</select></div>
    <p class="q-hint" style="margin:14px 0 18px;">
      Součet zisku všech ukončených projektů: <b style="color:var(--ink);">${fmtKc(totalAll)}</b><br>
      Součet zisku ${selectedYear ? `za rok ${esc(selectedYear)}` : "za všechny roky"}: <b style="color:var(--ink);">${fmtKc(totalYear)}</b>
    </p>
    <div class="project-list">${rows}</div>`;
}

            totalBudget += budgetNum; totalCosts += costsSum; totalLabor += laborSum;
            const phaseHours = phaseEntries.reduce((s,en) => s + Number(en.hours||0), 0);
            const byEmployeePhase = {};
            phaseEntries.forEach(en => { byEmployeePhase[en.employeeName] = (byEmployeePhase[en.employeeName] || 0) + Number(en.hours||0); });
            const empRowsPhaseHtml = Object.entries(byEmployeePhase)
              .sort((a,b) => b[1]-a[1])
              .map(([name,h]) => `<div class="phase-employee-row"><span>${esc(name)}</span><span>${fmtH(h)}</span></div>`)
              .join("");
            return `
            <div class="phase-block" style="margin-bottom:10px;">
              <div class="phase-block-head"><span class="entry-phase">${esc(pid)}</span> ${label} <b>${fmtH(phaseHours)}</b></div>
              ${empRowsPhaseHtml ? `<div class="phase-employees">${empRowsPhaseHtml}</div>` : ``}
              <div class="form-grid" style="margin-top:10px;">
                <div class="field-row"><label class="field-label">Rozpočet (Kč)</label><div style="padding:13px 0;font-weight:700;">${fmtKc(budgetNum)}</div></div>
                <div class="field-row"><label class="field-label">Náklady (Kč)</label><div style="padding:13px 0;font-weight:700;">${fmtKc(costsSum)}</div></div>
                <div class="field-row"><label class="field-label">Mzdové náklady (Kč)</label><div style="padding:13px 0;font-weight:700;">${fmtKc(laborSum)}</div></div>
                <div class="field-row"><label class="field-label">Stav (Kč)</label><div style="padding:13px 0;font-weight:700;color:${statusColor};">${fmtKc(status)}</div></div>
              </div>
              <div class="admin-project-head" style="margin-top:10px;flex-wrap:wrap;row-gap:8px;">
                ${closedFrom ? `
                  <span class="meta">Uzavřeno od ${esc(closedFrom)}</span>
                  <button class="btn btn-outline btn-small" type="button" data-action="reopen-phase" data-project-id="${esc(p.id)}" data-phase-id="${esc(pid)}">Znovu otevřít</button>
                ` : `
                  <input type="date" id="close-date-${esc(p.id)}-${esc(pid)}" style="width:auto;padding:6px 8px;font-size:13px;" value="${esc(todayStr())}">
                  <button class="btn btn-danger btn-small" type="button" data-action="close-phase" data-project-id="${esc(p.id)}" data-phase-id="${esc(pid)}">Uzavřít od</button>
                `}
              </div>
            </div>`;
          }).join("");
          const totalStatus = totalBudget - totalCosts - totalLabor;
          const totalStatusColor = totalStatus < 0 ? "var(--danger)" : "var(--sage)";
          const totalBlockHtml = `
            <div class="phase-block" style="margin-bottom:10px;background:var(--sage-tint);">
              <div class="phase-block-head">Celkem za projekt</div>
              <div class="form-grid" style="margin-top:10px;">
                <div class="field-row"><label class="field-label">Rozpočet (Kč)</label><div style="padding:13px 0;font-weight:700;">${fmtKc(totalBudget)}</div></div>
                <div class="field-row"><label class="field-label">Náklady (Kč)</label><div style="padding:13px 0;font-weight:700;">${fmtKc(totalCosts)}</div></div>
                <div class="field-row"><label class="field-label">Mzdové náklady (Kč)</label><div style="padding:13px 0;font-weight:700;">${fmtKc(totalLabor)}</div></div>
                <div class="field-row"><label class="field-label">Stav (Kč)</label><div style="padding:13px 0;font-weight:700;color:${totalStatusColor};">${fmtKc(totalStatus)}</div></div>
              </div>
            </div>`;
          return phaseBlocksHtml + totalBlockHtml;
          })()}
        </div>` : ``}
        `}

        ${(() => {
          const projectCosts = (state.costs || []).filter(c => c.projectId === p.id).slice().sort((a,b) => (b.date||"").localeCompare(a.date||""));
          const costsTotal = projectCosts.reduce((s,c) => s + Number(c.amount||0), 0);
          const costsRowsHtml = projectCosts.length ? projectCosts.map(c => {
            const phase = state.config.phases.find(x => x.id === c.phaseId);
            return `
            <div class="entry-row-cost">
              <span class="entry-date">${esc(c.date)}</span>
              <span>${phase ? `<span class="entry-phase">${esc(phase.id)}</span>` : `<span class="meta">—</span>`}</span>
              <span class="meta">${c.paymentMethod === "hotove" ? "Hotově" : c.paymentMethod === "ucet" ? "Účtem" : "—"}</span>
              <span class="entry-num">${fmtKc(c.amount)}</span>
              <span class="entry-note">${esc(c.note||"")}</span>
            </div>`;
          }).join("") : `<div class="empty-state">Zatím žádné náklady.</div>`;

          const projectLabor = (state.adminEntriesFlat || []).filter(en => en.projectId === p.id).map(en => {
            const emp = state.config.employees.find(x => x.id === en.employeeId);
            const rate = hourlyRateForEmployee(emp, en.date);
            return { en, rate, amount: Number(en.hours||0) * rate };
          }).sort((a,b) => (b.en.date||"").localeCompare(a.en.date||""));
          const laborTotal = projectLabor.reduce((s,r) => s + r.amount, 0);
          const laborRowsHtml = projectLabor.length ? projectLabor.map(({en, rate, amount}) => {
            const phase = state.config.phases.find(x => x.id === en.phaseId);
            return `
            <div class="entry-row-labor">
              <span class="entry-date">${esc(en.date)}</span>
              <span>${esc(en.employeeName)}</span>
              <span>${phase ? `<span class="entry-phase">${esc(phase.id)}</span>` : `<span class="meta">—</span>`}</span>
              <span class="entry-num">${fmtH(en.hours)}</span>
              <span class="entry-num">${fmtKc(rate)}/h</span>
              <span class="entry-num">${fmtKc(amount)}</span>
            </div>`;
          }).join("") : `<div class="empty-state">Zatím žádné odpracované hodiny.</div>`;

          return `
          <div style="margin-top:28px;padding-top:18px;border-top:1px solid var(--line);">
            <div style="font-weight:700;font-size:15px;margin-bottom:4px;">Klasické náklady</div>
            <p class="q-hint" style="margin:0 0 12px;">Celkem: <b style="color:var(--ink);">${fmtKc(costsTotal)}</b></p>
            <div class="entry-head-cost"><span>Datum</span><span>Fáze</span><span>Platba</span><span>Kč</span><span>Poznámka</span></div>
            <div class="entries">${costsRowsHtml}</div>
          </div>

          <div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--line);">
            <div style="font-weight:700;font-size:15px;margin-bottom:4px;">Mzdové náklady</div>
            <p class="q-hint" style="margin:0 0 12px;">Celkem: <b style="color:var(--ink);">${fmtKc(laborTotal)}</b></p>
            <div class="entry-head-labor"><span>Datum</span><span>Zaměstnanec</span><span>Fáze</span><span>Hodiny</span><span>Sazba</span><span>Náklad</span></div>
            <div class="entries">${laborRowsHtml}</div>
          </div>`;
        })()}

        <div style="margin-top:24px;display:flex;gap:8px;">
          <button class="btn btn-tan" type="submit">Uložit</button>
          <button class="btn btn-outline" type="button" data-action="back-to-projects">Zpět</button>
        </div>
      </form>
    </div>`;
}

function adminBudgetsTemplate(){
  const projects = sortedProjects().filter(p => (p.phaseIds || []).length > 0);
  if(!projects.length){
    return `<div class="empty-state">Zatím nejsou žádné projekty s přiřazenými fázemi.</div>`;
  }
  const blocks = projects.map(p => {
    const rows = (p.phaseIds || []).map(pid => {
      const ph = state.config.phases.find(x => x.id === pid);
      const label = ph ? esc(ph.name) : esc(pid);
      const budget = (p.phaseBudgets && p.phaseBudgets[pid] !== undefined) ? p.phaseBudgets[pid] : "";
      return `
      <div class="admin-project-head" style="margin-bottom:8px;">
        <span class="entry-phase">${esc(pid)}</span>
        <span class="grow">${label}</span>
        <input type="number" min="0" step="1" placeholder="Rozpočet Kč" style="width:140px;padding:6px 8px;font-size:13px;" data-project-id="${esc(p.id)}" data-phase-id="${esc(pid)}" value="${esc(budget)}">
      </div>`;
    }).join("");
    return `
    <div class="admin-project-item">
      <div class="admin-project-head"><span class="grow"><span class="entry-proj" data-project-id="${esc(p.id)}">#${esc(p.id)}</span> ${esc(p.name)}</span></div>
      <div style="margin-top:8px;">${rows}</div>
    </div>`;
  }).join("");
  return `
    <p class="q-hint" style="margin:0 0 14px;">Rozpočet jednotlivých fází napříč všemi projekty. Zobrazují se jen fáze, které má daný projekt aktuálně přiřazené (zaškrtnuté).</p>
    <form id="budgets-form">
      ${blocks}
      <div style="margin-top:16px;"><button class="btn btn-tan" type="submit">Uložit rozpočty</button></div>
    </form>`;
}

function adminSectionHeader(key, label, rightHtml){
  const isOpen = state.adminOpenSection === key;
  return `
    <div class="admin-block-title">
      <span data-action="toggle-admin-section" data-section="${key}" style="cursor:pointer;display:inline-flex;align-items:center;gap:8px;">
        <span style="display:inline-block;width:10px;">${isOpen ? "▾" : "▸"}</span>${label}
      </span>
      ${isOpen && rightHtml ? rightHtml : ""}
    </div>`;
}

            <div style="display:flex;gap:8px;margin-top:8px;">

            </div>
          </div>
        ` : ``}
        ${costImportFormHtml()}
        ` : ``}
      </div>

      <div class="admin-block">
        ${adminSectionHeader("export", "Export")}
        ${state.adminOpenSection === "export" ? `
        <p class="q-hint" style="margin:0 0 8px;">Stáhne kompletní zálohu všech dat (zaměstnanci, projekty, fáze, všechny výkazy) do jednoho JSON souboru.</p>
        <button class="btn btn-outline btn-small" id="export-data-btn">Exportovat data (JSON)</button>

        <p class="q-hint" style="margin:20px 0 8px;">Stáhne Excel soubor se záložkou pro každého zaměstnance a všemi jeho odpracovanými hodinami.</p>
        <button class="btn btn-outline btn-small" id="export-excel-btn">Exportovat Excel (XLSX)</button>

        <p class="q-hint" style="margin:20px 0 8px;">Stáhne Excel soubor se všemi náklady projektů.</p>
        <button class="btn btn-outline btn-small" id="export-costs-btn">Exportovat náklady (XLSX)</button>
        ` : ``}
      </div>

      <div class="admin-block">
        ${adminSectionHeader("security", "Zabezpečení")}
        ${state.adminOpenSection === "security" ? `
        <form id="change-pw-form">
          <div class="form-grid">
            <div class="field-row"><label class="field-label">Nové admin heslo</label><input type="text" name="password" required></div>
            <div class="field-row"><button class="btn btn-outline btn-small" type="submit">Uložit</button></div>
          </div>
        </form>

        <p class="q-hint" style="margin:20px 0 8px;">Smaže všechny zaměstnance, projekty, fáze i jejich výkazy. Nevratné.</p>
        <button class="btn btn-danger btn-small" id="reset-app-btn">Smazat všechna data</button>
        ` : ``}
      </div>
      ` : ``}
    </div>`;
}

/* ---------------- bindings ---------------- */

function bindApp(){
  const gotoAdmin = document.getElementById("goto-admin-btn") || document.getElementById("goto-admin-btn2");
  if(gotoAdmin) gotoAdmin.onclick = () => setState({ tab: "admin" });

  if(changeMyPwForm) changeMyPwForm.addEventListener("submit", async e => {

    if(!emp) return;

    await saveConfig();

  const projectSelect = document.getElementById("entry-project-select");
  const phaseSelect = document.getElementById("entry-phase-select");
  const phaseFieldRow = document.getElementById("phase-field-row");
  const phaseWarning = document.getElementById("phase-warning");
  const noteInput = document.getElementById("entry-note-input");
  const noteLabel = document.getElementById("entry-note-label");
  const submitBtn = document.getElementById("add-entry-form") ? document.getElementById("add-entry-form").querySelector('button[type="submit"]') : null;

  function updateNoteRequirement(){
    if(!noteInput || !phaseSelect) return;
    const isAD = phaseSelect.value === "AD";
    if(isAD){
      noteInput.setAttribute("required", "required");
      noteInput.placeholder = "povinné u autorského dozoru";
      if(noteLabel) noteLabel.textContent = "Poznámka *";
    } else {
      noteInput.removeAttribute("required");
      noteInput.placeholder = "nepovinné";
      if(noteLabel) noteLabel.textContent = "Poznámka";
    }
  }

  const dateInput = document.getElementById("entry-date-input");

  function refreshPhaseOptions(){
    if(!projectSelect || !phaseSelect) return;
    const project = state.config.projects.find(p => p.id === projectSelect.value);
    if(project && project.phaseless){
      if(phaseFieldRow) phaseFieldRow.style.display = "none";
      phaseSelect.removeAttribute("required");
      phaseSelect.innerHTML = `<option value="">—</option>`;
      if(phaseWarning) phaseWarning.style.display = "none";
      if(submitBtn) submitBtn.disabled = false;
      updateNoteRequirement();
      return;
    }
    if(phaseFieldRow) phaseFieldRow.style.display = "";
    phaseSelect.setAttribute("required", "required");
    const dateStr = dateInput ? dateInput.value : todayStr();
    const prevValue = phaseSelect.value;
    const phases = getFormPhaseOptions(project, dateStr);
    phaseSelect.innerHTML = phases.length
      ? phases.map(p => `<option value="${esc(p.id)}">${esc(p.id)} — ${esc(p.name)}${isPhaseClosedOnDate(project, p.id, dateStr) ? " (uzavřeno)" : ""}</option>`).join("")
      : `<option value="" disabled selected>— žádné fáze —</option>`;
    if(phases.some(p => p.id === prevValue)) phaseSelect.value = prevValue;
    if(phaseWarning) phaseWarning.style.display = phases.length ? "none" : "";
    if(submitBtn) submitBtn.disabled = phases.length === 0;
    updateNoteRequirement();
  }

  if(projectSelect && phaseSelect){
    projectSelect.addEventListener("change", refreshPhaseOptions);
    if(dateInput) dateInput.addEventListener("change", refreshPhaseOptions);
    phaseSelect.addEventListener("change", updateNoteRequirement);
    updateNoteRequirement();
  }

  const nameInput = document.getElementById("name-input-field");
  const nameSubmitBtn = document.getElementById("name-submit-btn");
  const diacriticsPattern = "[" + String.fromCharCode(92,117,48,51,48,48) + "-" + String.fromCharCode(92,117,48,51,54,102) + "]";
  const normalizeName = s => s.trim().toLowerCase().normalize("NFD").replace(new RegExp(diacriticsPattern, "g"), "");
  const tryResolveName = () => {
    if(!nameInput) return;
    const typed = normalizeName(nameInput.value);
    if(!typed) return;
    const match = state.config.employees.find(e => normalizeName(e.name.trim().split(/\s+/)[0]) === typed);
    if(match){
      setState({ selectedEmployeeId: match.id, nameInputValue: nameInput.value, nameInputError: "", loginError: false });
      const passInput = document.getElementById("login-pass-input");
      if(passInput) passInput.focus();
    } else {
      setState({ nameInputValue: nameInput.value, nameInputError: "Jméno nenalezeno, zkontrolujte prosím zadání." });
    }
  };
  if(nameSubmitBtn) nameSubmitBtn.onclick = tryResolveName;
  if(nameInput) nameInput.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); tryResolveName(); } });

  const loginInput = document.getElementById("login-pass-input");
  const loginBtn = document.getElementById("login-submit-btn");
  if(loginBtn){
    const tryLogin = async () => {
      const emp = state.config.employees.find(x => x.id === state.selectedEmployeeId);
      if(emp && loginInput.value === emp.password){
        state.currentEmployee = emp;
        state.entries = await loadEntries(emp.id);
        state.selectedEmployeeId = null;
        state.loginError = false;
        state.month = new Date().toISOString().slice(0,7);
        render();
      } else {
        setState({ loginError: true });
      }
    };
    loginBtn.onclick = tryLogin;
    loginInput.addEventListener("keydown", e => { if(e.key === "Enter") tryLogin(); });
  }

  const monthPrevBtn = document.querySelector('[data-action="month-prev"]');
  const monthNextBtn = document.querySelector('[data-action="month-next"]');
  if(monthPrevBtn) monthPrevBtn.onclick = () => setState({ month: shiftMonth(state.month, -1) });
  if(monthNextBtn) monthNextBtn.onclick = () => setState({ month: shiftMonth(state.month, 1) });

  const yearPrevBtn = document.querySelector('[data-action="year-prev"]');
  const yearNextBtn = document.querySelector('[data-action="year-next"]');
  if(yearPrevBtn) yearPrevBtn.onclick = () => {
    const [y, m] = state.month.split("-");
    setState({ month: `${Number(y)-1}-${m}` });
  };
  if(yearNextBtn) yearNextBtn.onclick = () => {

    state.entries = state.entries.filter(en => en.id !== b.getAttribute("data-id"));
    if(state.editingEntryId === b.getAttribute("data-id")) state.editingEntryId = null;
    await saveEntries(state.currentEmployee.id, state.currentEmployee.name, state.entries);
    render();

  document.querySelectorAll('[data-action="edit-entry"]').forEach(b => b.onclick = () => {
    setState({ editingEntryId: b.getAttribute("data-id") });

  const addEntryForm = document.getElementById("add-entry-form");
  if(addEntryForm) addEntryForm.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(addEntryForm).entries());
    const project = state.config.projects.find(p => p.id === data.projectId);
    const isPhaseless = !!(project && project.phaseless);
    const fields = { date: data.date, hours: Number(data.hours), projectId: data.projectId, phaseId: data.phaseId, cost: Number(data.cost)||0, note: (data.note||"").trim() };
    if(!fields.date || !fields.hours || !fields.projectId || (!isPhaseless && !fields.phaseId)) return;
    if(fields.phaseId === "AD" && !fields.note) return;
    if(!isPhaseless && !getFormPhaseOptions(project, fields.date).some(p => p.id === fields.phaseId)){
      setState({ entryError: "Tato fáze je k zadanému datu uzavřená, hodiny pod ni nelze zapsat." });
      return;
    }
    state.entryError = "";

    if(state.editingEntryId){
      const idx = state.entries.findIndex(en => en.id === state.editingEntryId);
      if(idx !== -1) state.entries[idx] = { ...state.entries[idx], ...fields };
      state.editingEntryId = null;
    } else {
      state.entries.push({ id: uid("e"), ...fields });
    }
    await saveEntries(state.currentEmployee.id, state.currentEmployee.name, state.entries);
    showStamp();
    render();
  });
}

  const importParseBtn = document.getElementById("import-parse-btn");
  if(importParseBtn) importParseBtn.onclick = async () => {
    const fileInput = document.getElementById("import-file-input");
    const empSelect = document.getElementById("import-employee-select");
    if(!fileInput || !fileInput.files.length){ setState({ importError: "Vyberte soubor.", importPreview: null }); return; }
    if(!empSelect || !empSelect.value){ setState({ importError: "Vyberte zaměstnance.", importPreview: null }); return; }
    try{
      const file = fileInput.files[0];
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });

      let headerRowIdx = -1, headerRow = null;
      for(let i = 0; i < Math.min(5, rows.length); i++){
        const joined = (rows[i] || []).map(c => String(c || "").toLowerCase()).join("|");
        if((joined.includes("date") || joined.includes("datum")) && (joined.includes("project") || joined.includes("projekt"))){
          headerRowIdx = i; headerRow = rows[i]; break;
        }
      }
      if(headerRowIdx === -1){ setState({ importError: "Nepodařilo se najít hlavičkový řádek (Datum, Projekt…).", importPreview: null }); return; }

      const findCol = (keywords) => {
        for(let i = 0; i < headerRow.length; i++){
          const h = String(headerRow[i] || "").toLowerCase();
          if(keywords.some(k => h.includes(k))) return i;
        }
        return -1;
      };
      const dateCol = findCol(["date", "datum"]);
      const projCol = findCol(["project", "projekt"]);
      const phaseCol = findCol(["phase", "fáze", "faze"]);
      const noteCol = findCol(["note", "poznámka", "poznamka"]);
      const hoursCol = findCol(["hours", "hodiny"]);
      const costCol = findCol(["cost", "náklad", "naklad"]);
      if(dateCol === -1 || projCol === -1 || hoursCol === -1){
        setState({ importError: "Chybí povinné sloupce (Datum, Projekt, Hodiny).", importPreview: null }); return;
      }

      const knownProjectIds = new Set(state.config.projects.map(p => p.id));
      const knownPhaseIds = new Set(state.config.phases.map(p => p.id));
      const unknownProjects = new Set();
      const unknownPhases = new Set();
      const parsed = [];
      let skipped = 0;

      for(let i = headerRowIdx + 1; i < rows.length; i++){
        const row = rows[i];
        if(!row || row.every(c => c === undefined || c === "")) continue;
        const dateVal = row[dateCol], projVal = row[projCol], hoursVal = row[hoursCol];
        if(dateVal === undefined || projVal === undefined || hoursVal === undefined || hoursVal === "") continue;

        const dateStr = excelDateToISO(dateVal);
        if(!dateStr) continue;

        const hours = Number(hoursVal);
        if(!(hours > 0)) continue;

        const projStr = String(projVal).trim();
        const projectId = projStr.split(" - ")[0].trim();
        if(!knownProjectIds.has(projectId)){ unknownProjects.add(projStr); skipped++; continue; }

        let phaseId = "";
        if(phaseCol !== -1 && row[phaseCol]){
          const m = String(row[phaseCol]).trim().match(/\[([A-Za-z]+)\]\s*$/);
          if(m) phaseId = m[1].toUpperCase();
          if(phaseId && !knownPhaseIds.has(phaseId)) unknownPhases.add(String(row[phaseCol]));
        }

        const cost = costCol !== -1 ? Number(row[costCol]) || 0 : 0;
        const note = noteCol !== -1 ? String(row[noteCol] || "").trim() : "";
        parsed.push({ id: uid("e"), date: dateStr, projectId, phaseId, hours, cost, note });
      }

      if(parsed.length === 0){ setState({ importError: "V souboru se nenašel žádný platný řádek k importu.", importPreview: null }); return; }

      const totalHours = parsed.reduce((s,e) => s + e.hours, 0);
      const dates = parsed.map(e => e.date).sort();
      setState({
        importError: "",
        importPreview: {
          employeeId: empSelect.value,
          entries: parsed,
          totalHours,
          minDate: dates[0],
          maxDate: dates[dates.length - 1],
          unknownProjects: [...unknownProjects],
          unknownPhases: [...unknownPhases],
          skipped
        }
      });
    } catch(err){
      console.error(err);
      setState({ importError: "Soubor se nepodařilo zpracovat. Zkontrolujte formát.", importPreview: null });
    }
  };

  const importConfirmBtn = document.getElementById("import-confirm-btn");
  if(importConfirmBtn) importConfirmBtn.onclick = async () => {
    const preview = state.importPreview;
    if(!preview) return;
    const emp = state.config.employees.find(e => e.id === preview.employeeId);
    if(!emp) return;
    const existing = await loadEntries(emp.id);
    const merged = existing.concat(preview.entries);
    await saveEntries(emp.id, emp.name, merged);
    state.importPreview = null;
    state.adminEntriesFlat = null;
    showStamp();
    render();
  };

  const importCancelBtn = document.getElementById("import-cancel-btn");
  if(importCancelBtn) importCancelBtn.onclick = () => setState({ importPreview: null, importError: "" });

  const costProjectSelect = document.getElementById("cost-project-select");
  const costPhaseSelect = document.getElementById("cost-phase-select");
  if(costProjectSelect && costPhaseSelect) costProjectSelect.addEventListener("change", () => {
    const project = state.config.projects.find(p => p.id === costProjectSelect.value);
    const phases = project ? phasesForProject(project) : [];
    costPhaseSelect.innerHTML = `<option value="">—</option>` + phases.map(p => `<option value="${esc(p.id)}">${esc(p.id)} — ${esc(p.name)}</option>`).join("");
  });

  const addCostForm = document.getElementById("add-cost-form");
  if(addCostForm) addCostForm.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(addCostForm).entries());
    const amount = Number(data.amount);
    if(!data.date || !data.projectId || !(amount >= 0) || !data.paymentMethod) return;
    const fields = { date: data.date, projectId: data.projectId, phaseId: data.phaseId || "", amount, paymentMethod: data.paymentMethod, note: (data.note || "").trim() };
    if(!state.costs) state.costs = [];
    if(state.editingCostId){
      const idx = state.costs.findIndex(c => c.id === state.editingCostId);
      if(idx !== -1) state.costs[idx] = { ...state.costs[idx], ...fields };
      state.editingCostId = null;
    } else {
      state.costs.push({ id: uid("cost"), ...fields });
    }
    state.costError = "";
    await saveCosts();
    render();
  });

  const cancelEditCostBtn = document.getElementById("cancel-edit-cost-btn");
  if(cancelEditCostBtn) cancelEditCostBtn.onclick = () => setState({ editingCostId: null, costError: "" });

  document.querySelectorAll('[data-action="edit-cost"]').forEach(b => b.onclick = () => {
    setState({ editingCostId: b.getAttribute("data-id") });
  });
  document.querySelectorAll('[data-action="delete-cost"]').forEach(b => b.onclick = async () => {
    if(!confirm("Smazat tento náklad?")) return;
    state.costs = (state.costs || []).filter(c => c.id !== b.getAttribute("data-id"));
    if(state.editingCostId === b.getAttribute("data-id")) state.editingCostId = null;
    await saveCosts();
    render();
  });

  const costImportParseBtn = document.getElementById("cost-import-parse-btn");
  if(costImportParseBtn) costImportParseBtn.onclick = async () => {
    const fileInput = document.getElementById("cost-import-file-input");
    if(!fileInput || !fileInput.files.length){ setState({ costImportError: "Vyberte soubor.", costImportPreview: null }); return; }
    try{
      const file = fileInput.files[0];
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });

      let headerRowIdx = -1, headerRow = null;
      for(let i = 0; i < Math.min(5, rows.length); i++){
        const joined = (rows[i] || []).map(c => String(c || "").toLowerCase()).join("|");
        if((joined.includes("date") || joined.includes("datum")) && (joined.includes("project") || joined.includes("projekt"))){
          headerRowIdx = i; headerRow = rows[i]; break;
        }
      }
      if(headerRowIdx === -1){ setState({ costImportError: "Nepodařilo se najít hlavičkový řádek (Datum, Projekt…).", costImportPreview: null }); return; }

      const findCol = (keywords) => {
        for(let i = 0; i < headerRow.length; i++){
          const h = String(headerRow[i] || "").toLowerCase();
          if(keywords.some(k => h.includes(k))) return i;
        }
        return -1;
      };
      const dateCol = findCol(["date", "datum"]);
      const projCol = findCol(["project", "projekt"]);
      const phaseCol = findCol(["phase", "fáze", "faze"]);
      const noteCol = findCol(["note", "poznámka", "poznamka", "za co"]);
      const amountCol = findCol(["cena", "cost", "náklad", "naklad", "částka", "castka"]);
      const paymentCol = findCol(["platba", "hotov", "účet", "ucet", "způsob", "zpusob"]);
      if(dateCol === -1 || projCol === -1 || amountCol === -1){
        setState({ costImportError: "Chybí povinné sloupce (Datum, Projekt, Cena).", costImportPreview: null }); return;
      }

      const knownProjectIds = new Set(state.config.projects.map(p => p.id));
      const knownPhaseIds = new Set(state.config.phases.map(p => p.id));
      const unknownProjects = new Set();
      const parsed = [];
      let skipped = 0;

      for(let i = headerRowIdx + 1; i < rows.length; i++){
        const row = rows[i];
        if(!row || row.every(c => c === undefined || c === "")) continue;
        const dateVal = row[dateCol], projVal = row[projCol], amountVal = row[amountCol];
        if(dateVal === undefined || projVal === undefined || amountVal === undefined || amountVal === "") continue;

        const dateStr = excelDateToISO(dateVal);
        if(!dateStr) continue;

        const amount = Number(amountVal);
        if(!(amount >= 0)) continue;

        const projStr = String(projVal).trim();
        const projectId = projStr.split(" - ")[0].trim();
        if(!knownProjectIds.has(projectId)){ unknownProjects.add(projStr); skipped++; continue; }

        let phaseId = "";
        if(phaseCol !== -1 && row[phaseCol]){
          const phStr = String(row[phaseCol]).trim();
          const m = phStr.match(/\[([A-Za-z]+)\]\s*$/);
          const candidate = (m ? m[1] : phStr).toUpperCase();
          if(knownPhaseIds.has(candidate)) phaseId = candidate;
        }

        let paymentMethod = "";
        if(paymentCol !== -1 && row[paymentCol]){
          const pStr = String(row[paymentCol]).trim().toLowerCase();
          paymentMethod = pStr.includes("hotov") ? "hotove" : "ucet";
        }

        const note = noteCol !== -1 ? String(row[noteCol] || "").trim() : "";
        parsed.push({ id: uid("cost"), date: dateStr, projectId, phaseId, amount, paymentMethod, note });
      }

      if(parsed.length === 0){ setState({ costImportError: "V souboru se nenašel žádný platný řádek k importu.", costImportPreview: null }); return; }

      const totalAmount = parsed.reduce((s,c) => s + c.amount, 0);
      const dates = parsed.map(c => c.date).sort();
      setState({
        costImportError: "",
        costImportPreview: {
          items: parsed,
          totalAmount,
          minDate: dates[0],
          maxDate: dates[dates.length - 1],
          unknownProjects: [...unknownProjects],
          skipped
        }
      });
    } catch(err){
      console.error(err);
      setState({ costImportError: "Soubor se nepodařilo zpracovat. Zkontrolujte formát.", costImportPreview: null });
    }
  };

  const costImportConfirmBtn = document.getElementById("cost-import-confirm-btn");
  if(costImportConfirmBtn) costImportConfirmBtn.onclick = async () => {
    const preview = state.costImportPreview;
    if(!preview) return;
    if(!state.costs) state.costs = [];
    state.costs = state.costs.concat(preview.items);
    state.costImportPreview = null;
    await saveCosts();
    showStamp();
    render();
  };

  const costImportCancelBtn = document.getElementById("cost-import-cancel-btn");
  if(costImportCancelBtn) costImportCancelBtn.onclick = () => setState({ costImportPreview: null, costImportError: "" });

  const exportCostsBtn = document.getElementById("export-costs-btn");
  if(exportCostsBtn) exportCostsBtn.onclick = async () => {
    exportCostsBtn.disabled = true;
    const origText = exportCostsBtn.textContent;
    try{
      const costs = state.costs === null ? await loadCosts() : state.costs;
      const wb = buildCostsWorkbook(costs);
      XLSX.writeFile(wb, `naklady-export-${new Date().toISOString().slice(0,10)}.xlsx`);
    } finally {
      exportCostsBtn.disabled = false;
      exportCostsBtn.textContent = origText;
    }
  };

  const costFilterProject = document.getElementById("cost-filter-project");
  if(costFilterProject) costFilterProject.addEventListener("change", () => setState({ costFilterProjectId: costFilterProject.value }));
  const costFilterPhase = document.getElementById("cost-filter-phase");
  if(costFilterPhase) costFilterPhase.addEventListener("change", () => setState({ costFilterPhaseId: costFilterPhase.value }));
  const costFilterPayment = document.getElementById("cost-filter-payment");
  if(costFilterPayment) costFilterPayment.addEventListener("change", () => setState({ costFilterPayment: costFilterPayment.value }));
  const costFilterResetBtn = document.getElementById("cost-filter-reset-btn");
  if(costFilterResetBtn) costFilterResetBtn.onclick = () => setState({ costFilterProjectId: "", costFilterPhaseId: "", costFilterPayment: "" });

  const recordsFilterFrom = document.getElementById("records-filter-from");
  if(recordsFilterFrom) recordsFilterFrom.addEventListener("change", () => setState({ recordsFilterFrom: recordsFilterFrom.value }));
  const recordsFilterTo = document.getElementById("records-filter-to");
  if(recordsFilterTo) recordsFilterTo.addEventListener("change", () => setState({ recordsFilterTo: recordsFilterTo.value }));
  const recordsFilterProject = document.getElementById("records-filter-project");
  if(recordsFilterProject) recordsFilterProject.addEventListener("change", () => setState({ recordsFilterProjectId: recordsFilterProject.value }));
  const recordsFilterPhase = document.getElementById("records-filter-phase");
  if(recordsFilterPhase) recordsFilterPhase.addEventListener("change", () => setState({ recordsFilterPhaseId: recordsFilterPhase.value }));
  const recordsFilterResetBtn = document.getElementById("records-filter-reset-btn");
  if(recordsFilterResetBtn) recordsFilterResetBtn.onclick = () => setState({ recordsFilterFrom: "", recordsFilterTo: "", recordsFilterProjectId: "", recordsFilterPhaseId: "" });

  const closedProjectsYear = document.getElementById("closed-projects-year");
  if(closedProjectsYear) closedProjectsYear.addEventListener("change", () => setState({ closedProjectsYear: closedProjectsYear.value }));

  const exportBtn = document.getElementById("export-data-btn");
  if(exportBtn) exportBtn.onclick = async () => {
    exportBtn.disabled = true;
    const origText = exportBtn.textContent;
    exportBtn.textContent = "Připravuji…";
    try{
      const entriesByEmployee = await loadEntriesByEmployee();
      const payload = {
        exportedAt: new Date().toISOString(),
        config: state.config,
        entriesByEmployee
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `timesheet-export-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } finally {
      exportBtn.disabled = false;
      exportBtn.textContent = origText;
    }
  };

  const exportExcelBtn = document.getElementById("export-excel-btn");
  if(exportExcelBtn) exportExcelBtn.onclick = async () => {
    exportExcelBtn.disabled = true;
    const origText = exportExcelBtn.textContent;
    exportExcelBtn.textContent = "Připravuji…";
    try{
      const entriesByEmployee = await loadEntriesByEmployee();
      const wb = buildTimesheetWorkbook(entriesByEmployee);
      XLSX.writeFile(wb, `vykazy-export-${new Date().toISOString().slice(0,10)}.xlsx`);
    } finally {
      exportExcelBtn.disabled = false;
      exportExcelBtn.textContent = origText;
    }
  };

  const resetBtn = document.getElementById("reset-app-btn");
  if(resetBtn) resetBtn.onclick = async () => {
    if(!confirm("Opravdu smazat úplně všechna data? Tuto akci nelze vrátit zpět.")) return;
    for(const emp of state.config.employees){ await deleteEntries(emp.id); }
    state.config = { ...DEFAULT_CONFIG };
    await saveConfig();
    state.currentEmployee = null; state.entries = []; state.tab = "app"; state.adminUnlocked = false;
    state.adminEntriesFlat = null; state.adminHoursLoading = false;
    render();
  };
}

function showStamp(){
  const t = document.getElementById("toast");
  t.classList.remove("show"); void t.offsetWidth;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1000);
}

init();
</script>
</body>
</html>
